<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dịch Câu Theo Bài</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --bg:#F4F6FC; --navy:#1F2D55; --muted:#667089; --line:#D9DEEA; --cream:#FFFCF3; --banner:#FFF8E6;
  --blue:#2F6FB7; --ochre:#A8740F; --ochre-soft:#FFEBB8; --ok-bg:#CFEBD3; --miss-bg:#F9D5CB; --miss:#B03A20;
  --tape-y:#FFD977; --tape-b:#A8CFF0; --tape-g:#A9DDB6; --tape-r:#F5B4A6;
  --ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --disp:'Baloo 2','Nunito',sans-serif;
  --read:'Source Serif 4',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--navy);font:700 16px/1.55 var(--ui);-webkit-font-smoothing:antialiased;
  padding-block:16px 56px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wrap.narrow{max-width:780px}
button,select{font:inherit;color:inherit}

/* header */
.head.big{display:flex;align-items:center;gap:22px}
.logo{flex:none;width:126px;height:126px;border-radius:20px;background:#EBF0FA;display:grid;place-items:center;background-image:radial-gradient(#D5DDEE 1px,transparent 1.2px);background-size:9px 9px}
.head h1{margin:0 0 6px;font:800 34px/1.15 var(--ui);letter-spacing:-.2px}
.head p{margin:0;color:var(--muted);font-weight:600;font-size:17px;line-height:1.45}
.head.mini{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between}
.head.mini h1{margin:0;font:800 22px/1.2 var(--ui)}
.crumb{font-size:14px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;font-weight:700}
.crumb b{color:var(--navy);font-weight:800}
a.home{color:var(--blue);text-decoration:underline;text-underline-offset:3px}

/* banner */
.banner{display:flex;align-items:center;gap:18px;background:var(--banner);border:2px solid var(--navy);border-radius:20px;padding:18px 22px;box-shadow:3px 3px 0 var(--navy)}
.banner .txt{flex:1}
.banner h2{margin:0 0 4px;font:800 19px/1.3 var(--ui)}
.banner p{margin:0;color:#4F5876;font-weight:600;font-size:15.5px;line-height:1.5}

/* buttons */
button{font:800 15.5px/1 var(--ui);padding:12px 18px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;min-height:44px}
button:hover:not(:disabled){border-color:var(--navy)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.25)}
button.primary:hover:not(:disabled){background:#2A3C70}
button.hint{background:var(--ochre-soft);border-color:transparent;color:var(--ochre)}
button.ghost{background:transparent}
.btn-big{padding:15px 22px;font-size:17px;border-radius:14px}

/* tabs / pills / filter */
.tabs{display:inline-flex;gap:4px;padding:5px;background:#EEF1F8;border:1.5px solid var(--line);border-radius:16px;align-self:flex-start}
.tab{border:0;background:transparent;padding:10px 16px;border-radius:12px;font-size:16px;color:#5A6482;display:flex;gap:8px;align-items:center}
.tab.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(31,45,85,.14)}
.scope{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scope .lab{color:#5A6482;font-size:15.5px;margin-right:2px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:15.5px;min-height:0}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.filter{background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.filter>button{width:100%;display:flex;align-items:center;gap:10px;padding:16px 18px;background:none;border:0;font-size:18px;text-align:left;border-radius:0}
.filter>button .chev{margin-left:auto;transition:transform .2s;font-size:13px;color:#6A7390}
.filter.open>button .chev{transform:rotate(180deg)}
.filter .body{display:none;padding:0 18px 16px;border-top:1px dashed var(--line)}
.filter.open .body{display:block}
.filter .hintx{margin:12px 0 10px;color:var(--muted);font-weight:600;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14.5px;min-height:0}
.chip.on{background:#E6EDFB;border-color:var(--navy)}
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fbar .pills{display:flex;gap:9px;flex-wrap:wrap;flex:1}
.sort{display:flex;align-items:center;gap:8px;color:#5A6482;font-size:15.5px}
.sort select{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:15.5px;cursor:pointer}

/* grid cards */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 20px;padding-top:14px}
.gh{font:800 18px/1.3 var(--ui);margin:10px 0 -2px;color:var(--navy)}
.tcard{height:100%;align-self:stretch;position:relative;text-align:left;display:block;width:100%;background:var(--cream);border:2px solid var(--navy);border-radius:20px;padding:20px 18px 14px;box-shadow:4px 4px 0 var(--navy);cursor:pointer;
  transition:transform .12s,box-shadow .12s;font-family:var(--disp);color:var(--navy);min-height:0;line-height:1.2}
.tcard:hover:not(:disabled){transform:translate(-1px,-2px);box-shadow:6px 6px 0 var(--navy);border-color:var(--navy)}
.tcard:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--navy)}
.tape{position:absolute;top:-13px;left:50%;width:84px;height:26px;transform:translateX(-50%) rotate(-1.2deg);opacity:.92;border-radius:2px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 3px,transparent 3px 6px)}
.t0 .tape{background-color:var(--tape-y)}.t1 .tape{background-color:var(--tape-b)}.t2 .tape{background-color:var(--tape-g)}.t3 .tape{background-color:var(--tape-r)}
.tcard .top{display:flex;gap:12px;align-items:center}
.tcard .top>div{min-width:0}
.tcard .bk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:#59627E;font-weight:600;line-height:1.15}
.tcard .tn{font-size:22px;font-weight:700;line-height:1.15;margin:1px 0 4px}
.tcard .meta{font-size:15px;color:#6D7690;font-weight:500;line-height:1.2}
.pbar{height:10px;border-radius:99px;background:#E6EAF4;border:1.5px solid var(--line);overflow:hidden;margin:16px 0 12px}
.pbar i{display:block;height:100%;background:var(--ochre,#E0A93B);border-radius:99px;transition:width .3s}
.status{font-size:15.5px;font-weight:600;color:#59627E;padding-top:8px;border-top:1px solid rgba(31,45,85,.1)}
.status.mid{color:var(--ochre)}.status.fin{color:#2E7D4A}
.empty{padding:40px;text-align:center;color:var(--muted);font-weight:600}

/* content cards (read / translate / result) */
.card{background:var(--cream);border:2px solid var(--navy);border-radius:20px;padding:24px;box-shadow:4px 4px 0 var(--navy)}
.eyebrow{font:800 12px/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.prompt{font:italic 400 16px/1.6 var(--read);color:var(--muted);margin:0 0 18px;padding-bottom:16px;border-bottom:1.5px dashed var(--line)}
.essay h2{font:700 24px/1.3 var(--disp);margin:0 0 14px;text-wrap:balance}
.essay p{font:400 18px/1.75 var(--read);margin:0 0 14px;max-width:65ch;color:#26304F}
.essay p.prompt{font:italic 400 16px/1.6 var(--read);color:var(--muted)}
.essay p:last-of-type{margin-bottom:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.progress{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.bar{flex:1;height:10px;border-radius:6px;background:#E3E8F3;overflow:hidden;border:1.5px solid var(--navy)}
.bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.vi{font:700 21px/1.55 var(--ui);margin:0 0 16px;text-wrap:pretty}
textarea{width:100%;min-height:112px;resize:vertical;font:400 18px/1.6 var(--read);color:var(--navy);background:#fff;border:1.5px solid var(--navy);border-radius:12px;padding:12px 14px}
.hintline{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--ochre-soft);font:400 17px/1.9 var(--read);display:flex;flex-wrap:wrap;gap:2px 8px}
.hintline[hidden]{display:none}
.hintline .w{white-space:nowrap}
.hintline .hid{letter-spacing:.06em;color:var(--ochre);opacity:.75}
.hintline .rev{font-weight:600;color:var(--navy);background:#fff;border-radius:4px;padding:0 4px}
.hintnote{font-size:13.5px;color:var(--muted);font-weight:600}
.result{margin-top:18px;display:flex;flex-direction:column;gap:14px}
.result[hidden]{display:none}
.score{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.score strong{font:800 30px/1 var(--ui);font-variant-numeric:tabular-nums}
.score span{color:var(--muted);font-size:14px;font-weight:600}
.cmp{font:400 18px/1.8 var(--read);margin:0;padding:12px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--line)}
.cmp small{display:block;font:800 11px/1.5 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ok{background:var(--ok-bg);border-radius:3px;padding:0 2px}
.miss{background:var(--miss-bg);color:var(--miss);border-radius:3px;padding:0 2px;font-weight:600}
.extra{text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.fine{font-size:13px;color:var(--muted);margin:0;font-weight:600}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline;padding:10px 0;border-top:1.5px dashed var(--line)}
.rows li:first-child{border-top:0}
.rows .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rows .t{font:600 16px/1.5 var(--ui);min-width:0}
.rows .p{font:800 14px/1 var(--ui);font-variant-numeric:tabular-nums;white-space:nowrap}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sum div{padding:14px;border:2px solid var(--navy);border-radius:14px;background:#fff}
.sum b{display:block;font:800 28px/1.1 var(--ui);font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--muted);font-weight:600}

@media (max-width:1020px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:780px){
  .grid{grid-template-columns:repeat(2,1fr);gap:20px 14px}
  .head.big{gap:14px}.logo{width:88px;height:88px}.logo svg{width:70px}
  .head h1{font-size:26px}.head p{font-size:15px}
  .banner{flex-wrap:wrap}.banner button{width:100%}
}
@media (max-width:520px){.grid{grid-template-columns:1fr}.card{padding:16px}.essay p{font-size:17px}.vi{font-size:19px}.sort{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.vtoggle{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:var(--disp);font-size:20px;color:var(--navy)}.vtoggle small{font:700 13px var(--ui);color:var(--muted);margin-left:8px}.vtoggle b{font:800 13px var(--ui);border:2px solid var(--line);border-radius:10px;padding:4px 12px;background:#fff}.vtoggle:focus-visible{outline:3px solid var(--ochre-soft);outline-offset:4px}#vwrap{margin-top:12px}.ventry .ex.more{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
.vocab .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.vchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.vchip{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:4px 12px;font:800 13px var(--ui);cursor:pointer}
.vchip.on{background:var(--navy);color:#fff}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ventry{border:2px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px}
.ventry .term{font:800 16px var(--ui);color:var(--navy)}
.ventry .tag{display:inline-block;font:800 11px var(--ui);border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:2px}
.tag.v{background:var(--tape-y)}.tag.c{background:var(--tape-b)}.tag.t{background:var(--tape-g)}
.ventry .vi{margin:3px 0 6px;font-size:15px}
.ventry .ex{margin:0;font:italic 14px/1.5 'Source Serif 4',Georgia,serif;color:var(--muted)}
.ventry .ex mark{background:var(--ochre-soft);color:var(--navy);border-radius:3px;padding:0 2px;font-style:normal;font-weight:600}

.miss{background:var(--ochre-soft)!important;color:var(--navy)!important}
.kts{margin-top:12px}.kts small{display:block;color:var(--muted);margin-bottom:6px;font-weight:700}
.kt{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;border:2px solid var(--line);border-radius:10px;background:#fff;padding:6px 10px;margin-bottom:6px}
.kt b{color:var(--navy)}.kt span{color:var(--muted);font-size:14px}
.kt.used{border-color:#5BA46E;background:var(--ok-bg)}

.alts{margin-top:10px}.alts p{margin:4px 0;padding-left:10px;border-left:3px solid var(--tape-b)}
</style>

<div class="wrap" id="app">
  <header id="hd"></header>
  <main id="view" style="display:flex;flex-direction:column;gap:18px"></main>
</div>

<script>
const ESSAYS = [{"title": "Food Laws", "prompt": "Some people think that the public health of a country can be improved if the government makes laws regarding nutritious food, but others think that it is a matter of personal choice and personal responsibility. Discuss both views and give your opinion.", "paras": ["Opinion is sharply divided on whether governments should legislate on food quality or leave diet as a purely individual matter. I believe legislation is the more effective lever, although it works best when paired with education that encourages people to take responsibility.", "Supporters of personal choice have a reasonable case. Adults are entitled to decide what goes on their plates, and rules that dictate menus can feel paternalistic. A person who eats fast food daily, fully aware of the risks, is arguably exercising a freedom that the state has no business removing. There is also the matter of information. Labels, apps and websites make it simple to check calories and ingredients before buying, so anyone who wants to eat well can do so without being told. Compulsory measures may only provoke resentment and push consumers toward unregulated alternatives. However, individual freedom has limits when the consequences of poor diets are shared by the whole society.", "In my view, legislation offers advantages that personal choice cannot match. Many people have little real choice to begin with, because cheap, heavily processed products dominate supermarket shelves and advertising. This is particularly true in low-income areas, where fresh produce is scarce or costly. Labels can also be misleading, and children cannot be expected to resist marketing designed to exploit them. Laws deliver measurable results across a whole population. Limiting sugar and salt in manufactured foods or taxing sugary drinks has reduced consumption in countries that adopted such measures. The resulting fall in obesity and diabetes also eases the burden on public hospitals that every taxpayer helps to fund. Voluntary pledges from food companies have rarely changed what ends up on the shelves.", "In conclusion, individual responsibility matters, but it cannot succeed in an environment that nudges people toward poor diets. Governments should therefore set firm rules on what food companies sell and how they advertise it, with schools and public campaigns helping people to use the healthier options that result."], "sents": [{"p": 0, "en": "Opinion is sharply divided on whether governments should legislate on food quality or leave diet as a purely individual matter.", "vi": "Ý kiến phân hóa sâu sắc về việc chính phủ nên ban hành luật về chất lượng thực phẩm hay để chế độ ăn hoàn toàn là chuyện của mỗi cá nhân.", "alts": ["Opinions differ sharply on whether governments should regulate food quality by law or leave diet as a purely personal matter.", "People are deeply divided over whether the government should pass laws on food quality or leave what people eat entirely to individuals.", "Views are sharply split on whether governments ought to legislate on food quality or treat diet as an entirely private matter."]}, {"p": 0, "en": "I believe legislation is the more effective lever, although it works best when paired with education that encourages people to take responsibility.", "vi": "Tôi cho rằng luật pháp là công cụ hiệu quả hơn, dù biện pháp này phát huy tốt nhất khi đi kèm giáo dục để mỗi người có trách nhiệm hơn với bản thân.", "alts": ["I believe legislation is the more effective approach, although it works best when combined with education that encourages people to take responsibility.", "In my opinion, laws are the more effective tool, even though they work best alongside education that encourages people to take responsibility.", "I believe laws are the more effective lever, although they work best when paired with education that encourages people to take responsibility."]}, {"p": 1, "en": "Supporters of personal choice have a reasonable case.", "vi": "Những người ủng hộ quyền tự lựa chọn cũng có lập luận khá thuyết phục.", "alts": ["Supporters of individual choice have a fair argument.", "Advocates of personal choice make a reasonable point.", "Advocates of personal choice have a reasonable argument."]}, {"p": 1, "en": "Adults are entitled to decide what goes on their plates, and rules that dictate menus can feel paternalistic.", "vi": "Người trưởng thành có quyền quyết định mình ăn gì, và những quy định áp đặt thực đơn có thể bị xem là can thiệp quá sâu.", "alts": ["Adults have the right to decide what they eat, and rules that dictate menus can seem paternalistic.", "Adults are entitled to choose what ends up on their plates, and rules that dictate menus can come across as paternalistic.", "Adults are entitled to choose what they eat, and rules that dictate menus can feel paternalistic."]}, {"p": 1, "en": "A person who eats fast food daily, fully aware of the risks, is arguably exercising a freedom that the state has no business removing.", "vi": "Một người ngày nào cũng ăn đồ ăn nhanh dù biết rõ rủi ro có thể nói là đang thực hiện quyền tự do mà nhà nước không có tư cách gì để tước đi.", "alts": ["Someone who eats fast food every day, fully aware of the risks, is arguably exercising a freedom that the government has no right to take away.", "A person who eats fast food daily in full knowledge of the risks can be said to be exercising a freedom that the state should not remove."]}, {"p": 1, "en": "There is also the matter of information.", "vi": "Ngoài ra còn có yếu tố thông tin.", "alts": ["Information is another factor to consider.", "There is also the issue of information."]}, {"p": 1, "en": "Labels, apps and websites make it simple to check calories and ingredients before buying, so anyone who wants to eat well can do so without being told.", "vi": "Nhờ nhãn mác, ứng dụng và trang web, việc kiểm tra lượng calo và thành phần trước khi mua rất dễ dàng, nên ai muốn ăn uống lành mạnh đều làm được mà không cần ai bắt buộc.", "alts": ["Labels, apps and websites make it easy to check calories and ingredients before buying, so anyone who wants to eat healthily can do so without being told.", "With labels, apps and websites, it is simple to check calories and ingredients before purchasing, so people who want to eat well do not need to be told how."]}, {"p": 1, "en": "Compulsory measures may only provoke resentment and push consumers toward unregulated alternatives.", "vi": "Các biện pháp cưỡng chế có thể chỉ gây bức xúc và đẩy người tiêu dùng sang những sản phẩm nằm ngoài sự quản lý.", "alts": ["Mandatory measures may simply cause resentment and push consumers towards unregulated alternatives.", "Compulsory rules could provoke resentment and drive consumers to unregulated alternatives.", "Compulsory measures may simply cause resentment and drive consumers to unregulated alternatives."]}, {"p": 1, "en": "However, individual freedom has limits when the consequences of poor diets are shared by the whole society.", "vi": "Tuy nhiên, tự do cá nhân cũng có giới hạn khi hậu quả của một chế độ ăn thiếu lành mạnh do cả xã hội gánh chịu.", "alts": ["However, individual freedom has limits when the consequences of unhealthy diets are borne by society as a whole.", "Nevertheless, personal freedom is limited when the whole of society bears the consequences of poor diets."]}, {"p": 2, "en": "In my view, legislation offers advantages that personal choice cannot match.", "vi": "Theo tôi, luật pháp có những ưu điểm mà sự lựa chọn cá nhân không thể sánh được.", "alts": ["In my opinion, legislation brings benefits that personal choice cannot match.", "I believe that laws offer advantages which individual choice simply cannot provide.", "In my opinion, legislation offers advantages that individual choice cannot match."]}, {"p": 2, "en": "Many people have little real choice to begin with, because cheap, heavily processed products dominate supermarket shelves and advertising.", "vi": "Nhiều người ngay từ đầu đã chẳng có mấy lựa chọn thực sự, vì các sản phẩm rẻ tiền, chế biến sẵn chiếm gần hết kệ hàng siêu thị và quảng cáo.", "alts": ["Many people have little genuine choice to begin with, as cheap, highly processed products dominate supermarket shelves and advertising.", "For many people there is little real choice in the first place, since cheap, heavily processed food dominates supermarkets and advertising."]}, {"p": 2, "en": "This is particularly true in low-income areas, where fresh produce is scarce or costly.", "vi": "Điều này đặc biệt đúng ở những khu thu nhập thấp, nơi rau quả tươi khan hiếm hoặc đắt đỏ.", "alts": ["This is especially true in low-income areas, where fresh produce is scarce or expensive.", "This is particularly the case in poorer neighbourhoods, where fresh produce is hard to find or costly."]}, {"p": 2, "en": "Labels can also be misleading, and children cannot be expected to resist marketing designed to exploit them.", "vi": "Nhãn mác cũng có thể gây hiểu lầm, và không thể trông chờ trẻ em tự chống lại những chiêu tiếp thị vốn được thiết kế để nhắm vào chúng.", "alts": ["Labels can also be misleading, and children cannot be expected to resist marketing that is designed to exploit them.", "In addition, labels may be misleading, and it is unrealistic to expect children to resist marketing that is aimed at exploiting them."]}, {"p": 2, "en": "Laws deliver measurable results across a whole population.", "vi": "Luật pháp cho kết quả đo lường được trên quy mô toàn dân.", "alts": ["Laws produce measurable results across a whole population.", "Legislation delivers results that can be measured across an entire population.", "Laws deliver measurable results across an entire population."]}, {"p": 2, "en": "Limiting sugar and salt in manufactured foods or taxing sugary drinks has reduced consumption in countries that adopted such measures.", "vi": "Việc hạn chế đường và muối trong thực phẩm chế biến công nghiệp hay đánh thuế đồ uống có đường đã làm giảm mức tiêu thụ ở các nước áp dụng.", "alts": ["Restricting sugar and salt in processed foods or taxing sugary drinks has cut consumption in countries that have introduced such measures.", "In countries that limited sugar and salt in manufactured food or taxed sugary drinks, consumption has fallen.", "Restricting sugar and salt in manufactured food or putting a tax on sugary drinks has cut consumption in countries that adopted such measures."]}, {"p": 2, "en": "The resulting fall in obesity and diabetes also eases the burden on public hospitals that every taxpayer helps to fund.", "vi": "Tỷ lệ béo phì và tiểu đường giảm theo cũng làm nhẹ áp lực cho các bệnh viện công, vốn được nuôi bằng tiền thuế của mọi người dân.", "alts": ["The resulting decline in obesity and diabetes also reduces the pressure on public hospitals, which every taxpayer helps to fund.", "The fall in obesity and diabetes that follows also eases the burden on public hospitals that all taxpayers help to pay for."]}, {"p": 2, "en": "Voluntary pledges from food companies have rarely changed what ends up on the shelves.", "vi": "Những cam kết tự nguyện của các công ty thực phẩm hiếm khi thay đổi được những gì thực sự được bày bán trên kệ.", "alts": ["Voluntary commitments from food companies have seldom changed what ends up on the shelves.", "Voluntary pledges by food manufacturers have rarely altered what is actually sold.", "Voluntary pledges by food manufacturers have seldom changed what ends up on the shelves."]}, {"p": 3, "en": "In conclusion, individual responsibility matters, but it cannot succeed in an environment that nudges people toward poor diets.", "vi": "Tóm lại, trách nhiệm cá nhân là quan trọng, nhưng khó phát huy trong một môi trường luôn đẩy người ta về phía chế độ ăn thiếu lành mạnh.", "alts": ["In conclusion, personal responsibility matters, but it cannot work in an environment that pushes people towards poor diets.", "To conclude, individual responsibility is important, yet it cannot succeed where the surrounding environment nudges people towards unhealthy diets.", "To conclude, individual responsibility is important, but it cannot work in an environment that nudges people towards unhealthy diets."]}, {"p": 3, "en": "Governments should therefore set firm rules on what food companies sell and how they advertise it, with schools and public campaigns helping people to use the healthier options that result.", "vi": "Vì vậy, chính phủ nên đặt ra những quy định chặt chẽ về việc các công ty thực phẩm bán gì và quảng bá ra sao, còn trường học và các chiến dịch truyền thông giúp mọi người biết tận dụng những lựa chọn lành mạnh hơn mà các quy định đó tạo ra.", "alts": ["Governments should therefore lay down firm rules on what food companies sell and how they advertise it, with schools and public campaigns helping people to use the healthier options that result.", "For this reason, governments should set strict rules on what food companies sell and how they promote it, while schools and public campaigns help people benefit from the healthier choices that follow.", "Governments should thus lay down firm rules on what food companies sell and how they market it, while schools and public campaigns help people to make use of the healthier choices that follow."]}], "no": 1, "type": "Discuss both views", "words": 326}, {"title": "Online Privacy", "prompt": "More people today put their personal and private information online (address, telephone number, credit card number) to do everyday activities such as banking, shopping, and socializing. Is this a positive or negative development?", "paras": ["Online banking, shopping and social networking now require people to hand over addresses, phone numbers and card details. Although this brings real convenience, I believe it is a negative development overall, because the risks fall almost entirely on the individual.", "The benefits of sharing personal details online are easy to see. Time saving is the most obvious. Paying a bill through an app takes seconds, whereas it once meant queuing at a branch during working hours, and online shopping removes the need to travel between stores. Banking apps also send instant alerts, so people can track their spending and spot problems early. Online platforms also widen access and connection. Stored card details let shoppers compare prices and buy from sellers anywhere in the world. Sharing a phone number or location also makes it simple to stay in touch with friends or help relatives who live far away. However, these gains are small compared with the lasting harm that a single leak of personal data can cause.", "In reality, the dangers are more serious, and they fall on the individual. Theft is the most damaging. Large companies are breached regularly, and stolen records are sold to criminals. They use them to empty bank accounts or take out loans in a victim's name, leaving victims to spend months dealing with banks and credit agencies. Such fraud is hard to trace, since criminals often operate from other countries. Older people, who are less familiar with phishing scams, are especially vulnerable. Furthermore, personal data is a commercial product. Even without a breach, firms routinely collect and trade personal details to build consumer profiles. Users are then tracked across websites and shown advertising they never agreed to receive. Such profiles can also influence the prices and offers a person is shown.", "In conclusion, while online services save time, the exposure of private information to theft and commercial exploitation outweighs those gains. Until companies face stricter penalties for failing to protect data, this trend remains more harmful than helpful."], "sents": [{"p": 0, "en": "Online banking, shopping and social networking now require people to hand over addresses, phone numbers and card details.", "vi": "Ngày nay, ngân hàng trực tuyến, mua sắm và mạng xã hội đều yêu cầu người dùng cung cấp địa chỉ, số điện thoại và thông tin thẻ.", "alts": ["Online banking, shopping and social media now require people to hand over their addresses, phone numbers and card details.", "These days, banking, shopping and socialising online all require people to give away their addresses, phone numbers and card details."]}, {"p": 0, "en": "Although this brings real convenience, I believe it is a negative development overall, because the risks fall almost entirely on the individual.", "vi": "Dù điều này mang lại sự tiện lợi thực sự, tôi cho rằng nhìn chung đây là một xu hướng tiêu cực, vì rủi ro gần như hoàn toàn đổ lên đầu cá nhân.", "alts": ["Although this brings real convenience, I believe it is a negative trend overall, because the risks fall almost entirely on individuals.", "While this is undoubtedly convenient, I think it is a harmful development on the whole, as individuals bear almost all of the risk.", "While this offers real convenience, I think it is a harmful trend overall, since the risks are borne almost entirely by individuals."]}, {"p": 1, "en": "The benefits of sharing personal details online are easy to see.", "vi": "Lợi ích của việc chia sẻ thông tin cá nhân trên mạng thì dễ thấy.", "alts": ["The advantages of sharing personal information online are obvious.", "It is easy to see the benefits of sharing personal details online."]}, {"p": 1, "en": "Time saving is the most obvious.", "vi": "Rõ ràng nhất là tiết kiệm thời gian.", "alts": ["Saving time is the most obvious.", "The most evident is time saving.", "Time saving is the most evident."]}, {"p": 1, "en": "Paying a bill through an app takes seconds, whereas it once meant queuing at a branch during working hours, and online shopping removes the need to travel between stores.", "vi": "Thanh toán hóa đơn qua ứng dụng chỉ mất vài giây, trong khi trước đây phải xếp hàng ở chi nhánh trong giờ hành chính, và mua sắm trực tuyến giúp người ta khỏi phải chạy hết cửa hàng này đến cửa hàng khác.", "alts": ["Paying a bill through an app takes seconds, whereas it used to mean queuing at a branch during working hours, and online shopping removes the need to travel from shop to shop.", "A bill can be paid in seconds via an app, while people once had to wait in line at a branch during opening hours, and online shopping saves them from going from store to store."]}, {"p": 1, "en": "Banking apps also send instant alerts, so people can track their spending and spot problems early.", "vi": "Ứng dụng ngân hàng còn gửi thông báo ngay lập tức, nhờ đó mọi người theo dõi được chi tiêu và sớm phát hiện bất thường.", "alts": ["Banking apps also send instant alerts, so people can keep track of their spending and notice problems early.", "In addition, banking apps send instant notifications, which allows users to monitor their spending and spot problems at an early stage."]}, {"p": 1, "en": "Online platforms also widen access and connection.", "vi": "Các nền tảng trực tuyến cũng giúp mở rộng cơ hội tiếp cận và kết nối.", "alts": ["Online platforms also expand access and connection.", "Digital platforms also make it easier for people to access services and stay connected."]}, {"p": 1, "en": "Stored card details let shoppers compare prices and buy from sellers anywhere in the world.", "vi": "Thông tin thẻ được lưu sẵn cho phép người mua so sánh giá và mua hàng từ người bán ở bất cứ đâu trên thế giới.", "alts": ["Saved card details allow shoppers to compare prices and buy from sellers anywhere in the world.", "Stored card details enable shoppers to compare prices and purchase from sellers around the globe."]}, {"p": 1, "en": "Sharing a phone number or location also makes it simple to stay in touch with friends or help relatives who live far away.", "vi": "Việc chia sẻ số điện thoại hay vị trí cũng giúp dễ giữ liên lạc với bạn bè hoặc hỗ trợ người thân ở xa.", "alts": ["Sharing a phone number or location also makes it easy to keep in touch with friends or help relatives who live far away.", "Giving out a phone number or location also makes it simple to stay in contact with friends and support relatives who live far away."]}, {"p": 1, "en": "However, these gains are small compared with the lasting harm that a single leak of personal data can cause.", "vi": "Tuy nhiên, những lợi ích này chẳng đáng kể so với tác hại lâu dài mà chỉ một vụ lộ dữ liệu cá nhân cũng có thể gây ra.", "alts": ["However, these benefits are minor compared with the lasting damage that a single leak of personal data can cause.", "Nevertheless, these gains are small when set against the long-term harm that one leak of personal data can do.", "Nevertheless, these benefits are minor compared with the lasting harm that one leak of personal data can do."]}, {"p": 2, "en": "In reality, the dangers are more serious, and they fall on the individual.", "vi": "Thực tế, những mối nguy này nghiêm trọng hơn nhiều, và người phải gánh chịu chính là cá nhân.", "alts": ["In reality, the risks are more serious, and individuals have to bear them.", "In fact, the dangers are far greater, and it is the individual who suffers.", "In fact, the risks are more serious, and they are borne by the individual."]}, {"p": 2, "en": "Theft is the most damaging.", "vi": "Thiệt hại nặng nề nhất là nạn đánh cắp thông tin.", "alts": ["Theft is the most harmful of these."]}, {"p": 2, "en": "Large companies are breached regularly, and stolen records are sold to criminals.", "vi": "Các công ty lớn thường xuyên bị tấn công, và dữ liệu bị đánh cắp được bán cho tội phạm.", "alts": ["Large companies are hacked regularly, and stolen records are sold to criminals.", "Big companies are breached on a regular basis, and the stolen records end up being sold to criminals."]}, {"p": 2, "en": "They use them to empty bank accounts or take out loans in a victim's name, leaving victims to spend months dealing with banks and credit agencies.", "vi": "Chúng dùng dữ liệu đó để rút sạch tài khoản hoặc vay nợ dưới tên nạn nhân, khiến họ mất nhiều tháng làm việc với ngân hàng và các tổ chức tín dụng.", "alts": ["Criminals use them to drain bank accounts or take out loans in a victim's name, leaving victims to spend months dealing with banks and credit agencies.", "They are used to empty bank accounts or borrow money in someone else's name, and victims then spend months sorting things out with banks and credit agencies."]}, {"p": 2, "en": "Such fraud is hard to trace, since criminals often operate from other countries.", "vi": "Loại gian lận này rất khó truy vết, vì tội phạm thường hoạt động từ nước ngoài.", "alts": ["This kind of fraud is difficult to trace, because criminals often operate from other countries.", "Such fraud is hard to track down, as the offenders are frequently based abroad.", "This kind of fraud is hard to track down, because criminals frequently operate from abroad."]}, {"p": 2, "en": "Older people, who are less familiar with phishing scams, are especially vulnerable.", "vi": "Người lớn tuổi, vốn ít quen với các chiêu lừa đảo qua mạng, đặc biệt dễ trở thành nạn nhân.", "alts": ["Elderly people, who are less familiar with phishing scams, are particularly vulnerable.", "Older people are especially at risk because they know less about phishing scams.", "Elderly people, who know less about phishing scams, are particularly vulnerable."]}, {"p": 2, "en": "Furthermore, personal data is a commercial product.", "vi": "Hơn nữa, dữ liệu cá nhân còn là một mặt hàng thương mại.", "alts": ["Moreover, personal data is a commercial product.", "Personal data is also something that companies buy and sell.", "In addition, personal data is a product that companies sell."]}, {"p": 2, "en": "Even without a breach, firms routinely collect and trade personal details to build consumer profiles.", "vi": "Ngay cả khi không bị lộ, thông tin cá nhân vẫn thường xuyên bị các công ty thu thập và mua bán để lập hồ sơ người tiêu dùng.", "alts": ["Even without a breach, firms routinely collect and sell personal information to build consumer profiles.", "Even when no breach occurs, companies regularly gather and trade personal details in order to create consumer profiles.", "Even when there is no breach, companies routinely gather and sell personal information to create consumer profiles."]}, {"p": 2, "en": "Users are then tracked across websites and shown advertising they never agreed to receive.", "vi": "Người dùng sau đó bị theo dõi từ trang web này sang trang web khác và liên tục nhận những quảng cáo mà họ chưa từng đồng ý xem.", "alts": ["Users are then followed across websites and shown adverts they never agreed to see.", "As a result, users are tracked from site to site and shown advertising that they never consented to."]}, {"p": 2, "en": "Such profiles can also influence the prices and offers a person is shown.", "vi": "Những hồ sơ như vậy thậm chí còn có thể ảnh hưởng đến mức giá và ưu đãi mà mỗi người được thấy.", "alts": ["These profiles can also influence the prices and offers that a person sees.", "Such profiles can even affect the prices and deals that individuals are shown."]}, {"p": 3, "en": "In conclusion, while online services save time, the exposure of private information to theft and commercial exploitation outweighs those gains.", "vi": "Tóm lại, dù các dịch vụ trực tuyến giúp tiết kiệm thời gian, nguy cơ thông tin riêng tư bị đánh cắp hoặc bị khai thác vì mục đích thương mại còn lớn hơn những lợi ích đó.", "alts": ["In conclusion, although online services save time, exposing private information to theft and commercial exploitation outweighs those benefits.", "To conclude, online services may save time, but the exposure of private data to theft and commercial exploitation outweighs this advantage."]}, {"p": 3, "en": "Until companies face stricter penalties for failing to protect data, this trend remains more harmful than helpful.", "vi": "Chừng nào các công ty chưa bị xử phạt nghiêm hơn vì không bảo vệ được dữ liệu, xu hướng này vẫn có hại nhiều hơn có lợi.", "alts": ["Until companies face tougher penalties for failing to protect data, this trend will remain more harmful than helpful.", "As long as companies are not punished more severely for failing to protect data, this trend will do more harm than good.", "Until companies are subject to tougher penalties for failing to protect data, this trend remains more harmful than beneficial."]}], "no": 2, "type": "Positive or negative", "words": 333}, {"title": "Global Sameness", "prompt": "Nowadays, products such as clothing, brands, and movies across different countries are all the same. To what extent do the advantages outweigh the disadvantages?", "paras": ["Global trade and media have made it possible to buy the same shirts, eat at the same restaurants and watch the same films almost anywhere. While this uniformity has some practical benefits for ordinary consumers, I think the disadvantages are more significant.", "On the positive side, standardised products offer practical benefits in terms of price and familiarity. When a company manufactures one sneaker or one smartphone for the entire world, mass production lowers the cost per item. Consumers in poorer countries then gain access to goods they could not otherwise afford. A single design and marketing campaign can also be reused in dozens of markets, which keeps prices low. Familiar brands make travel and communication easier. A traveller can recognise a trusted shop in an unfamiliar city. A film released worldwide at the same time also gives audiences in different nations a common topic of conversation. However, these advantages are largely matters of convenience, and they come at a price that local communities end up paying.", "The drawbacks run deeper. Local industries struggle to compete with multinational chains. Small tailors, family restaurants and domestic film studios close, taking jobs and craftsmanship with them. Small producers who cannot match the prices of mass manufacturing often lose their livelihoods altogether. Profits from these chains often flow to overseas shareholders rather than staying in the community, so the money spent by local shoppers does little to support local employment. Culture suffers as well. Traditional clothing and cuisine gradually give way to imported fashions, and young people may come to see their own heritage as old-fashioned. Once a distinctive style or dish disappears from daily use, it is hard to revive, and shopfronts that once reflected a town's character are replaced by identical branches.", "In conclusion, global sameness delivers lower prices and convenience, but at the expense of cultural identity, local businesses and genuine variety in daily life. For that reason, I believe the disadvantages carry considerably more weight."], "sents": [{"p": 0, "en": "Global trade and media have made it possible to buy the same shirts, eat at the same restaurants and watch the same films almost anywhere.", "vi": "Nhờ thương mại và truyền thông toàn cầu, giờ đây hầu như ở đâu người ta cũng có thể mua những chiếc áo giống nhau, ăn ở những nhà hàng giống nhau và xem những bộ phim giống nhau.", "alts": ["Global trade and media have made it possible to buy the same shirts, eat at the same restaurants and watch the same films in almost any country.", "Thanks to international trade and media, it is now possible to buy identical shirts, dine at identical restaurants and watch the same films almost anywhere in the world."]}, {"p": 0, "en": "While this uniformity has some practical benefits for ordinary consumers, I think the disadvantages are more significant.", "vi": "Dù sự đồng nhất này mang lại một số lợi ích thiết thực cho người tiêu dùng, tôi cho rằng mặt trái của nó đáng kể hơn.", "alts": ["Although this uniformity has some practical benefits for ordinary consumers, I think the drawbacks are more serious.", "While this sameness offers ordinary consumers some practical advantages, I believe the disadvantages are more significant.", "While this sameness has some practical advantages for ordinary consumers, I believe the drawbacks are more serious."]}, {"p": 1, "en": "On the positive side, standardised products offer practical benefits in terms of price and familiarity.", "vi": "Về mặt tích cực, các sản phẩm được tiêu chuẩn hóa mang lại lợi ích thiết thực về giá cả và sự quen thuộc.", "alts": ["On the plus side, standardised products bring practical advantages in price and familiarity."]}, {"p": 1, "en": "When a company manufactures one sneaker or one smartphone for the entire world, mass production lowers the cost per item.", "vi": "Khi một công ty sản xuất cùng một mẫu giày hay một mẫu điện thoại cho cả thế giới, sản xuất hàng loạt làm giảm giá thành mỗi sản phẩm.", "alts": ["When a company makes a single sneaker or smartphone for the whole world, mass production reduces the cost of each item.", "If one company produces the same sneaker or smartphone for the entire world, mass production brings down the cost per item."]}, {"p": 1, "en": "Consumers in poorer countries then gain access to goods they could not otherwise afford.", "vi": "Nhờ vậy, người tiêu dùng ở các nước nghèo có thể mua được những món hàng mà lẽ ra họ không đủ tiền mua.", "alts": ["Consumers in poorer countries can then obtain goods that they would otherwise be unable to afford.", "This allows consumers in less wealthy countries to buy things they could not otherwise pay for.", "Consumers in less wealthy countries can then obtain goods they would not otherwise be able to afford."]}, {"p": 1, "en": "A single design and marketing campaign can also be reused in dozens of markets, which keeps prices low.", "vi": "Một mẫu thiết kế và một chiến dịch tiếp thị cũng có thể được dùng lại ở hàng chục thị trường, nhờ vậy giá bán được giữ ở mức thấp.", "alts": ["One design and one marketing campaign can also be reused in dozens of markets, which keeps prices down.", "A single design and advertising campaign can also be used again in dozens of markets, helping to keep prices low."]}, {"p": 1, "en": "Familiar brands make travel and communication easier.", "vi": "Những thương hiệu quen thuộc cũng giúp việc đi lại và giao tiếp thuận tiện hơn.", "alts": ["Familiar brands make travelling and communicating easier.", "Well-known brands also make travel and communication simpler."]}, {"p": 1, "en": "A traveller can recognise a trusted shop in an unfamiliar city.", "vi": "Du khách có thể nhận ra một cửa hàng đáng tin ở một thành phố xa lạ.", "alts": ["A traveller can recognise a shop they trust in a city they do not know.", "Even in an unfamiliar city, a traveller can spot a shop that they already trust."]}, {"p": 1, "en": "A film released worldwide at the same time also gives audiences in different nations a common topic of conversation.", "vi": "Một bộ phim công chiếu toàn cầu cùng lúc cũng tạo cho khán giả ở nhiều nước một chủ đề chung để trò chuyện.", "alts": ["A film released globally at the same time also gives audiences in different countries something in common to talk about.", "When a film is released worldwide on the same date, audiences in different nations also share a topic of conversation."]}, {"p": 1, "en": "However, these advantages are largely matters of convenience, and they come at a price that local communities end up paying.", "vi": "Tuy nhiên, những lợi thế này phần lớn chỉ là sự tiện lợi, và cái giá đi kèm lại do chính các cộng đồng địa phương gánh chịu.", "alts": ["However, these benefits are largely about convenience, and local communities end up paying the price.", "Nevertheless, these advantages are mostly a matter of convenience, and they come at a cost that local communities bear."]}, {"p": 2, "en": "The drawbacks run deeper.", "vi": "Mặt trái còn sâu xa hơn thế.", "alts": ["The disadvantages go deeper.", "The drawbacks are more profound.", "The drawbacks go deeper."]}, {"p": 2, "en": "Local industries struggle to compete with multinational chains.", "vi": "Các ngành nghề địa phương khó cạnh tranh nổi với các chuỗi đa quốc gia.", "alts": ["Local businesses find it hard to compete with multinational chains.", "Local industries struggle to compete against multinational chains."]}, {"p": 2, "en": "Small tailors, family restaurants and domestic film studios close, taking jobs and craftsmanship with them.", "vi": "Tiệm may nhỏ, quán ăn gia đình và hãng phim trong nước lần lượt đóng cửa, kéo theo cả việc làm lẫn nghề thủ công.", "alts": ["Small tailors, family-run restaurants and local film studios close down, and jobs and craftsmanship disappear with them.", "Small tailors, family restaurants and domestic film studios shut down, taking jobs and craftsmanship with them."]}, {"p": 2, "en": "Small producers who cannot match the prices of mass manufacturing often lose their livelihoods altogether.", "vi": "Những nhà sản xuất nhỏ không thể theo kịp giá của hàng sản xuất đại trà thường mất luôn kế sinh nhai.", "alts": ["Small producers who cannot match the prices of mass production often lose their income completely.", "Small producers that cannot compete with mass-produced prices often lose their livelihoods altogether."]}, {"p": 2, "en": "Profits from these chains often flow to overseas shareholders rather than staying in the community, so the money spent by local shoppers does little to support local employment.", "vi": "Lợi nhuận của các chuỗi này thường chảy về tay cổ đông nước ngoài thay vì ở lại cộng đồng, nên số tiền người dân địa phương chi tiêu hầu như chẳng góp phần tạo việc làm tại chỗ.", "alts": ["Profits from these chains often go to foreign shareholders instead of staying in the community, so what local shoppers spend does little to support local jobs.", "The profits of these chains frequently flow to overseas shareholders rather than staying in the area, so the money local people spend does little to sustain local employment."]}, {"p": 2, "en": "Culture suffers as well.", "vi": "Văn hóa cũng bị ảnh hưởng.", "alts": ["Culture also suffers.", "Culture is damaged as well."]}, {"p": 2, "en": "Traditional clothing and cuisine gradually give way to imported fashions, and young people may come to see their own heritage as old-fashioned.", "vi": "Trang phục và ẩm thực truyền thống dần nhường chỗ cho thời trang ngoại nhập, và giới trẻ có thể bắt đầu coi di sản của chính mình là lỗi thời.", "alts": ["Traditional dress and food gradually give way to foreign trends, and young people may come to see their own heritage as outdated.", "Traditional clothing and cuisine are slowly replaced by imported fashions, and young people may start to regard their own heritage as old-fashioned."]}, {"p": 2, "en": "Once a distinctive style or dish disappears from daily use, it is hard to revive, and shopfronts that once reflected a town's character are replaced by identical branches.", "vi": "Một khi phong cách hay món ăn đặc trưng đã biến mất khỏi đời sống hằng ngày thì rất khó khôi phục, và những mặt tiền cửa hàng từng phản ánh nét riêng của một thị trấn bị thay bằng những chi nhánh giống hệt nhau.", "alts": ["Once a distinctive style or dish disappears from everyday life, it is hard to revive, and shopfronts that once reflected a town's character are replaced by identical branches.", "When a unique style or dish disappears from daily use, it is difficult to bring back, and shopfronts that once reflected the character of a town are replaced by identical outlets."]}, {"p": 3, "en": "In conclusion, global sameness delivers lower prices and convenience, but at the expense of cultural identity, local businesses and genuine variety in daily life.", "vi": "Tóm lại, sự đồng nhất toàn cầu mang lại giá rẻ hơn và sự tiện lợi, nhưng phải đánh đổi bằng bản sắc văn hóa, các doanh nghiệp địa phương và sự đa dạng thực sự trong đời sống thường ngày.", "alts": ["In conclusion, global uniformity brings lower prices and convenience, but at the cost of cultural identity, local businesses and real variety in everyday life.", "To conclude, global sameness provides cheaper prices and convenience, but it sacrifices cultural identity, local businesses and genuine variety in daily life."]}, {"p": 3, "en": "For that reason, I believe the disadvantages carry considerably more weight.", "vi": "Vì thế, tôi tin rằng những bất lợi nặng ký hơn đáng kể.", "alts": ["For this reason, I believe the drawbacks carry considerably more weight.", "For that reason, I think the disadvantages are far more significant.", "For this reason, I think the drawbacks weigh much more heavily."]}], "no": 3, "type": "Advantages outweigh disadvantages", "words": 325}, {"title": "Starting School", "prompt": "Some people think that children should start school at a very early age, but others believe that children should not go to school until they are older. Discuss both views and give your opinion.", "paras": ["Opinions differ on whether children should enter school at a very early age or stay at home until they are older. Both positions have merit, but I lean towards the latter, provided young children still have opportunities to play and mix with others.", "Those who favour an early start point to both learning and practicality. Young minds absorb knowledge quickly. A child who learns letters, numbers and basic social rules at four is likely to feel confident in a classroom later on, whereas those who begin late may struggle to catch up. Early schooling also gives working parents reliable supervision during the day. Children from disadvantaged homes may gain access to books, meals and structured activities that they would otherwise miss. For these reasons, supporters see an early start as giving children a head start in life. However, an early start brings its own risks, since a small child forced to sit still for hours may learn to dislike school altogether.", "On the other hand, waiting has strong arguments of its own. Very young children are still developing basic motor skills and emotional control. Sitting at a desk for hours can leave them stressed and resistant to learning. Countries such as Finland, where children start at around seven, consistently achieve excellent results, which suggests that an early academic start is not necessary for later success. Time at home or in informal play matters just as much, since it strengthens the bond with parents and builds creativity and language in a natural way. A child who has enjoyed these years is often more curious and willing to learn once lessons begin. Pushing literacy too early, by contrast, can make reluctant learners dislike books for years.", "In conclusion, although early schooling offers some practical and educational advantages, delaying it until children are developmentally ready seems the wiser course. A relaxed, play-based start gives pupils the best chance of enjoying learning for years to come."], "sents": [{"p": 0, "en": "Opinions differ on whether children should enter school at a very early age or stay at home until they are older.", "vi": "Ý kiến chia rẽ về việc trẻ nên đi học từ rất sớm hay ở nhà cho đến khi lớn hơn.", "alts": ["People disagree on whether children should start school at a very young age or stay at home until they are older.", "Opinions are divided over whether children should begin school very early or remain at home until they are older."]}, {"p": 0, "en": "Both positions have merit, but I lean towards the latter, provided young children still have opportunities to play and mix with others.", "vi": "Cả hai quan điểm đều có cái lý của nó, nhưng tôi nghiêng về ý kiến thứ hai, miễn là trẻ nhỏ vẫn có cơ hội vui chơi và giao lưu với những đứa trẻ khác.", "alts": ["Both views have merit, but I lean towards the second, provided young children still have opportunities to play and mix with others.", "Each position has its strengths, but I favour the latter as long as young children can still play and socialise.", "Each position has its strengths, but I favour the second, provided young children still get opportunities to play and socialise."]}, {"p": 1, "en": "Those who favour an early start point to both learning and practicality.", "vi": "Những người ủng hộ việc đi học sớm viện dẫn cả lý do học tập lẫn lý do thực tế.", "alts": ["Those who favour an early start point to both learning and practical reasons.", "Supporters of starting early cite benefits for learning as well as practical advantages.", "Supporters of an early start cite both learning and practical reasons."]}, {"p": 1, "en": "Young minds absorb knowledge quickly.", "vi": "Trí óc non nớt tiếp thu kiến thức rất nhanh.", "alts": ["Young minds take in knowledge quickly.", "Young children absorb knowledge very quickly.", "Young children soak up knowledge quickly."]}, {"p": 1, "en": "A child who learns letters, numbers and basic social rules at four is likely to feel confident in a classroom later on, whereas those who begin late may struggle to catch up.", "vi": "Một đứa trẻ được học chữ, số cùng những quy tắc ứng xử cơ bản từ bốn tuổi nhiều khả năng sẽ tự tin khi vào lớp sau này, trong khi những em bắt đầu muộn có thể khó theo kịp bạn.", "alts": ["A child who learns letters, numbers and basic social rules at the age of four is likely to feel confident in class later, whereas those who start late may struggle to catch up.", "A four-year-old who learns letters, numbers and basic social rules will probably feel confident in a classroom later on, while late starters may find it hard to catch up.", "A child who masters letters, numbers and basic social rules at the age of four will probably feel confident in class later, while late starters may find it hard to catch up."]}, {"p": 1, "en": "Early schooling also gives working parents reliable supervision during the day.", "vi": "Đi học sớm cũng giúp cha mẹ đi làm yên tâm vì con được trông nom suốt ngày.", "alts": ["Early schooling also gives working parents dependable supervision during the day.", "Starting school early also provides working parents with reliable care for their children during the day."]}, {"p": 1, "en": "Children from disadvantaged homes may gain access to books, meals and structured activities that they would otherwise miss.", "vi": "Trẻ từ những gia đình khó khăn có thể được tiếp cận sách vở, bữa ăn và các hoạt động có tổ chức mà nếu không thì các em sẽ không có.", "alts": ["Children from disadvantaged homes may gain access to books, meals and organised activities that they would otherwise miss.", "Children from poorer families may get access to books, meals and structured activities that they would not have at home."]}, {"p": 1, "en": "For these reasons, supporters see an early start as giving children a head start in life.", "vi": "Vì những lý do này, những người ủng hộ cho rằng đi học sớm giúp trẻ đi trước một bước trong cuộc sống.", "alts": ["For these reasons, supporters see an early start as a head start in life for children.", "For these reasons, advocates regard early schooling as giving children a head start in life."]}, {"p": 1, "en": "However, an early start brings its own risks, since a small child forced to sit still for hours may learn to dislike school altogether.", "vi": "Tuy nhiên, đi học sớm cũng có rủi ro riêng, vì một đứa trẻ nhỏ bị bắt ngồi yên hàng giờ có thể sinh ra chán ghét trường học.", "alts": ["However, an early start has risks of its own, since a small child forced to sit still for hours may come to dislike school altogether.", "Nevertheless, starting early carries its own risks, because a young child made to sit still for hours may grow to dislike school completely."]}, {"p": 2, "en": "On the other hand, waiting has strong arguments of its own.", "vi": "Mặt khác, việc cho trẻ đi học muộn hơn cũng có những lập luận vững chắc của riêng nó.", "alts": ["On the other hand, delaying school has strong arguments in its favour.", "By contrast, waiting also has strong arguments on its side.", "By contrast, delaying school also has strong arguments in its favour."]}, {"p": 2, "en": "Very young children are still developing basic motor skills and emotional control.", "vi": "Trẻ còn rất nhỏ vẫn đang phát triển các kỹ năng vận động cơ bản và khả năng kiểm soát cảm xúc.", "alts": ["Very small children are still developing their basic motor skills and emotional control."]}, {"p": 2, "en": "Sitting at a desk for hours can leave them stressed and resistant to learning.", "vi": "Việc ngồi bàn hàng giờ có thể khiến các em căng thẳng và chống đối việc học.", "alts": ["Being made to sit at a desk for hours can make them anxious and unwilling to learn."]}, {"p": 2, "en": "Countries such as Finland, where children start at around seven, consistently achieve excellent results, which suggests that an early academic start is not necessary for later success.", "vi": "Những nước như Phần Lan, nơi trẻ bắt đầu đi học vào khoảng bảy tuổi, vẫn luôn đạt kết quả xuất sắc, điều này cho thấy bắt đầu học sớm không phải điều kiện cần cho thành công về sau.", "alts": ["In countries like Finland, where children begin school at about seven, results are consistently excellent, which suggests that an early academic start is not essential for later success.", "Countries like Finland, where children begin at about seven, regularly achieve excellent results, which suggests that starting academic work early is not needed for later success."]}, {"p": 2, "en": "Time at home or in informal play matters just as much, since it strengthens the bond with parents and builds creativity and language in a natural way.", "vi": "Thời gian ở nhà hay chơi tự do cũng quan trọng không kém, vì nó gắn kết trẻ với cha mẹ và giúp trẻ phát triển sự sáng tạo cũng như ngôn ngữ một cách tự nhiên.", "alts": ["Time at home or in informal play matters just as much, as it strengthens the bond with parents and builds creativity and language in a natural way.", "Time at home or in unstructured play is equally important, since it strengthens the relationship with parents and develops creativity and language naturally."]}, {"p": 2, "en": "A child who has enjoyed these years is often more curious and willing to learn once lessons begin.", "vi": "Một đứa trẻ đã có những năm tháng như vậy thường tò mò và sẵn sàng học hơn khi bắt đầu vào lớp.", "alts": ["Children who have enjoyed these years are often more inquisitive and eager to learn when lessons start.", "A child who has enjoyed these years is often more inquisitive and willing to learn when lessons start."]}, {"p": 2, "en": "Pushing literacy too early, by contrast, can make reluctant learners dislike books for years.", "vi": "Ngược lại, ép trẻ đọc viết quá sớm có thể khiến những em vốn ngại học ghét sách suốt nhiều năm.", "alts": ["Pushing literacy too early, on the other hand, can make reluctant learners dislike books for years.", "By contrast, forcing reading and writing too soon can make unwilling learners resent books for years."]}, {"p": 3, "en": "In conclusion, although early schooling offers some practical and educational advantages, delaying it until children are developmentally ready seems the wiser course.", "vi": "Tóm lại, dù đi học sớm mang lại một số lợi thế về thực tế và giáo dục, việc trì hoãn cho đến khi trẻ đủ sẵn sàng về mặt phát triển có vẻ là lựa chọn khôn ngoan hơn.", "alts": ["In conclusion, although early schooling has some practical and educational advantages, postponing it until children are developmentally ready seems the wiser choice.", "To conclude, while starting school early offers some practical and educational benefits, delaying it until children are developmentally ready appears the better course."]}, {"p": 3, "en": "A relaxed, play-based start gives pupils the best chance of enjoying learning for years to come.", "vi": "Một khởi đầu nhẹ nhàng, lấy vui chơi làm nền tảng sẽ cho học sinh cơ hội tốt nhất để yêu việc học trong nhiều năm tới.", "alts": ["A relaxed, play-based start gives pupils the best chance of enjoying learning for many years to come.", "A gentle, play-based beginning gives children the best chance of enjoying learning for years ahead."]}], "no": 4, "type": "Discuss both views", "words": 322}, {"title": "Student Life", "prompt": "Full-time university students spend a lot of time studying. Some say they should do other activities too. To what extent do you agree or disagree?", "paras": ["It is often said that full-time students should devote every spare hour to their books. I strongly disagree with this view, since taking part in other activities is just as valuable for personal growth and, ironically, for academic performance.", "Those who insist that students should concentrate only on their studies have some grounds. A degree is demanding and expensive, so every hour spent elsewhere is an hour taken from lectures, reading and assignments. Students on scholarships, for example, must keep their grades high or lose their funding, and families who pay heavy tuition fees expect results in return. Extra activities can also become distractions. Parties, clubs and part-time jobs tend to expand until they crowd out revision, and a student who stays out late may arrive at lectures too tired to follow them. In extreme cases, those who take on too much fall behind and even drop out. However, studying all day does not guarantee success, because tired students often retain far less than those who balance work with rest.", "In my view, the benefits of a wider life are greater. Rest and exercise make study itself more productive, since concentration drops after a few hours of continuous reading. A hobby, a walk with friends or a game of football lets the mind recover and lowers the anxiety that is common during exam seasons. Beyond health, extracurricular activities build assets that a degree alone cannot. Employers look for teamwork, leadership and communication. A student who organises club events or volunteers at a charity develops these abilities and will have more to say in an interview. The friendships and contacts made along the way often lead to internships, references and even job offers. Balance is certainly needed, but a few hours a week is a sensible investment.", "In conclusion, I firmly believe that students should pursue interests outside their studies, as this keeps them healthier, more employable and better able to learn. A balanced routine, rather than constant revision, is what prepares them for both exams and adult life."], "sents": [{"p": 0, "en": "It is often said that full-time students should devote every spare hour to their books.", "vi": "Người ta thường nói rằng sinh viên chính quy nên dành mọi giờ rảnh cho sách vở.", "alts": ["It is often said that full-time students should devote every spare hour to their studies.", "People often claim that full-time students ought to spend all of their free time on their books.", "People often say that full-time students should dedicate every free hour to their studies."]}, {"p": 0, "en": "I strongly disagree with this view, since taking part in other activities is just as valuable for personal growth and, ironically, for academic performance.", "vi": "Tôi hoàn toàn không đồng tình với quan điểm này, vì tham gia các hoạt động khác cũng có giá trị không kém đối với sự phát triển cá nhân và, trớ trêu thay, cả kết quả học tập.", "alts": ["I completely disagree, because getting involved in other activities is equally valuable for personal development and, paradoxically, for academic results.", "I completely disagree with this opinion, because joining other activities is equally valuable for personal development and, ironically, for academic results."]}, {"p": 1, "en": "Those who insist that students should concentrate only on their studies have some grounds.", "vi": "Những người khăng khăng rằng sinh viên chỉ nên tập trung vào việc học cũng có lý do của họ.", "alts": ["People who insist that students should concentrate only on their studies have some justification.", "Those who argue that students should focus solely on their studies have a point."]}, {"p": 1, "en": "A degree is demanding and expensive, so every hour spent elsewhere is an hour taken from lectures, reading and assignments.", "vi": "Học đại học vừa vất vả vừa tốn kém, nên mỗi giờ dành cho việc khác là một giờ bị lấy đi khỏi giảng đường, việc đọc tài liệu và bài tập.", "alts": ["A degree is demanding and costly, so every hour spent on something else is an hour taken from lectures, reading and coursework.", "Because a degree is both demanding and expensive, every hour spent elsewhere is an hour lost to lectures, reading and assignments."]}, {"p": 1, "en": "Students on scholarships, for example, must keep their grades high or lose their funding, and families who pay heavy tuition fees expect results in return.", "vi": "Chẳng hạn, sinh viên nhận học bổng phải giữ điểm cao nếu không sẽ mất khoản tài trợ, và các gia đình đóng học phí cao đều mong con có kết quả xứng đáng.", "alts": ["Scholarship students, for example, must maintain high grades or lose their funding, and families paying heavy tuition fees expect results in return.", "Students on scholarships, for instance, have to keep their grades high or lose their funding, and families who pay high tuition fees expect something in return."]}, {"p": 1, "en": "Extra activities can also become distractions.", "vi": "Các hoạt động ngoài giờ học cũng có thể trở thành yếu tố gây xao nhãng.", "alts": ["Additional activities may also turn into distractions.", "Extra activities can also turn into distractions.", "Additional activities can also become distractions."]}, {"p": 1, "en": "Parties, clubs and part-time jobs tend to expand until they crowd out revision, and a student who stays out late may arrive at lectures too tired to follow them.", "vi": "Tiệc tùng, câu lạc bộ và việc làm thêm có xu hướng lấn dần thời gian ôn bài, và một sinh viên thức khuya có thể đến lớp trong tình trạng quá mệt để theo kịp bài giảng.", "alts": ["Parties, clubs and part-time jobs tend to grow until they crowd out revision, and a student who stays out late may arrive at lectures too tired to follow them.", "Social events, clubs and part-time work tend to expand until they leave no time for revision, and a student who stays out late may be too tired to follow lectures.", "Parties, clubs and part-time work tend to expand until they push out revision, and a student who stays out late may reach lectures too exhausted to follow."]}, {"p": 1, "en": "In extreme cases, those who take on too much fall behind and even drop out.", "vi": "Trong trường hợp nặng, những ai ôm đồm quá nhiều sẽ bị tụt lại, thậm chí bỏ học.", "alts": ["In extreme cases, students who take on too much fall behind and may even drop out.", "In the worst cases, those who take on too much fall behind and even leave their course."]}, {"p": 1, "en": "However, studying all day does not guarantee success, because tired students often retain far less than those who balance work with rest.", "vi": "Tuy nhiên, học suốt ngày không đảm bảo thành công, vì những sinh viên kiệt sức thường nhớ được ít hơn nhiều so với những bạn biết cân bằng giữa học và nghỉ.", "alts": ["However, studying all day does not guarantee success, because exhausted students often retain much less than those who balance study with rest.", "Nevertheless, studying all day is no guarantee of success, as tired students often remember far less than those who balance work and rest."]}, {"p": 2, "en": "In my view, the benefits of a wider life are greater.", "vi": "Theo tôi, lợi ích của một cuộc sống đa dạng hơn là lớn hơn.", "alts": ["In my opinion, the benefits of a broader life are greater.", "I believe that the advantages of a wider life outweigh these drawbacks.", "I believe the advantages of a wider life are greater."]}, {"p": 2, "en": "Rest and exercise make study itself more productive, since concentration drops after a few hours of continuous reading.", "vi": "Nghỉ ngơi và vận động giúp việc học hiệu quả hơn, vì sự tập trung giảm sút sau vài giờ đọc liên tục.", "alts": ["Rest and exercise make studying itself more productive, because concentration drops after a few hours of continuous reading.", "Rest and physical activity make study more productive in itself, since concentration falls after a few hours of non-stop reading."]}, {"p": 2, "en": "A hobby, a walk with friends or a game of football lets the mind recover and lowers the anxiety that is common during exam seasons.", "vi": "Một sở thích, buổi đi dạo cùng bạn bè hay một trận bóng giúp đầu óc phục hồi và giảm bớt sự lo lắng thường gặp vào mùa thi.", "alts": ["A hobby, a walk with friends or a game of football allows the mind to recover and lowers the anxiety that is common in exam periods.", "Having a hobby, going for a walk with friends or playing football gives the mind a chance to recover and reduces the anxiety that is common during exams."]}, {"p": 2, "en": "Beyond health, extracurricular activities build assets that a degree alone cannot.", "vi": "Ngoài sức khỏe, các hoạt động ngoại khóa còn mang lại những thứ mà riêng tấm bằng không thể có.", "alts": ["Apart from health, extracurricular activities develop strengths that a degree cannot provide on its own."]}, {"p": 2, "en": "Employers look for teamwork, leadership and communication.", "vi": "Nhà tuyển dụng tìm kiếm tinh thần đồng đội, khả năng lãnh đạo và kỹ năng giao tiếp.", "alts": ["Employers value teamwork, leadership and communication skills.", "Employers seek teamwork, leadership and communication."]}, {"p": 2, "en": "A student who organises club events or volunteers at a charity develops these abilities and will have more to say in an interview.", "vi": "Một sinh viên tổ chức sự kiện cho câu lạc bộ hoặc làm tình nguyện ở một tổ chức từ thiện sẽ rèn được những kỹ năng này và có nhiều điều để chia sẻ hơn trong buổi phỏng vấn.", "alts": ["Students who organise club events or volunteer for a charity build these skills and will have more to talk about at interviews.", "A student who arranges club events or volunteers for a charity builds these skills and will have more to talk about at an interview."]}, {"p": 2, "en": "The friendships and contacts made along the way often lead to internships, references and even job offers.", "vi": "Những tình bạn và mối quan hệ xây dựng được trong quá trình đó thường dẫn đến cơ hội thực tập, thư giới thiệu và thậm chí lời mời làm việc.", "alts": ["The friends and contacts made along the way frequently lead to internships, references and even job offers.", "The friends and connections made along the way often result in internships, references and even job offers."]}, {"p": 2, "en": "Balance is certainly needed, but a few hours a week is a sensible investment.", "vi": "Dĩ nhiên cần có sự cân bằng, nhưng dành vài giờ mỗi tuần cho việc này là một khoản đầu tư hợp lý.", "alts": ["A balance is certainly needed, but a few hours a week is a sensible investment.", "Balance is certainly necessary, yet a few hours each week is a sound investment."]}, {"p": 3, "en": "In conclusion, I firmly believe that students should pursue interests outside their studies, as this keeps them healthier, more employable and better able to learn.", "vi": "Tóm lại, tôi tin chắc rằng sinh viên nên theo đuổi những mối quan tâm ngoài việc học, vì điều đó giúp họ khỏe mạnh hơn, có nhiều lợi thế khi xin việc hơn và học tốt hơn.", "alts": ["To conclude, I strongly believe students should follow interests beyond their studies, because this makes them healthier, more employable and more effective learners."]}, {"p": 3, "en": "A balanced routine, rather than constant revision, is what prepares them for both exams and adult life.", "vi": "Một nếp sinh hoạt cân bằng, chứ không phải ôn bài liên tục, mới giúp họ chuẩn bị tốt cho cả kỳ thi lẫn cuộc sống trưởng thành.", "alts": ["It is a balanced routine, not endless revision, that prepares them for exams and for adult life alike.", "A balanced routine, instead of non-stop revision, is what prepares them for both exams and adult life."]}], "no": 5, "type": "Agree or disagree", "words": 338}, {"title": "Work or Travel", "prompt": "Some students choose to work or travel after leaving school and before going to university. Many people, however, say that working experience is more useful in adult life than travel. Do you agree or disagree with this statement?", "paras": ["Faced with the choice between starting university straight away and taking time out, many school leavers either find a job or go travelling. Although both options have merits, I agree that work experience prepares people better for adult life.", "Travel has obvious attractions. Visiting other countries exposes young people to unfamiliar languages, foods and customs, which can make them more tolerant and adaptable. A gap-year volunteer in Spain or Thailand, for instance, picks up conversational language far faster than a classroom student does. Such skills are valuable in a job market where employers increasingly deal with international clients. Travel also builds independence. A teenager who navigates a foreign city alone, books transport and solves unexpected problems gains a confidence that is hard to acquire at home. Many people recall such journeys as experiences that shaped their outlook. However, travel is expensive and temporary, and its lessons are often too general to be demonstrated on a CV.", "Working, in contrast, teaches skills that adults use every day. A school leaver who spends a year in a shop or an office learns to arrive on time, follow instructions, cope with demanding customers and cooperate with colleagues. These habits cannot be fully reproduced in any classroom. Criticism from a manager, for example, teaches resilience that a gap-year trip rarely offers. Earning a wage also brings a realistic understanding of money. Someone who has budgeted a first salary, paid rent and saved for a goal is less likely to fall into debt later. A record of employment also gives applicants an advantage when they compete for part-time jobs during university and for graduate positions afterwards. Experience of this kind also helps school leavers decide which career they truly want.", "In conclusion, travel broadens the mind, but work builds the practical habits and financial awareness that adult life demands, qualities that stay useful long after any journey ends. For this reason, I believe gaining employment is the more valuable choice after school."], "sents": [{"p": 0, "en": "Faced with the choice between starting university straight away and taking time out, many school leavers either find a job or go travelling.", "vi": "Đứng trước lựa chọn vào đại học ngay hay nghỉ một thời gian, nhiều học sinh mới tốt nghiệp phổ thông chọn đi làm hoặc đi du lịch.", "alts": ["Faced with a choice between going to university straight away and taking a break, many school leavers either get a job or go travelling.", "When deciding between starting university immediately and taking time out, many school leavers choose to work or travel.", "When choosing between starting university immediately and taking a break, many school leavers either get a job or go travelling."]}, {"p": 0, "en": "Although both options have merits, I agree that work experience prepares people better for adult life.", "vi": "Dù cả hai lựa chọn đều có điểm mạnh, tôi đồng ý rằng kinh nghiệm làm việc giúp con người chuẩn bị tốt hơn cho cuộc sống trưởng thành.", "alts": ["Although both options have advantages, I agree that work experience is better preparation for adult life.", "While both choices have their merits, I believe that working prepares people better for adult life."]}, {"p": 1, "en": "Travel has obvious attractions.", "vi": "Du lịch có những điểm hấp dẫn rõ ràng.", "alts": ["Travelling has clear attractions.", "Travel has obvious appeal."]}, {"p": 1, "en": "Visiting other countries exposes young people to unfamiliar languages, foods and customs, which can make them more tolerant and adaptable.", "vi": "Đến các quốc gia khác giúp người trẻ tiếp xúc với ngôn ngữ, món ăn và phong tục xa lạ,
