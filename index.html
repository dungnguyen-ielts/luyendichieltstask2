ác hạn chế cũng có thể đe dọa việc làm.", "alts": ["Restrictions can threaten jobs as well.", "Limits on water can also put jobs at risk."]}, {"p": 1, "en": "Farmers and small businesses depend on water for their income and cannot easily cut their use.", "vi": "Nông dân và doanh nghiệp nhỏ phụ thuộc vào nước để kiếm sống và không thể dễ dàng cắt giảm lượng nước dùng.", "alts": ["Farmers and small businesses rely on water for their income and cannot easily cut their use.", "Farmers and small firms depend on water to earn a living and cannot easily reduce their consumption."]}, {"p": 1, "en": "A farmer facing a strict quota may lose a harvest, while a small laundry or car wash may have to reduce its opening hours and lay off staff.", "vi": "Một nông dân đối mặt với hạn ngạch nghiêm ngặt có thể mất mùa, trong khi một tiệm giặt nhỏ hay tiệm rửa xe có thể phải rút ngắn giờ mở cửa và cho nhân viên nghỉ việc.", "alts": ["A farmer under a strict quota may lose a harvest, while a small laundry or car wash may have to shorten its opening hours and lay off staff.", "A farmer facing a tight quota could lose a harvest, and a small laundry or car wash might have to cut its hours and lay off workers."]}, {"p": 1, "en": "However, a basic need for drinking and cooking is very different from the unlimited use of water for lawns, pools or industry.", "vi": "Tuy nhiên, nhu cầu cơ bản về uống và nấu ăn rất khác với việc dùng nước không giới hạn cho bãi cỏ, hồ bơi hay công nghiệp.", "alts": ["However, a basic need for drinking and cooking is very different from the unlimited use of water for lawns, pools or industry.", "Nevertheless, using water to drink and cook is very different from the unlimited use of water on lawns, swimming pools or industry."]}, {"p": 2, "en": "In my view, government control is necessary to keep enough clean water available for everyone.", "vi": "Theo tôi, sự kiểm soát của chính phủ là cần thiết để đảm bảo đủ nước sạch cho mọi người.", "alts": ["In my opinion, government control is necessary to keep enough clean water available for everyone.", "I believe government control is needed to make sure there is enough clean water for all."]}, {"p": 2, "en": "Supplies are shrinking in many regions of the world as populations grow and droughts become more frequent.", "vi": "Nguồn cung đang cạn dần ở nhiều khu vực trên thế giới khi dân số tăng và hạn hán trở nên thường xuyên hơn.", "alts": ["Supplies are shrinking in many parts of the world as populations grow and droughts become more frequent.", "Water supplies are dwindling in many regions as populations rise and droughts occur more often."]}, {"p": 2, "en": "Rivers and aquifers are being drawn down faster than rain can refill them, and without limits individuals have no incentive to avoid waste.", "vi": "Sông ngòi và tầng chứa nước đang bị rút cạn nhanh hơn tốc độ mưa bổ sung, và nếu không có giới hạn thì cá nhân không có động lực tránh lãng phí.", "alts": ["Rivers and aquifers are being drawn down faster than rain can refill them, and without limits individuals have no incentive to avoid waste.", "Rivers and aquifers are being depleted faster than rainfall can replenish them, and without limits people have no incentive to avoid waste."]}, {"p": 2, "en": "Cape Town came close to turning off its taps in 2018 after years of drought and rising demand.", "vi": "Cape Town từng suýt phải cắt nước vào năm 2018 sau nhiều năm hạn hán và nhu cầu tăng cao.", "alts": ["Cape Town almost turned off its taps in 2018 after years of drought and growing demand.", "In 2018, Cape Town came close to running out of water after years of drought and rising demand."]}, {"p": 2, "en": "Fairness is also at stake.", "vi": "Sự công bằng cũng là vấn đề đáng bàn.", "alts": ["Fairness is at stake as well.", "Fairness is also an issue."]}, {"p": 2, "en": "Wealthy households with large gardens and swimming pools can use far more water than poor families, who sometimes lack safe drinking water altogether.", "vi": "Các hộ giàu có vườn rộng và hồ bơi có thể dùng nhiều nước hơn hẳn các gia đình nghèo, những người đôi khi thiếu hẳn nước uống an toàn.", "alts": ["Rich households with big gardens and swimming pools can use far more water than poor families, who sometimes lack safe drinking water altogether.", "Wealthy homes with large gardens and pools consume much more water than poor families, some of whom lack safe drinking water altogether."]}, {"p": 2, "en": "Setting sensible limits now also protects future generations, who have a right to inherit usable rivers and lakes.", "vi": "Đặt ra những giới hạn hợp lý ngay từ bây giờ cũng bảo vệ các thế hệ tương lai, những người có quyền được thừa hưởng sông hồ còn dùng được.", "alts": ["Setting sensible limits now also protects future generations, who have a right to inherit usable rivers and lakes.", "Introducing sensible limits today also safeguards future generations, who deserve to inherit rivers and lakes that can still be used."]}, {"p": 3, "en": "In conclusion, people understandably resent restrictions on something they need every day.", "vi": "Tóm lại, người ta dễ hiểu là phản đối những hạn chế đối với thứ họ cần mỗi ngày.", "alts": ["To conclude, people understandably resent restrictions on something they need every day.", "In conclusion, it is understandable that people dislike limits on something they need daily."]}, {"p": 3, "en": "Nevertheless, strict government regulation is the most reliable way to prevent waste and share a limited resource fairly between income groups and generations.", "vi": "Tuy nhiên, quy định nghiêm ngặt của chính phủ là cách đáng tin cậy nhất để ngăn lãng phí và chia sẻ công bằng một nguồn tài nguyên hữu hạn giữa các nhóm thu nhập và các thế hệ.", "alts": ["However, strict government regulation is the most reliable way to prevent waste and share a limited resource fairly between income groups and generations.", "Even so, tight government regulation is the most dependable way to stop waste and share a finite resource fairly among income groups and generations."]}], "no": 28, "type": "Discuss both views", "words": 320}, {"title": "Tours to Remote Areas", "prompt": "Organized tours to remote areas and communities are increasingly popular. Is it a positive or negative development for the local people and the environment?", "paras": ["Organised tours to remote areas and communities are becoming increasingly popular with travellers seeking authentic cultural experiences. Although they bring some economic benefits, I believe the overall effect on local people and the environment is negative.", "The benefits are easy to see. Tourism brings income to places with few other opportunities. Villagers can work as guides, drivers, cooks or craftspeople, and families who once relied on subsistence farming may earn a regular income by hosting guests. Even a modest income can help families pay for children's schooling and basic healthcare. Visitors also help improve local infrastructure. Money from tourism often pays for better roads, clinics and schools in areas that governments have long neglected. Growing visitor numbers can also persuade governments and charities to invest in clean water, electricity and mobile coverage. However, much of the money generated by organised tours goes to foreign operators and city-based companies rather than to the villagers themselves.", "In my view, the harm often outweighs these gains, mainly because tourism damages both the environment and local culture. The environment bears the heaviest cost. Remote areas are fragile, and large groups leave rubbish, erode footpaths, pollute rivers and disturb animals during breeding seasons, causing a once-pristine valley to deteriorate within a few years. Heavier traffic and new hotels also alter the landscape, gradually destroying the peace and quiet that attracted visitors in the first place. Local culture suffers as well. Traditions are shortened or staged to suit visitors, and young people leave farming to copy the clothes and habits of foreign guests. Some communities find their private ceremonies and homes treated as attractions, which erodes their dignity and their control over their own culture.", "In conclusion, tourism can create jobs and fund better public services in isolated places. Even so, environmental damage and cultural erosion make these tours more harmful than helpful unless visitor numbers are strictly limited by the authorities and profits are shared fairly with local residents."], "sents": [{"p": 0, "en": "Organised tours to remote areas and communities are becoming increasingly popular with travellers seeking authentic cultural experiences.", "vi": "Các tour du lịch có tổ chức đến những vùng sâu vùng xa ngày càng phổ biến với du khách muốn tìm trải nghiệm văn hóa chân thực.", "alts": ["Package tours to remote regions and communities are growing more and more popular among travellers looking for authentic cultural experiences.", "Organised trips to remote areas and communities are increasingly popular with tourists who want authentic cultural experiences."]}, {"p": 0, "en": "Although they bring some economic benefits, I believe the overall effect on local people and the environment is negative.", "vi": "Dù mang lại một số lợi ích kinh tế, tôi cho rằng tác động chung lên người dân địa phương và môi trường là tiêu cực.", "alts": ["Although these tours have some economic advantages, I think their overall impact on local people and the environment is negative.", "While they offer some economic benefits, I believe the overall effect on local residents and the environment is negative."]}, {"p": 1, "en": "The benefits are easy to see.", "vi": "Những lợi ích này dễ thấy.", "alts": ["The advantages are obvious.", "It is easy to see the benefits."]}, {"p": 1, "en": "Tourism brings income to places with few other opportunities.", "vi": "Du lịch mang lại thu nhập cho những nơi có ít cơ hội kiếm sống khác.", "alts": ["Tourism provides income for places with few other opportunities.", "Tourism brings money to areas with few other ways of earning a living."]}, {"p": 1, "en": "Villagers can work as guides, drivers, cooks or craftspeople, and families who once relied on subsistence farming may earn a regular income by hosting guests.", "vi": "Dân làng có thể làm hướng dẫn viên, tài xế, đầu bếp hoặc thợ thủ công, và những gia đình từng sống nhờ nông nghiệp tự cung tự cấp có thể có thu nhập đều đặn nhờ đón khách ở nhà.", "alts": ["Villagers can work as guides, drivers, cooks or craftspeople, and families that used to depend on subsistence farming can earn a regular income by hosting guests.", "Local people can become guides, drivers, cooks or craftspeople, and families that once lived on subsistence farming may earn a steady income from hosting visitors."]}, {"p": 1, "en": "Even a modest income can help families pay for children's schooling and basic healthcare.", "vi": "Ngay cả một khoản thu nhập khiêm tốn cũng giúp các gia đình trả tiền học và chăm sóc sức khỏe cơ bản cho con cái.", "alts": ["Even a small income can help families pay for their children's education and basic healthcare.", "Even a modest income can enable families to cover schooling and basic healthcare for their children."]}, {"p": 1, "en": "Visitors also help improve local infrastructure.", "vi": "Du khách cũng góp phần cải thiện cơ sở hạ tầng địa phương.", "alts": ["Tourists also help to improve local infrastructure.", "Visitors also contribute to better local infrastructure."]}, {"p": 1, "en": "Money from tourism often pays for better roads, clinics and schools in areas that governments have long neglected.", "vi": "Tiền từ du lịch thường được dùng để xây đường, trạm y tế và trường học tốt hơn ở những khu vực bị chính phủ bỏ quên từ lâu.", "alts": ["Tourism revenue is often spent on better roads, clinics and schools in areas that governments have long neglected.", "Money from tourism frequently pays for improved roads, clinics and schools in regions that governments have ignored for a long time."]}, {"p": 1, "en": "Growing visitor numbers can also persuade governments and charities to invest in clean water, electricity and mobile coverage.", "vi": "Lượng khách tăng lên cũng có thể thuyết phục chính phủ và các tổ chức từ thiện đầu tư vào nước sạch, điện và sóng điện thoại.", "alts": ["More visitors can also convince governments and charities to invest in clean water, electricity and mobile coverage.", "Rising visitor numbers may also encourage governments and charities to put money into clean water, electricity and mobile coverage."]}, {"p": 1, "en": "However, much of the money generated by organised tours goes to foreign operators and city-based companies rather than to the villagers themselves.", "vi": "Tuy nhiên, phần lớn số tiền các tour có tổ chức tạo ra rơi vào tay các nhà điều hành nước ngoài và công ty ở thành phố chứ không phải chính dân làng.", "alts": ["However, most of the money that organised tours generate goes to foreign operators and city-based companies instead of the villagers themselves.", "Nevertheless, a large share of the income from organised tours goes to foreign operators and urban companies rather than to the villagers."]}, {"p": 2, "en": "In my view, the harm often outweighs these gains, mainly because tourism damages both the environment and local culture.", "vi": "Theo tôi, tác hại thường lớn hơn những lợi ích này, chủ yếu vì du lịch làm tổn hại cả môi trường lẫn văn hóa địa phương.", "alts": ["In my opinion, the harm often outweighs these benefits, mainly because tourism damages both the environment and local culture.", "I believe the damage often outweighs these gains, mainly because tourism harms both the environment and local culture."]}, {"p": 2, "en": "The environment bears the heaviest cost.", "vi": "Môi trường chịu thiệt hại nặng nhất.", "alts": ["The environment suffers the most.", "The environment pays the highest price."]}, {"p": 2, "en": "Remote areas are fragile, and large groups leave rubbish, erode footpaths, pollute rivers and disturb animals during breeding seasons, causing a once-pristine valley to deteriorate within a few years.", "vi": "Các vùng xa xôi rất mong manh, và những đoàn khách đông xả rác, làm xói mòn đường mòn, gây ô nhiễm sông và quấy nhiễu động vật trong mùa sinh sản, khiến một thung lũng nguyên sơ xuống cấp chỉ trong vài năm.", "alts": ["Remote areas are delicate, and large groups leave litter, wear away footpaths, pollute rivers and disturb animals in breeding seasons, so that a once-pristine valley can deteriorate within a few years.", "Remote regions are fragile: big groups drop rubbish, erode footpaths, pollute rivers and disturb animals during breeding seasons, causing a formerly pristine valley to deteriorate in just a few years."]}, {"p": 2, "en": "Heavier traffic and new hotels also alter the landscape, gradually destroying the peace and quiet that attracted visitors in the first place.", "vi": "Giao thông đông hơn và các khách sạn mới cũng làm thay đổi cảnh quan, dần phá hủy sự yên tĩnh vốn thu hút du khách ngay từ đầu.", "alts": ["More traffic and new hotels also change the landscape and slowly destroy the peace and quiet that first drew visitors.", "Heavier traffic and new hotels also alter the scenery, gradually ruining the peace and quiet that originally attracted tourists."]}, {"p": 2, "en": "Local culture suffers as well.", "vi": "Văn hóa địa phương cũng chịu thiệt.", "alts": ["Local culture is affected too.", "Local culture also suffers."]}, {"p": 2, "en": "Traditions are shortened or staged to suit visitors, and young people leave farming to copy the clothes and habits of foreign guests.", "vi": "Các truyền thống bị rút ngắn hoặc dàn dựng cho phù hợp với du khách, và giới trẻ bỏ nghề nông để bắt chước quần áo và thói quen của khách nước ngoài.", "alts": ["Traditions are cut short or staged to suit visitors, and young people give up farming to imitate the clothes and habits of foreign guests.", "Customs are shortened or performed for tourists, and young people quit farming to copy the clothing and habits of foreign visitors."]}, {"p": 2, "en": "Some communities find their private ceremonies and homes treated as attractions, which erodes their dignity and their control over their own culture.", "vi": "Một số cộng đồng thấy các nghi lễ riêng tư và nhà cửa của mình bị coi như điểm tham quan, điều này làm mất đi phẩm giá và quyền kiểm soát đối với văn hóa của chính họ.", "alts": ["Some communities see their private ceremonies and homes treated as tourist attractions, which undermines their dignity and their control over their own culture.", "In some communities, private ceremonies and homes are treated as attractions, which damages people's dignity and their control over their own culture."]}, {"p": 3, "en": "In conclusion, tourism can create jobs and fund better public services in isolated places.", "vi": "Tóm lại, du lịch có thể tạo việc làm và tài trợ các dịch vụ công tốt hơn ở những nơi hẻo lánh.", "alts": ["To conclude, tourism can generate jobs and pay for better public services in isolated places.", "In conclusion, tourism can provide employment and fund improved public services in remote places."]}, {"p": 3, "en": "Even so, environmental damage and cultural erosion make these tours more harmful than helpful unless visitor numbers are strictly limited by the authorities and profits are shared fairly with local residents.", "vi": "Dù vậy, tổn hại môi trường và sự xói mòn văn hóa khiến những tour này có hại nhiều hơn có lợi, trừ khi số lượng khách bị chính quyền hạn chế nghiêm ngặt và lợi nhuận được chia công bằng cho người dân địa phương.", "alts": ["Even so, environmental damage and cultural erosion make these tours more harmful than beneficial unless the authorities strictly limit visitor numbers and profits are shared fairly with local residents.", "Nevertheless, damage to the environment and the erosion of culture make these tours do more harm than good, unless visitor numbers are strictly limited by the authorities and profits are shared fairly with local people."]}], "no": 29, "type": "Positive or negative", "words": 324}, {"title": "Vehicle-Free Days", "prompt": "Some cities have vehicle-free days when private cars, trucks and motorcycles are banned from the city center. People are encouraged to use public transportation such as buses, taxis, and the metro on vehicle-free days. Do the advantages outweigh the disadvantages?", "paras": ["Some cities ban private vehicles from the centre for a day or a weekend and urge residents to use public transport instead, in order to cut pollution and congestion. I believe the advantages of this policy outweigh its disadvantages.", "The disadvantages deserve serious attention. Businesses and essential services can be disrupted. Shops and restaurants in the centre may lose a large share of their usual customers, who cannot reach them easily on a vehicle-free day. Delivery lorries cannot supply stores during the day, which leaves some shelves empty by the evening. Public transport is also hard to use for some residents. People with disabilities, elderly residents and parents with small children often find buses and trains difficult to board. Carriages become overcrowded when thousands of drivers switch at once, and long waits at crowded stations make the journey even more tiring for every passenger. However, these problems affect only one day and can be reduced with extra services and exemptions for emergency and medical vehicles.", "In my view, the benefits are substantial, mainly because vehicle-free days clean the air and change travel habits. Air and noise pollution fall sharply. With cars, trucks and motorcycles absent, levels of exhaust gases drop, especially near busy junctions, and residents breathe cleaner air. The streets also become quiet enough for people to talk and for children to play, which improves the quality of urban life. The policy also changes habits. Citizens who try the metro or a bicycle for a day may find that it is cheaper and faster than they expected, and some then use it more often. Cities that have tried car-free days, such as Bogotá with its weekly Ciclovía, report that large numbers of residents enjoy and repeat the experience.", "In conclusion, vehicle-free days cause temporary inconvenience for businesses and travellers, especially people with limited mobility and families with small children. Nevertheless, cleaner air and lasting changes in travel habits make the policy worthwhile for the city as a whole and its residents."], "sents": [{"p": 0, "en": "Some cities ban private vehicles from the centre for a day or a weekend and urge residents to use public transport instead, in order to cut pollution and congestion.", "vi": "Một số thành phố cấm xe cá nhân vào trung tâm trong một ngày hoặc một cuối tuần và khuyến khích người dân đi phương tiện công cộng, nhằm giảm ô nhiễm và ùn tắc.", "alts": ["Some cities prohibit private vehicles in the centre for a day or a weekend and encourage residents to take public transport, aiming to reduce pollution and congestion.", "Certain cities close their centres to private vehicles for a day or a weekend and urge people to use public transport so as to cut pollution and traffic jams."]}, {"p": 0, "en": "I believe the advantages of this policy outweigh its disadvantages.", "vi": "Tôi cho rằng lợi ích của chính sách này lớn hơn bất lợi của nó.", "alts": ["I think the benefits of this policy are greater than its drawbacks.", "In my opinion, the advantages of this measure outweigh its disadvantages."]}, {"p": 1, "en": "The disadvantages deserve serious attention.", "vi": "Những bất lợi này đáng được xem xét nghiêm túc.", "alts": ["The disadvantages should be taken seriously.", "These drawbacks deserve careful consideration."]}, {"p": 1, "en": "Businesses and essential services can be disrupted.", "vi": "Hoạt động kinh doanh và các dịch vụ thiết yếu có thể bị gián đoạn.", "alts": ["Businesses and essential services may be disrupted.", "Companies and vital services can face disruption."]}, {"p": 1, "en": "Shops and restaurants in the centre may lose a large share of their usual customers, who cannot reach them easily on a vehicle-free day.", "vi": "Cửa hàng và nhà hàng ở trung tâm có thể mất một phần lớn lượng khách quen, vì họ khó đến được trong ngày cấm xe.", "alts": ["Shops and restaurants in the centre may lose a big share of their regular customers, who find it hard to get there on a vehicle-free day.", "Central shops and restaurants may lose many of their usual customers because the customers cannot easily reach them on a car-free day."]}, {"p": 1, "en": "Delivery lorries cannot supply stores during the day, which leaves some shelves empty by the evening.", "vi": "Xe tải giao hàng không thể tiếp tế cho các cửa hàng trong ngày, khiến một số kệ hàng trống trơn vào buổi tối.", "alts": ["Delivery lorries are unable to supply shops during the day, so some shelves are empty by evening.", "Delivery trucks cannot restock stores in the daytime, leaving some shelves bare by the evening."]}, {"p": 1, "en": "Public transport is also hard to use for some residents.", "vi": "Phương tiện công cộng cũng khó sử dụng với một số người dân.", "alts": ["Public transport is also difficult for some residents to use.", "Some residents also find public transport hard to use."]}, {"p": 1, "en": "People with disabilities, elderly residents and parents with small children often find buses and trains difficult to board.", "vi": "Người khuyết tật, người cao tuổi và phụ huynh có con nhỏ thường thấy xe buýt và tàu khó lên xuống.", "alts": ["Disabled people, the elderly and parents with young children often find it hard to get on and off buses and trains.", "People with disabilities, older residents and parents with small children often struggle to board buses and trains."]}, {"p": 1, "en": "Carriages become overcrowded when thousands of drivers switch at once, and long waits at crowded stations make the journey even more tiring for every passenger.", "vi": "Toa tàu trở nên quá tải khi hàng nghìn người lái xe chuyển sang cùng lúc, và việc phải chờ lâu ở các ga đông người khiến hành trình thêm mệt mỏi cho mọi hành khách.", "alts": ["Carriages get overcrowded when thousands of drivers change to public transport together, and long waits at busy stations make the trip more tiring for everyone.", "Trains become packed when thousands of drivers switch at the same time, and long waits at crowded stations make the journey more exhausting for all passengers."]}, {"p": 1, "en": "However, these problems affect only one day and can be reduced with extra services and exemptions for emergency and medical vehicles.", "vi": "Tuy nhiên, những vấn đề này chỉ xảy ra trong một ngày và có thể giảm bớt bằng các chuyến phục vụ bổ sung và miễn trừ cho xe cấp cứu và xe y tế.", "alts": ["Nevertheless, these problems last for only a day and can be eased with additional services and exceptions for ambulances and medical vehicles.", "However, the problems occur on one day only and can be reduced by running extra services and exempting emergency and medical vehicles."]}, {"p": 2, "en": "In my view, the benefits are substantial, mainly because vehicle-free days clean the air and change travel habits.", "vi": "Theo tôi, lợi ích là đáng kể, chủ yếu vì các ngày cấm xe làm sạch không khí và thay đổi thói quen đi lại.", "alts": ["In my opinion, the benefits are significant, mainly because car-free days clear the air and change how people travel.", "I believe the advantages are considerable, chiefly because vehicle-free days purify the air and alter travel habits."]}, {"p": 2, "en": "Air and noise pollution fall sharply.", "vi": "Ô nhiễm không khí và tiếng ồn giảm mạnh.", "alts": ["Air pollution and noise drop sharply.", "Both air and noise pollution fall considerably."]}, {"p": 2, "en": "With cars, trucks and motorcycles absent, levels of exhaust gases drop, especially near busy junctions, and residents breathe cleaner air.", "vi": "Khi xe hơi, xe tải và xe máy vắng bóng, nồng độ khí thải giảm, nhất là gần các ngã tư đông đúc, và người dân hít thở không khí sạch hơn.", "alts": ["Without cars, trucks and motorcycles, exhaust gas levels decline, particularly near busy junctions, and residents breathe fresher air.", "When cars, trucks and motorbikes are absent, exhaust fumes decrease, especially near busy crossroads, and people breathe cleaner air."]}, {"p": 2, "en": "The streets also become quiet enough for people to talk and for children to play, which improves the quality of urban life.", "vi": "Đường phố cũng đủ yên tĩnh để mọi người trò chuyện và trẻ em vui chơi, điều này cải thiện chất lượng cuộc sống đô thị.", "alts": ["The streets also become quiet enough for people to chat and for children to play, which improves urban quality of life.", "Streets are also calm enough for conversation and children's play, which raises the quality of city life."]}, {"p": 2, "en": "The policy also changes habits.", "vi": "Chính sách này còn thay đổi thói quen.", "alts": ["The policy also changes people's habits.", "This policy also changes how people behave."]}, {"p": 2, "en": "Citizens who try the metro or a bicycle for a day may find that it is cheaper and faster than they expected, and some then use it more often.", "vi": "Người dân thử đi tàu điện ngầm hoặc xe đạp một ngày có thể thấy nó rẻ hơn và nhanh hơn họ nghĩ, và một số người sau đó dùng thường xuyên hơn.", "alts": ["Residents who try the metro or cycling for a day may discover that it is cheaper and quicker than they thought, and some then use it more regularly.", "People who test the metro or a bicycle for a day may find it cheaper and faster than expected, and some go on to use it more often."]}, {"p": 2, "en": "Cities that have tried car-free days, such as Bogotá with its weekly Ciclovía, report that large numbers of residents enjoy and repeat the experience.", "vi": "Những thành phố từng thử ngày không xe, như Bogotá với sự kiện Ciclovía hằng tuần, cho biết rất nhiều cư dân thích và lặp lại trải nghiệm này.", "alts": ["Cities that have held car-free days, for example Bogotá with its weekly Ciclovía, report that many residents enjoy the experience and take part again.", "Places that have tried car-free days, like Bogotá with its weekly Ciclovía, say that large numbers of people enjoy the event and repeat it."]}, {"p": 3, "en": "In conclusion, vehicle-free days cause temporary inconvenience for businesses and travellers, especially people with limited mobility and families with small children.", "vi": "Tóm lại, các ngày cấm xe gây bất tiện tạm thời cho doanh nghiệp và người đi lại, nhất là người hạn chế vận động và gia đình có con nhỏ.", "alts": ["To conclude, vehicle-free days cause short-term inconvenience for businesses and travellers, particularly people with limited mobility and families with small children.", "In conclusion, car-free days create temporary inconvenience for firms and commuters, especially those with limited mobility and families with small children."]}, {"p": 3, "en": "Nevertheless, cleaner air and lasting changes in travel habits make the policy worthwhile for the city as a whole and its residents.", "vi": "Tuy nhiên, không khí sạch hơn và những thay đổi lâu dài trong thói quen đi lại khiến chính sách này đáng làm đối với toàn thành phố và cư dân.", "alts": ["However, cleaner air and long-term changes in how people travel make the policy worthwhile for the city and its residents as a whole.", "Even so, cleaner air and lasting changes in travel habits justify the policy for the whole city and its residents."]}], "no": 30, "type": "Advantages outweigh disadvantages", "words": 332}, {"title": "A Single Legal System", "prompt": "Some people think it is better for a single legal system throughout the world. Others say countries should have their own law. Discuss both views and give your opinion.", "paras": ["The idea of one legal code for the whole world divides opinion, with supporters stressing consistency and critics defending national sovereignty. I believe each country should keep its own laws, although closer cooperation on shared problems is desirable.", "Supporters of a single system argue that it would simplify trade. A contract that is valid in one country may be void in the next, which confuses companies and travellers who operate across borders. A common code would remove this confusion and make trade easier and cheaper, particularly for small firms that cannot afford international lawyers. Global problems also cross borders. Cybercrime, tax avoidance and pollution are hard to tackle when offenders can easily move to a country with weaker laws. Shared rules would close such loopholes and make penalties consistent in every jurisdiction, leaving criminals no safe haven. However, one code would ignore real differences between societies, and enforcing it would be far harder than writing it.", "In my view, national laws are more suitable, mainly because they reflect local values and remain accountable to citizens. Laws reflect the values of the people who live under them. Attitudes to marriage, alcohol, free speech and religion differ widely, and a rule accepted in one society may seem offensive in another. Forcing everyone to follow one code would breed resentment, and foreign legal models imposed on countries have often been ignored or bypassed in practice. Citizens also need to hold lawmakers accountable. A parliament that people elect can be voted out if its laws fail, whereas a global body would be distant and difficult to influence. Changing a faulty law would also take far longer in a worldwide system than in a single national parliament.", "In conclusion, a single legal system would bring consistency, but it cannot respect cultural differences or stay accountable to ordinary citizens. Countries should therefore keep their own laws while signing international treaties on matters such as cybercrime and the environment."], "sents": [{"p": 0, "en": "The idea of one legal code for the whole world divides opinion, with supporters stressing consistency and critics defending national sovereignty.", "vi": "Ý tưởng về một bộ luật chung cho cả thế giới gây chia rẽ ý kiến, khi người ủng hộ nhấn mạnh sự nhất quán còn người phản đối bảo vệ chủ quyền quốc gia.", "alts": ["The notion of a single legal code for the entire world splits opinion, as supporters emphasise consistency and critics defend national sovereignty.", "One legal code for the whole world is a divisive idea: supporters stress consistency, while critics protect national sovereignty."]}, {"p": 0, "en": "I believe each country should keep its own laws, although closer cooperation on shared problems is desirable.", "vi": "Tôi cho rằng mỗi quốc gia nên giữ luật riêng của mình, dù việc hợp tác chặt chẽ hơn về các vấn đề chung là điều đáng mong muốn.", "alts": ["In my opinion, every country should keep its own laws, although closer cooperation on common problems would be welcome.", "I think each nation should retain its own laws, though it would be good to cooperate more closely on shared problems."]}, {"p": 1, "en": "Supporters of a single system argue that it would simplify trade.", "vi": "Những người ủng hộ một hệ thống chung cho rằng nó sẽ đơn giản hóa thương mại.", "alts": ["Advocates of a single system claim that it would make trade simpler.", "Those in favour of one system argue that it would simplify trade."]}, {"p": 1, "en": "A contract that is valid in one country may be void in the next, which confuses companies and travellers who operate across borders.", "vi": "Một hợp đồng hợp lệ ở nước này có thể vô hiệu ở nước kế bên, điều này gây rối cho các công ty và du khách hoạt động xuyên biên giới.", "alts": ["A contract that is valid in one country may be invalid in the next, which confuses firms and travellers who operate across borders.", "A contract recognised in one country might be void in the next, causing confusion for companies and travellers who work across borders."]}, {"p": 1, "en": "A common code would remove this confusion and make trade easier and cheaper, particularly for small firms that cannot afford international lawyers.", "vi": "Một bộ luật chung sẽ xóa bỏ sự rối rắm này và khiến thương mại dễ dàng và rẻ hơn, nhất là với các doanh nghiệp nhỏ không đủ tiền thuê luật sư quốc tế.", "alts": ["A common code would remove this confusion and make trade easier and cheaper, especially for small businesses that cannot afford international lawyers.", "A shared code would end this confusion and make trade simpler and less costly, particularly for small firms without the money for international lawyers."]}, {"p": 1, "en": "Global problems also cross borders.", "vi": "Các vấn đề toàn cầu cũng vượt qua biên giới.", "alts": ["Problems on a global scale also cross national borders.", "Global problems do not stop at borders either."]}, {"p": 1, "en": "Cybercrime, tax avoidance and pollution are hard to tackle when offenders can easily move to a country with weaker laws.", "vi": "Tội phạm mạng, trốn thuế và ô nhiễm rất khó xử lý khi người vi phạm có thể dễ dàng chuyển sang một nước có luật yếu hơn.", "alts": ["Cybercrime, tax avoidance and pollution are difficult to deal with when offenders can easily move to a country with weaker laws.", "It is hard to tackle cybercrime, tax avoidance and pollution when criminals can easily relocate to a country with weaker laws."]}, {"p": 1, "en": "Shared rules would close such loopholes and make penalties consistent in every jurisdiction, leaving criminals no safe haven.", "vi": "Các quy tắc chung sẽ bịt những kẽ hở như vậy và làm cho hình phạt nhất quán ở mọi khu vực tài phán, khiến tội phạm không còn nơi trú ẩn an toàn.", "alts": ["Common rules would close such loopholes and make penalties consistent in every jurisdiction, so criminals would have nowhere safe to go.", "Shared rules would shut these loopholes and harmonise punishments in every jurisdiction, leaving criminals no safe haven."]}, {"p": 1, "en": "However, one code would ignore real differences between societies, and enforcing it would be far harder than writing it.", "vi": "Tuy nhiên, một bộ luật duy nhất sẽ bỏ qua những khác biệt thực sự giữa các xã hội, và việc thực thi nó sẽ khó hơn nhiều so với việc soạn ra nó.", "alts": ["Nevertheless, a single code would overlook real differences between societies, and enforcing it would be much harder than drafting it.", "However, one code would ignore genuine differences between societies, and applying it would be far more difficult than writing it."]}, {"p": 2, "en": "In my view, national laws are more suitable, mainly because they reflect local values and remain accountable to citizens.", "vi": "Theo tôi, luật quốc gia phù hợp hơn, chủ yếu vì chúng phản ánh các giá trị địa phương và vẫn chịu trách nhiệm giải trình trước công dân.", "alts": ["In my opinion, national laws are more appropriate, chiefly because they reflect local values and stay accountable to citizens.", "I believe national laws suit better, mainly because they mirror local values and remain answerable to citizens."]}, {"p": 2, "en": "Laws reflect the values of the people who live under them.", "vi": "Luật pháp phản ánh các giá trị của những người sống dưới nó.", "alts": ["Laws mirror the values of the people who live under them.", "The law reflects the values of the people it governs."]}, {"p": 2, "en": "Attitudes to marriage, alcohol, free speech and religion differ widely, and a rule accepted in one society may seem offensive in another.", "vi": "Quan điểm về hôn nhân, rượu, tự do ngôn luận và tôn giáo rất khác nhau, và một quy tắc được chấp nhận ở xã hội này có thể bị coi là xúc phạm ở xã hội khác.", "alts": ["Views on marriage, alcohol, free speech and religion vary greatly, and a rule accepted in one society may seem offensive in another.", "Attitudes towards marriage, alcohol, free speech and religion differ greatly, and what is acceptable in one society may offend another."]}, {"p": 2, "en": "Forcing everyone to follow one code would breed resentment, and foreign legal models imposed on countries have often been ignored or bypassed in practice.", "vi": "Buộc mọi người tuân theo một bộ luật sẽ gây bất mãn, và các mô hình pháp luật nước ngoài áp đặt lên các quốc gia thường bị phớt lờ hoặc né tránh trong thực tế.", "alts": ["Making everyone obey one code would create resentment, and foreign legal models imposed on countries have often been ignored or avoided in practice.", "Forcing all people to follow a single code would cause bitterness, and legal models imported from abroad have often been disregarded or circumvented."]}, {"p": 2, "en": "Citizens also need to hold lawmakers accountable.", "vi": "Công dân cũng cần chất vấn những người làm luật.", "alts": ["Citizens also need to be able to hold lawmakers to account.", "People also need the power to hold legislators accountable."]}, {"p": 2, "en": "A parliament that people elect can be voted out if its laws fail, whereas a global body would be distant and difficult to influence.", "vi": "Một quốc hội do dân bầu có thể bị bãi nhiệm nếu các đạo luật của nó thất bại, trong khi một cơ quan toàn cầu sẽ xa cách và khó tác động.", "alts": ["An elected parliament can be voted out if its laws fail, while a worldwide body would be remote and hard to influence.", "Voters can remove a parliament whose laws fail, but a global authority would be distant and hard to influence."]}, {"p": 2, "en": "Changing a faulty law would also take far longer in a worldwide system than in a single national parliament.", "vi": "Việc sửa một đạo luật hỏng cũng sẽ mất nhiều thời gian hơn hẳn trong một hệ thống toàn cầu so với trong một quốc hội quốc gia.", "alts": ["Amending a flawed law would also take much longer in a global system than in one national parliament.", "Fixing a faulty law would also be far slower under a worldwide system than in a single national parliament."]}, {"p": 3, "en": "In conclusion, a single legal system would bring consistency, but it cannot respect cultural differences or stay accountable to ordinary citizens.", "vi": "Tóm lại, một hệ thống pháp luật duy nhất sẽ mang lại sự nhất quán, nhưng không thể tôn trọng khác biệt văn hóa hay chịu trách nhiệm giải trình trước người dân bình thường.", "alts": ["To conclude, a single legal system would provide consistency, but it could not respect cultural differences or remain accountable to ordinary citizens.", "In conclusion, one global legal system would offer consistency, but it would neither respect cultural differences nor answer to ordinary people."]}, {"p": 3, "en": "Countries should therefore keep their own laws while signing international treaties on matters such as cybercrime and the environment.", "vi": "Vì vậy, các quốc gia nên giữ luật riêng trong khi ký các hiệp ước quốc tế về những vấn đề như tội phạm mạng và môi trường.", "alts": ["Countries should therefore keep their own laws and sign international treaties on issues such as cybercrime and the environment.", "For this reason, nations should retain their own laws while agreeing international treaties on matters like cybercrime and the environment."]}], "no": 31, "type": "Discuss both views", "words": 322}, {"title": "Mobile Phone Bans", "prompt": "Some people say that mobile phones should be banned in public places such as libraries, shops, and public transport. Do you agree or disagree?", "paras": ["Mobile phones are now part of daily life, yet some people want them banned in public places such as libraries, shops and public transport. I disagree with a complete ban, although polite behaviour from every user is certainly needed.", "Those who support a ban have understandable concerns. Phones are noisy in places that depend on quiet. A ringtone or a loud conversation can ruin the concentration of readers who have come to a library to study or disturb the sleep of passengers on a late train. Even a short call can feel intrusive when the room is silent and every word is audible. Privacy is another worry. Shoppers and commuters may be filmed or photographed without permission, and the images can then be shared online within seconds. Private conversations, including details of medical or financial matters, are also broadcast to strangers who cannot avoid hearing them. However, these problems come from careless behaviour, not from the devices themselves.", "In my view, a blanket ban would cause more harm than good. Phones are practical tools that keep people safe and informed. A traveller can call an ambulance, check a map or show a digital ticket within seconds, which is especially valuable in an unfamiliar city. A passenger who feels unwell on a crowded bus, for instance, needs to be able to call for help at once. A ban would also disrupt ordinary daily activities in shops and on public transport. Shoppers use phones to pay at the till or show discount coupons, while commuters answer urgent work messages on the way to the office. Millions of considerate users would be inconvenienced, and sometimes even fined, in order to stop a small minority who behave carelessly in public.", "In conclusion, phones can disturb others, but a total ban would remove valuable safety and convenience. Clear etiquette rules and quiet zones, such as silent carriages and separate areas for calls, are a fairer and more realistic way to protect shared spaces for everyone."], "sents": [{"p": 0, "en": "Mobile phones are now part of daily life, yet some people want them banned in public places such as libraries, shops and public transport.", "vi": "Điện thoại di động nay đã là một phần của cuộc sống hằng ngày, nhưng một số người muốn cấm chúng ở nơi công cộng như thư viện, cửa hàng và phương tiện công cộng.", "alts": ["Mobile phones have become part of everyday life, but some people want to ban them in public places such as libraries, shops and on public transport.", "Mobile phones are now a part of daily life, yet certain people would like them banned in public places like libraries, shops and public transport."]}, {"p": 0, "en": "I disagree with a complete ban, although polite behaviour from every user is certainly needed.", "vi": "Tôi không đồng ý với lệnh cấm hoàn toàn, dù cách cư xử lịch sự của mọi người dùng chắc chắn là cần thiết.", "alts": ["I do not agree with a total ban, although polite behaviour from every user is definitely necessary.", "I am against a complete ban, although courteous behaviour from all users is certainly required."]}, {"p": 1, "en": "Those who support a ban have understandable concerns.", "vi": "Những người ủng hộ lệnh cấm có những lo ngại dễ hiểu.", "alts": ["Supporters of a ban have concerns that are easy to understand.", "People who favour a ban have reasonable concerns."]}, {"p": 1, "en": "Phones are noisy in places that depend on quiet.", "vi": "Điện thoại gây ồn ở những nơi cần sự yên tĩnh.", "alts": ["Phones make noise in places that rely on quiet.", "Phones are noisy in places where silence is important."]}, {"p": 1, "en": "A ringtone or a loud conversation can ruin the concentration of readers who have come to a library to study or disturb the sleep of passengers on a late train.", "vi": "Một tiếng chuông hay một cuộc trò chuyện lớn tiếng có thể phá hỏng sự tập trung của người đọc đến thư viện để học hoặc làm phiền giấc ngủ của hành khách trên chuyến tàu muộn.", "alts": ["A ringtone or a loud conversation can ruin the concentration of readers who have come to a library to study or disturb passengers trying to sleep on a late train.", "A ringing phone or a loud conversation can destroy the focus of library readers who are studying or wake up passengers sleeping on a late train."]}, {"p": 1, "en": "Even a short call can feel intrusive when the room is silent and every word is audible.", "vi": "Ngay cả một cuộc gọi ngắn cũng có thể gây khó chịu khi căn phòng im lặng và từng lời đều nghe rõ.", "alts": ["Even a brief call can feel intrusive when the room is silent and every word can be heard.", "Even a short phone call can seem intrusive in a quiet room where every word is audible."]}, {"p": 1, "en": "Privacy is another worry.", "vi": "Quyền riêng tư là mối lo khác.", "alts": ["Privacy is also a concern.", "Privacy is another source of worry."]}, {"p": 1, "en": "Shoppers and commuters may be filmed or photographed without permission, and the images can then be shared online within seconds.", "vi": "Người mua sắm và người đi làm có thể bị quay phim hoặc chụp ảnh mà không được phép, và những hình ảnh đó có thể bị chia sẻ trực tuyến chỉ trong vài giây.", "alts": ["Shoppers and commuters may be filmed or photographed without permission, and the images can then be shared online within seconds.", "People shopping or commuting could be filmed or photographed without their consent, and the pictures can be posted online within seconds."]}, {"p": 1, "en": "Private conversations, including details of medical or financial matters, are also broadcast to strangers who cannot avoid hearing them.", "vi": "Những cuộc trò chuyện riêng tư, kể cả thông tin y tế hay tài chính, cũng bị phát đến người lạ không thể tránh nghe thấy.", "alts": ["Private conversations, including medical or financial details, are also broadcast to strangers who cannot help hearing them.", "Personal conversations, even about health or money, are also heard by strangers who cannot avoid listening."]}, {"p": 1, "en": "However, these problems come from careless behaviour, not from the devices themselves.", "vi": "Tuy nhiên, những vấn đề này xuất phát từ hành vi thiếu cẩn trọng, chứ không phải từ chính thiết bị.", "alts": ["Nevertheless, these problems are caused by careless behaviour, not by the devices themselves.", "However, these problems stem from thoughtless behaviour rather than from the phones themselves."]}, {"p": 2, "en": "In my view, a blanket ban would cause more harm than good.", "vi": "Theo tôi, một lệnh cấm toàn diện sẽ gây hại nhiều hơn lợi.", "alts": ["In my opinion, a total ban would do more harm than good.", "I believe a blanket ban would cause more damage than benefit."]}, {"p": 2, "en": "Phones are practical tools that keep people safe and informed.", "vi": "Điện thoại là công cụ thiết thực giúp mọi người an toàn và nắm được thông tin.", "alts": ["Phones are useful tools that help people stay safe and informed.", "Phones are practical devices that keep people safe and well informed."]}, {"p": 2, "en": "A traveller can call an ambulance, check a map or show a digital ticket within seconds, which is especially valuable in an unfamiliar city.", "vi": "Một du khách có thể gọi xe cấp cứu, xem bản đồ hoặc xuất trình vé điện tử trong vài giây, điều đặc biệt hữu ích ở một thành phố xa lạ.", "alts": ["A traveller can call an ambulance, look at a map or show a digital ticket within seconds, which is particularly useful in a city they do not know.", "Within seconds, a tourist can phone an ambulance, check a map or present an e-ticket, which is especially helpful in an unfamiliar city."]}, {"p": 2, "en": "A passenger who feels unwell on a crowded bus, for instance, needs to be able to call for help at once.", "vi": "Chẳng hạn, một hành khách thấy không khỏe trên chuyến xe buýt đông đúc cần có thể gọi trợ giúp ngay lập tức.", "alts": ["For example, a passenger who feels ill on a crowded bus must be able to call for help immediately.", "A passenger who becomes unwell on a packed bus, for instance, has to be able to ask for help straight away."]}, {"p": 2, "en": "A ban would also disrupt ordinary daily activities in shops and on public transport.", "vi": "Lệnh cấm cũng sẽ làm gián đoạn các sinh hoạt thường ngày ở cửa hàng và trên phương tiện công cộng.", "alts": ["A ban would also interfere with everyday activities in shops and on public transport.", "Banning phones would also disturb normal daily routines in shops and on public transport."]}, {"p": 2, "en": "Shoppers use phones to pay at the till or show discount coupons, while commuters answer urgent work messages on the way to the office.", "vi": "Người mua sắm dùng điện thoại để thanh toán tại quầy hoặc xuất trình phiếu giảm giá, trong khi người đi làm trả lời các tin nhắn công việc khẩn trên đường đến văn phòng.", "alts": ["Shoppers use their phones to pay at the checkout or show discount vouchers, while commuters reply to urgent work messages on their way to the office.", "Customers pay at the till or show coupons with their phones, whereas commuters answer urgent work messages on the way to work."]}, {"p": 2, "en": "Millions of considerate users would be inconvenienced, and sometimes even fined, in order to stop a small minority who behave carelessly in public.", "vi": "Hàng triệu người dùng ý tứ sẽ bị gây phiền toái, thậm chí đôi khi bị phạt, chỉ để ngăn một thiểu số nhỏ cư xử thiếu cẩn trọng nơi công cộng.", "alts": ["Millions of thoughtful users would be inconvenienced, and sometimes even fined, just to stop a small minority who behave carelessly in public.", "Millions of considerate users would be troubled, and occasionally fined, in order to control a small minority who behave carelessly in public places."]}, {"p": 3, "en": "In conclusion, phones can disturb others, but a total ban would remove valuable safety and convenience.", "vi": "Tóm lại, điện thoại có thể làm phiền người khác, nhưng lệnh cấm hoàn toàn sẽ lấy đi sự an toàn và tiện lợi đáng giá.", "alts": ["To conclude, phones can disturb others, but a complete ban would take away valuable safety and convenience.", "In conclusion, phones may disturb other people, but a total ban would remove important safety and convenience."]}, {"p": 3, "en": "Clear etiquette rules and quiet zones, such as silent carriages and separate areas for calls, are a fairer and more realistic way to protect shared spaces for everyone.", "vi": "Các quy tắc ứng xử rõ ràng và khu vực yên tĩnh, như toa yên tĩnh và khu vực gọi điện riêng, là cách công bằng và thực tế hơn để bảo vệ không gian chung cho mọi người.", "alts": ["Clear rules of etiquette and quiet zones, such as silent carriages and separate areas for calls, are a fairer and more practical way to protect shared spaces for everyone.", "Simple etiquette rules and quiet areas, for example silent carriages and designated spaces for calls, are a fairer and more realistic way to protect public spaces for all."]}], "no": 32, "type": "Agree or disagree", "words": 330}, {"title": "Community Gardens", "prompt": "In some cities, public parks and open spaces are changed into gardens where local residents can grow their own fruit and vegetables. Do you think the benefits outweigh the disadvantages?", "paras": ["In some cities, public parks and open spaces are being turned into community gardens where residents grow their own fruit and vegetables. I believe the benefits outweigh the drawbacks, provided that enough open space remains for everyone to enjoy.", "Critics point to several drawbacks. Parks exist for recreation, and every plot given to growers reduces space for football, picnics, dog walking and children's play. Crowded districts, where few people have private gardens, are hit hardest. A parent in a small flat may have nowhere else nearby for a child to run around safely, especially in districts with heavy traffic. Gardens also need constant care and cooperation. Without volunteers, neglected plots fill with weeds, attract pests and look worse than the lawns they replaced within a single summer. Disputes over fences, tools and harvests are common, while theft of crops can discourage even keen gardeners. However, a well-designed scheme can keep part of the park open and share the work fairly among residents.", "Community gardens, in my view, bring benefits that ordinary lawns cannot match, mainly in nutrition and community life. They give families access to fresh, cheap produce, which matters in low-income areas where healthy food is costly or hard to find. Growing vegetables also encourages children to eat them, which can improve their diet for years. A single plot can supply a household with salad leaves, herbs and tomatoes for months. Gardens also strengthen neighbourhoods. Strangers who work side by side exchange gardening tips, share surplus crops and form lasting friendships. Shared work days bring together residents of different ages and backgrounds who would otherwise never meet. Elderly residents, in particular, gain a sense of purpose and regular company, which reduces loneliness.", "In conclusion, losing some open space and managing the plots takes effort, but the gains in nutrition and community spirit are far greater. Councils should therefore support gardens while keeping lawns and playgrounds available for those who need them."], "sents": [{"p": 0, "en": "In some cities, public parks and open spaces are being turned into community gardens where residents grow their own fruit and vegetables.", "vi": "Ở một số thành phố, công viên và không gian mở công cộng đang được chuyển thành vườn cộng đồng, nơi cư dân trồng rau quả của riêng mình.", "alts": ["In some cities, parks and public open spaces are being converted into community gardens in which residents grow their own fruit and vegetables.", "In certain cities, public parks and open spaces are turned into community gardens where local people grow their own fruit and vegetables."]}, {"p": 0, "en": "I believe the benefits outweigh the drawbacks, provided that enough open space remains for everyone to enjoy.", "vi": "Tôi cho rằng lợi ích lớn hơn bất lợi, miễn là vẫn còn đủ không gian mở cho mọi người tận hưởng.", "alts": ["I believe the advantages outweigh the disadvantages, as long as enough open space is left for everyone to enjoy.", "In my opinion, the benefits are greater than the drawbacks, provided that there is still enough open space for everybody."]}, {"p": 1, "en": "Critics point to several drawbacks.", "vi": "Những người phản đối chỉ ra một số bất lợi.", "alts": ["Opponents mention several disadvantages.", "Critics highlight a number of drawbacks."]}, {"p": 1, "en": "Parks exist for recreation, and every plot given to growers reduces space for football, picnics, dog walking and children's play.", "vi": "Công viên tồn tại để giải trí, và mỗi mảnh đất giao cho người trồng trọt làm giảm không gian cho bóng đá, dã ngoại, dắt chó đi dạo và trò chơi của trẻ em.", "alts": ["Parks exist for leisure, and each plot given to growers takes away space for football, picnics, dog walking and children's play.", "Parks are meant for recreation, and every plot handed to growers reduces the room for football, picnics, walking dogs and children's games."]}, {"p": 1, "en": "Crowded districts, where few people have private gardens, are hit hardest.", "vi": "Những khu đông đúc, nơi ít người có vườn riêng, chịu ảnh hưởng nặng nhất.", "alts": ["Crowded districts, where few residents have private gardens, are affected most.", "Densely populated areas, where few people own private gardens, suffer the most."]}, {"p": 1, "en": "A parent in a small flat may have nowhere else nearby for a child to run around safely, especially in districts with heavy traffic.", "vi": "Một phụ huynh sống trong căn hộ nhỏ có thể không còn chỗ nào khác gần đó cho con chạy chơi an toàn, nhất là ở những khu có nhiều xe cộ.", "alts": ["A parent living in a small flat may have no other place nearby where a child can run around safely, particularly in areas with heavy traffic.", "A parent in a small apartment may have nowhere else close by for a child to play safely, especially where traffic is heavy."]}, {"p": 1, "en": "Gardens also need constant care and cooperation.", "vi": "Vườn cũng cần được chăm sóc liên tục và sự hợp tác.", "alts": ["Gardens also require constant care and cooperation.", "Gardens also demand continuous maintenance and teamwork."]}, {"p": 1, "en": "Without volunteers, neglected plots fill with weeds, attract pests and look worse than the lawns they replaced within a single summer.", "vi": "Nếu thiếu tình nguyện viên, các mảnh vườn bị bỏ bê sẽ đầy cỏ dại, thu hút sâu bọ và trông tệ hơn những bãi cỏ mà chúng thay thế chỉ sau một mùa hè.", "alts": ["Without volunteers, abandoned plots become full of weeds, attract pests and look worse than the lawns they replaced within one summer.", "If there are no volunteers, neglected plots fill up with weeds, draw pests and look worse than the grass they replaced in a single summer."]}, {"p": 1, "en": "Disputes over fences, tools and harvests are common, while theft of crops can discourage even keen gardeners.", "vi": "Tranh chấp về hàng rào, dụng cụ và thu hoạch là chuyện thường gặp, trong khi nạn trộm nông sản có thể làm nản lòng cả những người làm vườn nhiệt tình.", "alts": ["Arguments about fences, tools and harvests are common, while crop theft can discourage even enthusiastic gardeners.", "Disputes over fences, tools and harvests often occur, and stolen crops can put off even keen gardeners."]}, {"p": 1, "en": "However, a well-designed scheme can keep part of the park open and share the work fairly among residents.", "vi": "Tuy nhiên, một mô hình được thiết kế tốt có thể giữ lại một phần công viên để mở và chia công việc công bằng giữa các cư dân.", "alts": ["Nevertheless, a well-planned scheme can leave part of the park open and divide the work fairly among residents.", "However, a carefully designed project can keep part of the park open and share the work equally among residents."]}, {"p": 2, "en": "Community gardens, in my view, bring benefits that ordinary lawns cannot match, mainly in nutrition and community life.", "vi": "Theo tôi, vườn cộng đồng mang lại những lợi ích mà bãi cỏ thông thường không thể sánh được, chủ yếu về dinh dưỡng và đời sống cộng đồng.", "alts": ["In my opinion, community gardens offer benefits that ordinary lawns cannot match, mainly in nutrition and community life.", "I think community gardens provide advantages that normal lawns cannot offer, chiefly in terms of nutrition and community life."]}, {"p": 2, "en": "They give families access to fresh, cheap produce, which matters in low-income areas where healthy food is costly or hard to find.", "vi": "Chúng giúp các gia đình tiếp cận nông sản tươi và rẻ, điều quan trọng ở những khu thu nhập thấp, nơi thực phẩm lành mạnh đắt đỏ hoặc khó tìm.", "alts": ["They give families access to fresh and affordable produce, which is important in low-income areas where healthy food is expensive or difficult to find.", "They allow families to obtain fresh, cheap produce, which matters in poorer areas where healthy food costs a lot or is hard to find."]}, {"p": 2, "en": "Growing vegetables also encourages children to eat them, which can improve their diet for years.", "vi": "Việc trồng rau cũng khuyến khích trẻ ăn rau, điều có thể cải thiện chế độ ăn của các em trong nhiều năm.", "alts": ["Growing vegetables also motivates children to eat them, which can improve their diet for many years.", "Growing vegetables also encourages kids to eat them, which may improve their diet for years to come."]}, {"p": 2, "en": "A single plot can supply a household with salad leaves, herbs and tomatoes for months.", "vi": "Chỉ một mảnh vườn cũng có thể cung cấp cho một hộ gia đình rau xà lách, rau thơm và cà chua trong nhiều tháng.", "alts": ["One plot alone can provide a household with lettuce, herbs and tomatoes for months.", "A single plot is able to feed a household with salad leaves, herbs and tomatoes for several months."]}, {"p": 2, "en": "Gardens also strengthen neighbourhoods.", "vi": "Những khu vườn cũng làm khăng khít thêm tình làng nghĩa xóm.", "alts": ["Gardens also bring neighbourhoods closer together.", "Gardens also make neighbourhoods stronger."]}, {"p": 2, "en": "Strangers who work side by side exchange gardening tips, share surplus crops and form lasting friendships.", "vi": "Những người xa lạ làm việc cạnh nhau trao đổi mẹo làm vườn, chia sẻ nông sản dư và hình thành tình bạn lâu dài.", "alts": ["Strangers working next to each other swap gardening tips, share extra crops and make lasting friendships.", "People who work side by side, even strangers, exchange gardening advice, share spare produce and form long-lasting friendships."]}, {"p": 2, "en": "Shared work days bring together residents of different ages and backgrounds who would otherwise never meet.", "vi": "Những ngày lao động chung gắn kết các cư dân thuộc nhiều độ tuổi và hoàn cảnh khác nhau mà nếu không thì sẽ không bao giờ gặp nhau.", "alts": ["Communal work days bring together residents of different ages and backgrounds who would otherwise never meet.", "Group work days unite residents of different ages and backgrounds who would never meet otherwise."]}, {"p": 2, "en": "Elderly residents, in particular, gain a sense of purpose and regular company, which reduces loneliness.", "vi": "Đặc biệt, người cao tuổi tìm thấy mục đích sống và sự bầu bạn thường xuyên, điều giúp giảm bớt cô đơn.", "alts": ["Older residents in particular find a purpose in life and regular company, which reduces loneliness.", "In particular, elderly people gain a sense of purpose and regular company, which lessens loneliness."]}, {"p": 3, "en": "In conclusion, losing some open space and managing the plots takes effort, but the gains in nutrition and community spirit are far greater.", "vi": "Tóm lại, mất đi một phần không gian mở và quản lý các mảnh vườn đòi hỏi công sức, nhưng những lợi ích về dinh dưỡng và tinh thần cộng đồng lớn hơn nhiều.", "alts": ["To conclude, losing some open space and managing the plots take effort, but the benefits in nutrition and community spirit are far greater.", "In conclusion, giving up some open space and running the plots requires effort, but the gains in nutrition and community spirit are much greater."]}, {"p": 3, "en": "Councils should therefore support gardens while keeping lawns and playgrounds available f   if (HS.scope === 'open') L = L.filter(i => { const p = progressOf(i); return p.d < p.n; });
  if (HS.types.size) L = L.filter(i => HS.types.has(ESSAYS[i].type));
  if (HS.topics.size) L = L.filter(i => topicsOf(ESSAYS[i]).some(t => HS.topics.has(t)));
  if (HS.sort === 'desc') L.sort((x, y) => ESSAYS[y].no - ESSAYS[x].no);

}
function hl(sent,t){
  const i=sent.toLowerCase().indexOf(t.toLowerCase()); if(i<0) return esc(sent);
  return esc(sent.slice(0,i))+'<mark>'+esc(sent.slice(i,i+t.length))+'</mark>'+esc(sent.slice(i+t.length));
}
function exampleFor(t){
  const lt=t.toLowerCase(); const s=S.find(x=>x.en.toLowerCase().includes(lt)); if(!s) return '';
  return hl(s.en,t);
}
function mountVocab(){
  const g=document.getElementById('vgrid'); if(!g) return;
  const pos=t=>{const lt=t.toLowerCase();for(let k=0;k<S.length;k++){if(S[k].en.toLowerCase().includes(lt))return k*1000+S[k].en.toLowerCase().indexOf(lt);}return 1e9;};
  const list=(VOCAB[String(DATA.no)]||[]).slice().sort((a,b)=>pos(a[0])-pos(b[0]));
  g.innerHTML=list.map(e=>{
    const more=(VEX[e[0].toLowerCase()]||[]).map(x=>`<p class="ex more">${hl(x,e[0])}</p>`).join('');
    return `<div class="ventry"><div class="term">${esc(e[0])}</div><p class="vi">${esc(e[2])}</p><p class="ex">${exampleFor(e[0])}</p>${more}</div>`;
  }).join('');
  const bt=document.getElementById('vtoggle'), w=document.getElementById('vwrap');
  bt.onclick=()=>{const open=w.hidden; w.hidden=!open; bt.setAttribute('aria-expanded',open); bt.querySelector('b').textContent=open?'Ẩn':'Hiện';};
}

function renderRead() {
  stage = 'read'; setCrumb();
  view.innerHTML = `
  <section class="card essay">
    <p class="eyebrow">Bước 1 · Đọc bài mẫu</p>
    <p class="prompt">${esc(DATA.prompt)}</p>
    <h2>Essay ${DATA.no}: ${esc(DATA.title)}</h2>
    ${DATA.paras.map(p => `<p>${esc(p)}</p>`).join('')}
  </section>
  ${vocabHTML()}
  <div class="actions" style="margin-top:20px">
    <button class="primary" id="go">Tôi đã đọc xong, bắt đầu dịch</button>
    <button class="ghost" id="back">Về danh sách bài</button>
    <span class="hintnote">${S.length} câu, dịch từ tiếng Việt sang tiếng Anh</span>
  </div>`;
  mountVocab();
  document.getElementById('back').onclick = renderHome;
  document.getElementById('go').onclick = () => { idx = firstOpen(); renderTranslate(); };
}
function firstOpen() { const i = st.findIndex(s => !s.checked && !s.gave); return i < 0 ? 0 : i; }

function hintHTML(i) {
  const toks = split(S[i].en);
  return toks.map((t, k) => {
    if (!t.core) return `<span class="w">${esc(t.pre)}</span>`;
    const shown = st[i].shown.has(k);
    const core = shown ? `<span class="rev">${esc(t.core)}</span>` : `<span class="hid">${'_'.repeat(Math.max(2, t.core.length))}</span>`;
    return `<span class="w">${esc(t.pre)}${core}${esc(t.post)}</span>`;
  }).join('');
}

function renderTranslate() {
  stage = 'translate'; setCrumb();
  const s = S[idx], a = st[idx];
  const locked = a.checked || a.gave;
  view.innerHTML = `
  <div class="progress"><span>Câu ${idx + 1}/${S.length}</span><div class="bar"><i style="width:${(idx / S.length) * 100}%"></i></div><span>Đoạn ${s.p + 1}</span></div>
  <section class="card" style="margin-top:14px">
    <p class="eyebrow">Dịch sang tiếng Anh</p>
    <p class="vi" lang="vi">${esc(s.vi)}</p>
    <label for="ans" class="hintnote" style="display:block;margin-bottom:6px">Bản dịch của bạn</label>
    <textarea id="ans" lang="en" spellcheck="false" autocapitalize="off" ${locked ? 'readonly' : ''} placeholder="Type your English sentence here">${esc(a.text)}</textarea>
    <div class="hintline" id="hl" ${a.shown.size ? '' : 'hidden'} aria-live="polite">${hintHTML(idx)}</div>
    <div class="actions" style="margin-top:14px">
      <button class="hint" id="hint" ${locked ? 'disabled' : ''}>Gợi ý một từ</button>
      <button class="primary" id="check" ${locked ? 'disabled' : ''}>Kiểm tra</button>
      <button class="ghost" id="give" ${locked ? 'disabled' : ''}>Hiện đáp án</button>
      <span class="hintnote" id="hn"></span>
    </div>
    <div class="result" id="res" hidden></div>
  </section>
  <div class="actions" style="margin-top:20px;justify-content:space-between">
    <span class="actions"><button class="ghost" id="prev" ${idx === 0 ? 'disabled' : ''}>Câu trước</button><button class="ghost" id="reread">Đọc lại bài</button></span>
    <button class="primary" id="next" ${locked ? '' : 'disabled'}>${idx === S.length - 1 ? 'Xem kết quả' : 'Câu tiếp theo'}</button>
  </div>`;
  const ta = document.getElementById('ans');
  ta.oninput = () => { a.text = ta.value; };
  ta.onkeydown = e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') doCheck(); };
  document.getElementById('hint').onclick = doHint;
  document.getElementById('check').onclick = doCheck;
  document.getElementById('give').onclick = doGive;
  document.getElementById('next').onclick = () => { if (idx === S.length - 1) renderDone(); else { idx++; renderTranslate(); } };
  document.getElementById('prev').onclick = () => { idx--; renderTranslate(); };
  document.getElementById('reread').onclick = renderRead;
  updHintNote();
  if (locked) showResult();
  else if (!matchMedia('(pointer:coarse)').matches) ta.focus();
}

function updHintNote() {
  const a = st[idx], total = split(S[idx].en).filter(t => t.core).length;
  const hn = document.getElementById('hn');
  if (hn) hn.textContent = a.shown.size ? `Đã gợi ý ${a.shown.size}/${total} từ` : '';
  const hb = document.getElementById('hint');
  if (hb && a.shown.size >= total) hb.disabled = true;
}

function doHint() {
  const a = st[idx], toks = split(S[idx].en);
  const pool = toks.map((t, k) => t.core && !a.shown.has(k) ? k : -1).filter(k => k >= 0);
  if (!pool.length) return;
  a.shown.add(pool[Math.floor(Math.random() * pool.length)]);
  const hl = document.getElementById('hl'); hl.hidden = false; hl.innerHTML = hintHTML(idx);
  updHintNote();
}

function compare(user, target) {
  const tt = norm(target), uu = norm(user);
  const bag = new Map(); uu.forEach(w => bag.set(w, (bag.get(w) || 0) + 1));
  const hit = tt.map(w => { const c = bag.get(w) || 0; if (c > 0) { bag.set(w, c - 1); return true; } return false; });
  const tbag = new Map(); tt.forEach(w => tbag.set(w, (tbag.get(w) || 0) + 1));
  const extra = uu.map(w => { const c = tbag.get(w) || 0; if (c > 0) { tbag.set(w, c - 1); return false; } return true; });
  return { tt, uu, hit, extra, matched: hit.filter(Boolean).length };
}

function doCheck() {
  const a = st[idx];
  if (!a.text.trim()) { const hn = document.getElementById('hn'); hn.textContent = 'Hãy nhập bản dịch trước khi kiểm tra.'; return; }
  const c = bestCmp(a.text, S[idx]);
  logAct(); a.checked = true; a.matched = c.matched; a.total = c.tt.length; a.pct = Math.round(100 * c.matched / c.tt.length);
  lockUI(); showResult();
}
function doGive() { const a = st[idx]; logAct(); a.gave = true; a.pct = 0; a.total = norm(S[idx].en).length; lockUI(); showResult(); }
function lockUI() {
  ['hint', 'check', 'give'].forEach(id => document.getElementById(id).disabled = true);
  document.getElementById('ans').readOnly = true;
  document.getElementById('next').disabled = false;
}

function keyTermsFor(en){ const lt = en.toLowerCase(); return (VOCAB[String(DATA.no)] || []).filter(e => lt.includes(e[0].toLowerCase())); }
function termUsed(term, userText){
  const utoks = norm(userText);
  const words = term.toLowerCase().split(/[^a-z']+/).filter(w => w.length > 3);
  if (!words.length) return userText.toLowerCase().includes(term.toLowerCase());
  return words.every(w => { const stem = w.slice(0, Math.max(3, w.length - 3)); return utoks.some(u => u.startsWith(stem)); });
}
function bestCmp(user, s) {
  let best = null;
  [s.en].concat(s.alts || []).forEach((v, i) => { const c = compare(user, v); c.ver = v; c.vi = i; if (!best || c.matched / c.tt.length > best.matched / best.tt.length) best = c; });
  return best;
}
function showResult() {
  const a = st[idx], s = S[idx], res = document.getElementById('res');
  let tIdx = 0; const c = a.checked ? bestCmp(a.text, s) : null;
  const shown = c ? c.ver : s.en;
  const toks = split(shown);
  const others = [s.en].concat(s.alts || []).filter(v => v !== shown);
  const target = toks.map(t => {
    if (!t.core) return esc(t.pre);
    const cls = c ? (c.hit[tIdx] ? 'ok' : 'miss') : '';
    tIdx++;
    return `${esc(t.pre)}<span class="${cls}">${esc(t.core)}</span>${esc(t.post)}`;
  }).join(' ');
  let userHTML = '';
  if (c) {
    const raw = a.text.trim().split(/\s+/); let k = 0;
    userHTML = raw.map(w => { const n = norm(w); if (!n.length) return esc(w); const ex = n.map(() => c.extra[k++]).some(Boolean); return ex ? `<span class="extra">${esc(w)}</span>` : esc(w); }).join(' ');
  }
  const kts = keyTermsFor(s.en);
  const ktHTML = kts.length ? `<div class="kts"><small>Từ và cụm đáng học trong câu này${c ? ' (xanh: bạn đã dùng hoặc dùng dạng gần giống)' : ''}</small>${kts.map(e => `<div class="kt ${c && termUsed(e[0], a.text) ? 'used' : ''}"><b>${esc(e[0])}</b><span>${esc(e[2])}</span></div>`).join('')}</div>` : '';
  const hintTxt = a.shown.size ? ` · dùng ${a.shown.size} gợi ý` : '';
  res.hidden = false;
  res.innerHTML = `
    ${c ? `<div class="score"><strong>${a.self ? 'Đúng nghĩa' : a.pct + '%'}</strong><span>${a.self ? 'Bạn tự đánh giá bản dịch của mình đúng nghĩa' : a.matched + '/' + a.total + ' từ trùng với cách dịch mẫu gần nhất, chỉ để tham khảo'}${hintTxt}</span></div>` : `<div class="score"><span>Đã hiện đáp án${hintTxt}</span></div>`}
    ${c ? `<p class="cmp"><small>Câu của bạn (gạch chấm: từ không có trong bản mẫu)</small>${userHTML}</p>` : ''}
    <p class="cmp"><small>${c ? (c.vi > 0 ? 'Cách dịch mẫu gần với câu của bạn nhất (nền vàng: từ bạn chưa dùng)' : 'Bản mẫu (nền vàng: từ bạn chưa dùng)') : 'Bản mẫu'}</small>${target}</p>
    <div class="cmp alts"><small>Các cách dịch đúng khác</small>${others.map(v => `<p>${esc(v)}</p>`).join('')}</div>
    ${ktHTML}
    ${c ? `<p class="fine">Một câu tiếng Việt có thể dịch theo nhiều cách đúng. Nếu câu của bạn đúng nghĩa và đúng ngữ pháp dù khác bản mẫu, hãy tự đánh dấu bên dưới.</p><div class="actions"><button class="ghost" id="selfok">${a.self ? 'Bỏ đánh dấu' : 'Bản dịch của mình cũng đúng nghĩa'}</button></div>` : ''}`;
  res.insertAdjacentHTML('beforeend', '<div class="actions" style="margin-top:8px"><button class="primary" id="redo">Làm lại câu này</button></div>');
  document.getElementById('redo').onclick = () => { Object.assign(a, { text: '', shown: new Set(), checked: false, gave: false, pct: 0, matched: 0, self: false, raw: undefined }); renderTranslate(); };
  const so = document.getElementById('selfok');
  if (so) so.onclick = () => { if (a.raw === undefined) a.raw = a.pct; a.self = !a.self; a.pct = a.self ? 100 : a.raw; showResult(); };
}

function renderDone() {
  stage = 'done'; setCrumb();
  const done = st.filter(s => s.checked), avg = done.length ? Math.round(done.reduce((x, s) => x + s.pct, 0) / done.length) : 0;
  const hints = st.reduce((x, s) => x + s.shown.size, 0), gave = st.filter(s => s.gave).length;
  view.innerHTML = `
  <section class="card">
    <p class="eyebrow">Kết quả · Essay ${DATA.no}: ${esc(DATA.title)}</p>
    <div class="sum">
      <div><b>${avg}%</b><span>trùng từ trung bình (${done.length}/${S.length} câu đã kiểm tra)</span></div>
      <div><b>${hints}</b><span>lượt gợi ý</span></div>
      <div><b>${gave}</b><span>câu xem đáp án</span></div>
    </div>
  </section>
  <section class="card" style="margin-top:20px">
    <p class="eyebrow">Từng câu</p>
    <ol class="rows" style="list-style:none">${S.map((s, i) => `<li><span class="n">${i + 1}</span><span class="t">${esc(s.vi)}</span><span class="p" style="color:${st[i].checked ? (st[i].pct >= 70 ? 'var(--moss)' : st[i].pct >= 40 ? 'var(--ochre)' : 'var(--clay)') : 'var(--muted)'}">${st[i].checked ? st[i].pct + '%' : st[i].gave ? 'xem đáp án' : 'bỏ qua'}</span></li>`).join('')}</ol>
  </section>
  ${vocabHTML()}
  <div class="actions" style="margin-top:20px">
    <button class="primary" id="again">Làm lại từ đầu</button>
    <button class="ghost" id="rr">Đọc lại bài</button>
    <button class="ghost" id="hm">Về danh sách bài</button>
  </div>`;
  mountVocab();
  document.getElementById('again').onclick = () => { st.forEach(s => { s.text = ''; s.shown = new Set(); s.checked = false; s.gave = false; s.pct = 0; }); idx = 0; renderTranslate(); };
  document.getElementById('rr').onclick = renderRead;
  document.getElementById('hm').onclick = renderHome;
}
renderHome();
showWelcome();
</script>

</body></html>
