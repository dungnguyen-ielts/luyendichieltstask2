is the most effective of these methods, as it reaches the right audience cheaply."]}, {"p": 1, "en": "Companies rely on two main approaches to attract customers.", "vi": "Các công ty dựa vào hai cách tiếp cận chính để thu hút khách hàng.", "alts": ["Businesses depend on two main approaches to win customers."]}, {"p": 1, "en": "Advertising is the most familiar.", "vi": "Quảng cáo là cách quen thuộc nhất.", "alts": ["Advertising is the best known of them."]}, {"p": 1, "en": "Television commercials, billboards and social media posts make people aware of a product and associate it with desirable qualities, such as a sports brand linking its shoes to success and fitness.", "vi": "Quảng cáo truyền hình, biển quảng cáo và bài đăng trên mạng xã hội giúp mọi người biết đến một sản phẩm và gắn nó với những phẩm chất đáng mong muốn, như một thương hiệu thể thao gắn đôi giày của mình với thành công và sức khỏe.", "alts": ["TV adverts, billboards and social media posts raise awareness of a product and link it with attractive qualities, for example a sportswear brand connecting its shoes with success and fitness."]}, {"p": 1, "en": "Celebrity endorsements add credibility, as fans trust products used by people they admire.", "vi": "Việc người nổi tiếng quảng bá sản phẩm tăng thêm độ tin cậy, vì người hâm mộ tin những sản phẩm được người họ ngưỡng mộ sử dụng.", "alts": ["Celebrity endorsements lend credibility, because fans trust products that people they look up to use."]}, {"p": 1, "en": "Price promotions are the other approach.", "vi": "Khuyến mãi giá là cách tiếp cận còn lại.", "alts": ["Price promotions are the second approach."]}, {"p": 1, "en": "Seasonal discounts, buy-one-get-one-free offers and loyalty cards give shoppers a reason to buy now rather than later.", "vi": "Giảm giá theo mùa, ưu đãi mua một tặng một và thẻ khách hàng thân thiết cho người mua lý do để mua ngay thay vì để sau.", "alts": ["Seasonal sales, buy-one-get-one-free deals and loyalty cards give customers a reason to buy immediately instead of waiting.", "Seasonal sales, two-for-one deals and loyalty cards give customers a reason to buy immediately rather than later."]}, {"p": 1, "en": "Limited-time deals also create urgency, since customers fear missing a bargain.", "vi": "Các ưu đãi có thời hạn cũng tạo cảm giác cấp bách, vì khách hàng sợ bỏ lỡ món hời.", "alts": ["Time-limited offers also create a sense of urgency, because customers are afraid of missing a good deal."]}, {"p": 1, "en": "A free gift can also persuade a customer to choose one brand over a similar competitor.", "vi": "Một món quà tặng kèm cũng có thể thuyết phục khách chọn thương hiệu này thay vì một đối thủ tương tự.", "alts": ["A free gift can also convince a shopper to pick one brand rather than a similar rival."]}, {"p": 1, "en": "Supermarkets, for example, hand out points that can be exchanged for vouchers, which encourages shoppers to return every week.", "vi": "Chẳng hạn, các siêu thị phát điểm thưởng có thể đổi lấy phiếu mua hàng, khuyến khích khách quay lại mỗi tuần.", "alts": ["Supermarkets, for instance, give out points that can be swapped for vouchers, which encourages customers to come back every week.", "Supermarkets, for example, hand out points that can be swapped for vouchers, which motivates shoppers to return weekly."]}, {"p": 2, "en": "Targeted online advertising is the most effective method, and its strength lies in precision and control.", "vi": "Quảng cáo trực tuyến nhắm đúng đối tượng là phương pháp hiệu quả nhất, và sức mạnh của nó nằm ở sự chính xác và khả năng kiểm soát.", "alts": ["Targeted online advertising is the most effective approach, and its main strength is precision and control."]}, {"p": 2, "en": "It reaches the right audience.", "vi": "Nó tiếp cận đúng đối tượng.", "alts": ["It gets to the people who are most likely to buy.", "It reaches the intended audience."]}, {"p": 2, "en": "Platforms collect data on age, location and interests, so a company selling running shoes can show its advert only to people who follow fitness pages.", "vi": "Các nền tảng thu thập dữ liệu về độ tuổi, vị trí và sở thích, nên một công ty bán giày chạy bộ có thể chỉ hiển thị quảng cáo cho những người theo dõi các trang về thể hình.", "alts": ["Platforms gather data on age, location and interests, so a firm that sells running shoes can display its advert only to people who follow fitness pages."]}, {"p": 2, "en": "A television commercial, by contrast, is watched by millions who have no interest.", "vi": "Ngược lại, quảng cáo truyền hình được hàng triệu người xem mà phần lớn không quan tâm.", "alts": ["A television advert, on the other hand, is seen by millions of people who are not interested.", "A TV advert, by comparison, is seen by millions of people who are not interested."]}, {"p": 2, "en": "It is also measurable and affordable.", "vi": "Nó còn đo lường được và có chi phí hợp lý.", "alts": ["It is also easy to measure and inexpensive.", "It is also measurable and inexpensive."]}, {"p": 2, "en": "Businesses can see how many people clicked, visited the website or bought, and they can change the message or the budget within hours.", "vi": "Doanh nghiệp có thể thấy có bao nhiêu người bấm vào, truy cập trang web hoặc mua hàng, và có thể thay đổi nội dung hay ngân sách chỉ trong vài giờ.", "alts": ["Companies can see how many people clicked, visited the site or made a purchase, and they can adjust the message or budget within hours."]}, {"p": 2, "en": "A small dessert shop, for instance, can start with a modest daily spend and still reach local customers, something that was impossible when advertising meant buying expensive newspaper space.", "vi": "Chẳng hạn, một tiệm bánh ngọt nhỏ có thể bắt đầu với khoản chi vừa phải mỗi ngày mà vẫn tiếp cận được khách hàng quanh vùng, điều không thể làm được khi quảng cáo đồng nghĩa với việc mua chỗ quảng cáo đắt đỏ trên báo giấy.", "alts": ["A small dessert shop, for example, can begin with a low daily budget and still reach customers nearby, which was impossible when advertising meant paying for costly space in newspapers."]}, {"p": 3, "en": "In conclusion, advertising and price promotions are the two main ways in which companies increase sales.", "vi": "Tóm lại, quảng cáo và khuyến mãi giá là hai cách chính mà các công ty dùng để tăng doanh số.", "alts": ["To conclude, advertising and price promotions are the two main methods companies use to raise sales."]}, {"p": 3, "en": "Of these, targeted online advertising is the most effective because it combines precision with measurable results, which is why more companies move their budgets online each year.", "vi": "Trong đó, quảng cáo trực tuyến nhắm đúng đối tượng hiệu quả nhất vì kết hợp được sự chính xác với kết quả đo lường được, và đó là lý do mỗi năm ngày càng nhiều công ty chuyển ngân sách lên mạng.", "alts": ["Of these, targeted online advertising is the most effective because it combines precision with measurable results, which is why more companies shift their budgets online each year.", "Among them, targeted online advertising is the most effective since it offers both precision and measurable results, which explains why more businesses move their budgets online every year."]}], "no": 14, "type": "Two-part essay", "words": 326}, {"title": "Younger Leaders", "prompt": "Leaders and directors in organizations are normally older people. Some people think having a younger leader would be better. To what extent do you agree or disagree?", "paras": ["Senior positions in most organisations are held by older people, and some believe that a younger leader would perform better and bring fresh energy. I disagree, because the qualities that make a good leader depend more on experience and character than on youth.", "Supporters of younger leaders have a case. Younger managers tend to be comfortable with new technology and open to unconventional ideas. They may adopt digital tools faster and challenge outdated routines that older colleagues take for granted. They also understand the workforce and customers of the future. A leader in their thirties shares the habits and expectations of young employees and consumers. This helps in designing products and creating a workplace that attracts talent. Such insight can guide marketing and recruitment decisions in ways that older managers may find difficult to match. However, these strengths are not exclusive to the young, since many older executives adopt new tools and listen carefully to younger staff.", "In my view, experience remains the stronger qualification. A leader who has lived through economic downturns, failed projects and staff conflicts has learnt what works under pressure. Such judgement is vital when a company faces a crisis, because a wrong decision can cost thousands of jobs. Experience also provides a long view of how an industry has changed, which helps leaders avoid repeating old mistakes. A seasoned manager can also remain calm when others panic, which reassures employees. Older leaders bring established relationships as well. Investors, suppliers and government officials tend to trust someone with a long record, and a veteran can open doors that a newcomer cannot. Such trust can secure loans, contracts and partnerships that a young leader might struggle to win.", "In conclusion, younger leaders offer fresh ideas and a close understanding of new markets, but experience is harder to replace. Ideally, organisations should combine both, yet when choosing one, I would favour proven judgement over youth in the most senior roles."], "sents": [{"p": 0, "en": "Senior positions in most organisations are held by older people, and some believe that a younger leader would perform better and bring fresh energy.", "vi": "Các vị trí cấp cao ở hầu hết tổ chức đều do người lớn tuổi nắm giữ, và một số người cho rằng một nhà lãnh đạo trẻ hơn sẽ làm tốt hơn và mang lại nguồn năng lượng mới.", "alts": ["In most organisations, top roles are occupied by older people, and some think a younger leader would do a better job and bring new energy."]}, {"p": 0, "en": "I disagree, because the qualities that make a good leader depend more on experience and character than on youth.", "vi": "Tôi không đồng ý, vì những phẩm chất tạo nên một nhà lãnh đạo giỏi phụ thuộc vào kinh nghiệm và nhân cách nhiều hơn là tuổi trẻ.", "alts": ["I do not agree, as good leadership relies more on experience and character than on age.", "I do not agree, as the qualities of a good leader rely more on experience and character than on youth."]}, {"p": 1, "en": "Supporters of younger leaders have a case.", "vi": "Những người ủng hộ lãnh đạo trẻ cũng có lý lẽ của mình.", "alts": ["Supporters of younger leaders have a reasonable case.", "Advocates of younger leaders have a fair argument."]}, {"p": 1, "en": "Younger managers tend to be comfortable with new technology and open to unconventional ideas.", "vi": "Các nhà quản lý trẻ thường thoải mái với công nghệ mới và cởi mở với ý tưởng khác thường.", "alts": ["Younger managers are usually at ease with new technology and receptive to unconventional ideas."]}, {"p": 1, "en": "They may adopt digital tools faster and challenge outdated routines that older colleagues take for granted.", "vi": "Họ có thể áp dụng công cụ số nhanh hơn và thách thức những thói quen lỗi thời mà các đồng nghiệp lớn tuổi coi là hiển nhiên.", "alts": ["They may take up digital tools more quickly and question old-fashioned routines that older colleagues accept without a second thought."]}, {"p": 1, "en": "They also understand the workforce and customers of the future.", "vi": "Họ cũng hiểu lực lượng lao động và khách hàng của tương lai.", "alts": ["They also have a better grasp of tomorrow's workforce and customers."]}, {"p": 1, "en": "A leader in their thirties shares the habits and expectations of young employees and consumers.", "vi": "Một nhà lãnh đạo ở độ tuổi ba mươi có chung thói quen và kỳ vọng với nhân viên và người tiêu dùng trẻ.", "alts": ["A leader in their thirties has the same habits and expectations as young staff and customers."]}, {"p": 1, "en": "This helps in designing products and creating a workplace that attracts talent.", "vi": "Điều này giúp thiết kế sản phẩm và tạo ra môi trường làm việc thu hút nhân tài.", "alts": ["This is useful when designing products and building a workplace that draws in talent."]}, {"p": 1, "en": "Such insight can guide marketing and recruitment decisions in ways that older managers may find difficult to match.", "vi": "Sự thấu hiểu như vậy có thể định hướng các quyết định tiếp thị và tuyển dụng theo những cách mà các nhà quản lý lớn tuổi có thể khó sánh kịp.", "alts": ["This kind of understanding can shape marketing and hiring decisions in ways that older managers may struggle to match."]}, {"p": 1, "en": "However, these strengths are not exclusive to the young, since many older executives adopt new tools and listen carefully to younger staff.", "vi": "Tuy nhiên, những điểm mạnh này không phải chỉ người trẻ mới có, vì nhiều giám đốc lớn tuổi cũng áp dụng công cụ mới và lắng nghe kỹ nhân viên trẻ.", "alts": ["However, these strengths are not limited to the young, since many older executives adopt new tools and listen carefully to younger staff.", "Nevertheless, these strengths are not exclusive to young people, because many older executives use new tools and listen closely to their younger employees."]}, {"p": 2, "en": "In my view, experience remains the stronger qualification.", "vi": "Theo tôi, kinh nghiệm vẫn là yếu tố đáng giá hơn.", "alts": ["In my opinion, experience remains the stronger qualification.", "I believe experience is still the more important qualification."]}, {"p": 2, "en": "A leader who has lived through economic downturns, failed projects and staff conflicts has learnt what works under pressure.", "vi": "Một nhà lãnh đạo từng trải qua suy thoái kinh tế, những dự án thất bại và xung đột nhân sự đã học được điều gì hiệu quả khi chịu áp lực.", "alts": ["A leader who has experienced recessions, failed projects and disputes among staff knows what is effective under pressure."]}, {"p": 2, "en": "Such judgement is vital when a company faces a crisis, because a wrong decision can cost thousands of jobs.", "vi": "Sự phán đoán như vậy rất quan trọng khi công ty đối mặt khủng hoảng, vì một quyết định sai có thể khiến hàng nghìn người mất việc.", "alts": ["This kind of judgement is essential when a company is in crisis, since one wrong decision can cost thousands of jobs."]}, {"p": 2, "en": "Experience also provides a long view of how an industry has changed, which helps leaders avoid repeating old mistakes.", "vi": "Kinh nghiệm cũng cho một cái nhìn dài hạn về việc một ngành đã thay đổi ra sao, giúp nhà lãnh đạo tránh lặp lại những sai lầm cũ.", "alts": ["Experience also gives a long view of how an industry has changed, which helps leaders avoid repeating old mistakes.", "Experience also provides a long-term perspective on how an industry has developed, which helps leaders avoid repeating past mistakes."]}, {"p": 2, "en": "A seasoned manager can also remain calm when others panic, which reassures employees.", "vi": "Một nhà quản lý dày dạn còn có thể giữ bình tĩnh khi người khác hoảng loạn, điều này khiến nhân viên yên tâm.", "alts": ["An experienced manager can also stay calm when others panic, which gives staff confidence."]}, {"p": 2, "en": "Older leaders bring established relationships as well.", "vi": "Các nhà lãnh đạo lớn tuổi cũng mang theo những mối quan hệ đã gây dựng.", "alts": ["Older leaders also bring established relationships.", "Older leaders bring long-standing relationships as well."]}, {"p": 2, "en": "Investors, suppliers and government officials tend to trust someone with a long record, and a veteran can open doors that a newcomer cannot.", "vi": "Nhà đầu tư, nhà cung cấp và quan chức chính phủ thường tin tưởng người có bề dày thành tích, và một người kỳ cựu có thể mở những cánh cửa mà người mới không mở được.", "alts": ["Investors, suppliers and officials usually trust a person with a long track record, and a veteran can open doors that a newcomer cannot."]}, {"p": 2, "en": "Such trust can secure loans, contracts and partnerships that a young leader might struggle to win.", "vi": "Sự tin tưởng như vậy có thể đảm bảo những khoản vay, hợp đồng và quan hệ đối tác mà một nhà lãnh đạo trẻ có thể khó giành được.", "alts": ["This trust can win loans, contracts and partnerships that a young leader may find hard to obtain."]}, {"p": 3, "en": "In conclusion, younger leaders offer fresh ideas and a close understanding of new markets, but experience is harder to replace.", "vi": "Tóm lại, các nhà lãnh đạo trẻ mang đến ý tưởng mới và sự hiểu biết sát với thị trường mới, nhưng kinh nghiệm khó thay thế hơn.", "alts": ["To conclude, younger leaders bring new ideas and a good understanding of new markets, but experience is more difficult to replace."]}, {"p": 3, "en": "Ideally, organisations should combine both, yet when choosing one, I would favour proven judgement over youth in the most senior roles.", "vi": "Lý tưởng nhất, các tổ chức nên kết hợp cả hai, nhưng khi phải chọn một, tôi sẽ ưu tiên khả năng phán đoán đã được kiểm chứng hơn tuổi trẻ ở những vị trí cao nhất.", "alts": ["Ideally, organisations should combine both, yet if forced to choose, I would favour proven judgement over youth in the most senior roles.", "In an ideal world, organisations would combine both, but if I had to choose, I would prefer proven judgement to youth in the top positions.", "In an ideal world, organisations should combine both, but when choosing one, I would prefer proven judgement to youth in the top roles."]}], "no": 15, "type": "Agree or disagree", "words": 322}, {"title": "TV and Learning", "prompt": "Children can learn effectively by watching television, so they should be encouraged to watch TV both at home and at school. To what extent do you agree or disagree with this belief?", "paras": ["Some people believe that children learn effectively from television and should therefore be encouraged to watch it at school and at home. I disagree with this view, although well-chosen programmes can support learning.", "Supporters of television as a teaching tool have some good arguments. Educational programmes combine sound, images and movement, so a documentary on volcanoes or ocean life makes difficult ideas easy to picture. Children also often remember a vivid scene longer than a page of text. Subtitles also help young viewers connect spoken words with written ones more easily. Television can spark interest as well. A reluctant reader who is fascinated by a series about space may later pick up books on the subject. Programmes in foreign languages also expose pupils to natural pronunciation that a textbook cannot provide. Teachers who use short clips in lessons can also make the classroom livelier. However, these benefits depend on careful selection and limited viewing, which encouragement to watch freely does not guarantee.", "In my view, encouraging children to watch television does more harm than good. Viewing is largely passive. A child who sits in front of a screen rarely asks questions, solves problems or practises speaking. Conversation with a teacher or parent builds understanding and vocabulary far more effectively. Long hours of viewing also reduce time for play and exercise, which affects concentration and physical health. Content is the other concern. Much of what children see is entertainment rather than education. Commercial breaks also promote sugary foods and expensive toys, which shape their wishes in unhelpful ways. Young children also tend to copy behaviour they see on screen, including aggression. Even a good programme gives children no real way to check whether they have understood.", "In conclusion, television can illustrate ideas and awaken curiosity, but it cannot replace active learning through discussion and practice. Children should therefore watch only carefully chosen programmes, and in limited amounts, alongside plenty of reading and play."], "sents": [{"p": 0, "en": "Some people believe that children learn effectively from television and should therefore be encouraged to watch it at school and at home.", "vi": "Một số người tin rằng trẻ học hiệu quả từ ti vi nên cần được khuyến khích xem ở trường lẫn ở nhà.", "alts": ["Some people think that children learn well from TV and should therefore be encouraged to watch it both at school and at home."]}, {"p": 0, "en": "I disagree with this view, although well-chosen programmes can support learning.", "vi": "Tôi không đồng ý với quan điểm này, dù những chương trình được chọn lọc kỹ có thể hỗ trợ việc học.", "alts": ["I do not agree with this opinion, although carefully selected programmes can help children learn."]}, {"p": 1, "en": "Supporters of television as a teaching tool have some good arguments.", "vi": "Những người ủng hộ ti vi như một công cụ dạy học có một số lập luận tốt.", "alts": ["Advocates of television as a teaching tool make some sound points."]}, {"p": 1, "en": "Educational programmes combine sound, images and movement, so a documentary on volcanoes or ocean life makes difficult ideas easy to picture.", "vi": "Các chương trình giáo dục kết hợp âm thanh, hình ảnh và chuyển động, nên một bộ phim tài liệu về núi lửa hay đời sống đại dương giúp những ý tưởng khó trở nên dễ hình dung.", "alts": ["Educational programmes combine sound, images and movement, so a documentary on volcanoes or ocean life makes complex ideas easy to picture.", "Educational programmes bring together sound, images and movement, so a documentary about volcanoes or marine life makes difficult ideas easy to visualise."]}, {"p": 1, "en": "Children also often remember a vivid scene longer than a page of text.", "vi": "Trẻ cũng thường nhớ một cảnh sinh động lâu hơn một trang chữ.", "alts": ["Children also tend to remember a striking scene for longer than a page of writing.", "Children also frequently recall a vivid scene for longer than a page of writing."]}, {"p": 1, "en": "Subtitles also help young viewers connect spoken words with written ones more easily.", "vi": "Phụ đề cũng giúp người xem nhỏ tuổi dễ nối lời nói với chữ viết hơn.", "alts": ["Subtitles also make it easier for young viewers to link spoken words with written ones."]}, {"p": 1, "en": "Television can spark interest as well.", "vi": "Ti vi cũng có thể khơi dậy hứng thú.", "alts": ["Television can also spark interest.", "Television can arouse interest as well."]}, {"p": 1, "en": "A reluctant reader who is fascinated by a series about space may later pick up books on the subject.", "vi": "Một em vốn lười đọc nhưng mê một loạt phim về vũ trụ có thể sau đó sẽ tìm sách về chủ đề này.", "alts": ["A child who dislikes reading but is captivated by a series on space may later start reading books on the topic."]}, {"p": 1, "en": "Programmes in foreign languages also expose pupils to natural pronunciation that a textbook cannot provide.", "vi": "Các chương trình bằng tiếng nước ngoài cũng giúp học sinh tiếp xúc với cách phát âm tự nhiên mà sách giáo khoa không cung cấp được.", "alts": ["Foreign-language programmes also give pupils exposure to authentic pronunciation that textbooks cannot offer."]}, {"p": 1, "en": "Teachers who use short clips in lessons can also make the classroom livelier.", "vi": "Những giáo viên dùng các đoạn phim ngắn trong giờ học cũng có thể làm lớp học sinh động hơn.", "alts": ["Teachers who use brief clips in lessons can also make their classes more lively."]}, {"p": 1, "en": "However, these benefits depend on careful selection and limited viewing, which encouragement to watch freely does not guarantee.", "vi": "Tuy nhiên, những lợi ích này phụ thuộc vào việc chọn lọc cẩn thận và hạn chế thời gian xem, điều mà việc khuyến khích xem thoải mái không đảm bảo được.", "alts": ["Nevertheless, these advantages rely on careful choice and limited watching, which encouraging children to watch freely does not ensure."]}, {"p": 2, "en": "In my view, encouraging children to watch television does more harm than good.", "vi": "Theo tôi, khuyến khích trẻ xem ti vi hại nhiều hơn lợi.", "alts": ["In my opinion, encouraging children to watch television does more harm than good.", "I believe that encouraging children to watch TV does more damage than good."]}, {"p": 2, "en": "Viewing is largely passive.", "vi": "Việc xem phần lớn là thụ động.", "alts": ["Watching television is mostly a passive activity.", "Viewing is mostly passive.", "Watching is largely a passive activity."]}, {"p": 2, "en": "A child who sits in front of a screen rarely asks questions, solves problems or practises speaking.", "vi": "Một đứa trẻ ngồi trước màn hình hiếm khi đặt câu hỏi, giải quyết vấn đề hay luyện nói.", "alts": ["A child sitting in front of a screen seldom asks questions, solves problems or practises speaking."]}, {"p": 2, "en": "Conversation with a teacher or parent builds understanding and vocabulary far more effectively.", "vi": "Trò chuyện với giáo viên hoặc cha mẹ xây dựng sự hiểu biết và vốn từ hiệu quả hơn nhiều.", "alts": ["Talking with a teacher or parent develops understanding and vocabulary much more effectively."]}, {"p": 2, "en": "Long hours of viewing also reduce time for play and exercise, which affects concentration and physical health.", "vi": "Xem nhiều giờ cũng làm giảm thời gian vui chơi và vận động, ảnh hưởng đến sự tập trung và sức khỏe thể chất.", "alts": ["Spending long hours in front of a screen also cuts into time for play and exercise, which harms concentration and physical health."]}, {"p": 2, "en": "Content is the other concern.", "vi": "Nội dung là mối lo còn lại.", "alts": ["The second concern is content.", "Content is the second concern."]}, {"p": 2, "en": "Much of what children see is entertainment rather than education.", "vi": "Phần lớn những gì trẻ xem là giải trí chứ không phải giáo dục.", "alts": ["Much of what children watch is entertainment rather than education.", "A large proportion of what children see is entertainment instead of education."]}, {"p": 2, "en": "Commercial breaks also promote sugary foods and expensive toys, which shape their wishes in unhelpful ways.", "vi": "Các đoạn quảng cáo giữa chương trình cũng quảng bá đồ ăn nhiều đường và đồ chơi đắt tiền, định hình mong muốn của trẻ theo hướng không có lợi.", "alts": ["Adverts also promote sugary food and costly toys, which influence what children want in unhelpful ways."]}, {"p": 2, "en": "Young children also tend to copy behaviour they see on screen, including aggression.", "vi": "Trẻ nhỏ cũng có xu hướng bắt chước hành vi thấy trên màn hình, kể cả sự hung hăng.", "alts": ["Small children also tend to imitate behaviour they see on screen, such as aggression."]}, {"p": 2, "en": "Even a good programme gives children no real way to check whether they have understood.", "vi": "Ngay cả một chương trình hay cũng không cho trẻ cách nào thực sự để kiểm tra xem mình đã hiểu chưa.", "alts": ["Even a good programme offers children no proper way of checking whether they have understood."]}, {"p": 3, "en": "In conclusion, television can illustrate ideas and awaken curiosity, but it cannot replace active learning through discussion and practice.", "vi": "Tóm lại, ti vi có thể minh họa ý tưởng và khơi dậy sự tò mò, nhưng không thể thay thế việc học chủ động qua thảo luận và thực hành.", "alts": ["To conclude, television can explain ideas and stimulate curiosity, but it cannot take the place of active learning through discussion and practice."]}, {"p": 3, "en": "Children should therefore watch only carefully chosen programmes, and in limited amounts, alongside plenty of reading and play.", "vi": "Vì vậy, trẻ chỉ nên xem những chương trình được chọn lọc kỹ và với thời lượng hạn chế, bên cạnh thật nhiều thời gian đọc sách và vui chơi.", "alts": ["Children should therefore watch only carefully chosen programmes, in limited amounts, alongside plenty of reading and play.", "Children should thus watch only carefully selected programmes, in moderation, together with plenty of reading and play."]}], "no": 16, "type": "Agree or disagree", "words": 322}, {"title": "Wildlife", "prompt": "Human activities have negative effects on plant and animal species. Some people think it is too late to do anything about this problem. Others believe that effective measures can be taken to improve this situation. Discuss both views and give your opinion.", "paras": ["Human activities such as farming, hunting and pollution have driven many plants and animals towards extinction. Some people believe it is already too late to act, whereas others think effective measures are still possible, and I agree with the latter group.", "Pessimists point to the scale of the damage. Many species have already vanished, and extinction is permanent, so no amount of future effort can bring back a lost animal. Forests, wetlands and coral reefs are still being destroyed faster than they can recover. Climate change is also altering habitats so quickly that many creatures cannot adapt or move in time. Amphibians are already declining rapidly in many regions. Pessimists also doubt that governments will act. Economic growth and a rising population create constant demand for land and resources. Laws against poaching or illegal logging are also often poorly enforced in poor countries where officials lack funding. However, the existence of damage does not mean that the remaining species cannot be saved.", "In my view, practical measures have already shown results. Protected areas and strict laws can bring species back from the brink. Humpback whales, for example, have recovered in many oceans since commercial whaling was banned. National parks also give tigers and rhinos safe territory in which to breed. Public pressure and technology strengthen these efforts. Awareness campaigns encourage consumers to avoid products linked to deforestation or poaching. Satellites and drones now let rangers detect illegal logging and track animals across vast areas. Captive breeding programmes have returned endangered birds and mammals to the wild. Cooperation between countries is growing too, since migratory species cross borders and need shared protection. Such successes show that damage can be reversed when governments commit money and people change their habits.", "In conclusion, some losses cannot be reversed and enforcement remains weak in many places. Nevertheless, the progress achieved so far shows that determined action can still protect wildlife, so it is not too late."], "sents": [{"p": 0, "en": "Human activities such as farming, hunting and pollution have driven many plants and animals towards extinction.", "vi": "Các hoạt động của con người như canh tác, săn bắn và gây ô nhiễm đã đẩy nhiều loài thực vật và động vật đến bờ tuyệt chủng.", "alts": ["Human activities such as agriculture, hunting and pollution have driven many plants and animals towards extinction.", "Human activities like farming, hunting and pollution have pushed numerous plant and animal species towards extinction.", "Human activities like farming, hunting and pollution have driven numerous plants and animals to the brink of extinction."]}, {"p": 0, "en": "Some people believe it is already too late to act, whereas others think effective measures are still possible, and I agree with the latter group.", "vi": "Một số người tin rằng đã quá muộn để hành động, trong khi những người khác cho rằng các biện pháp hiệu quả vẫn còn khả thi, và tôi đồng ý với nhóm sau.", "alts": ["Some people believe it is already too late to act, while others think effective measures are still possible, and I agree with the second group.", "Some people think it is too late to take action, whereas others believe effective measures can still be taken, and I side with the latter."]}, {"p": 1, "en": "Pessimists point to the scale of the damage.", "vi": "Những người bi quan chỉ ra quy mô của sự tàn phá.", "alts": ["Pessimists point to the extent of the damage.", "Pessimists highlight the scale of the harm."]}, {"p": 1, "en": "Many species have already vanished, and extinction is permanent, so no amount of future effort can bring back a lost animal.", "vi": "Nhiều loài đã biến mất, mà tuyệt chủng là vĩnh viễn, nên không nỗ lực nào trong tương lai có thể mang một loài đã mất trở lại.", "alts": ["Many species have already disappeared, and extinction is permanent, so no amount of future effort can bring back a lost animal.", "Many species have already vanished, and extinction is irreversible, so no future effort can restore an animal that has been lost."]}, {"p": 1, "en": "Forests, wetlands and coral reefs are still being destroyed faster than they can recover.", "vi": "Rừng, đất ngập nước và rạn san hô vẫn đang bị phá hủy nhanh hơn tốc độ chúng phục hồi.", "alts": ["Forests, wetlands and coral reefs continue to be destroyed more quickly than they can regenerate."]}, {"p": 1, "en": "Climate change is also altering habitats so quickly that many creatures cannot adapt or move in time.", "vi": "Biến đổi khí hậu cũng đang làm thay đổi môi trường sống nhanh đến mức nhiều sinh vật không kịp thích nghi hay di chuyển.", "alts": ["Climate change is also transforming habitats so fast that many animals are unable to adjust or relocate in time.", "Climate change is also changing habitats so rapidly that many creatures cannot adapt or relocate in time."]}, {"p": 1, "en": "Amphibians are already declining rapidly in many regions.", "vi": "Số lượng các loài lưỡng cư đã giảm nhanh ở nhiều khu vực.", "alts": ["Amphibian populations are already falling fast in many parts of the world.", "Amphibian populations are already falling rapidly in many areas."]}, {"p": 1, "en": "Pessimists also doubt that governments will act.", "vi": "Những người bi quan cũng nghi ngờ việc chính phủ sẽ hành động.", "alts": ["Pessimists also question whether governments will take action.", "Pessimists also doubt that governments will take action."]}, {"p": 1, "en": "Economic growth and a rising population create constant demand for land and resources.", "vi": "Tăng trưởng kinh tế và dân số gia tăng tạo nhu cầu liên tục về đất đai và tài nguyên.", "alts": ["Economic growth and population increase create continuous demand for land and resources."]}, {"p": 1, "en": "Laws against poaching or illegal logging are also often poorly enforced in poor countries where officials lack funding.", "vi": "Các luật chống săn trộm hay khai thác gỗ trái phép cũng thường được thực thi kém ở những nước nghèo, nơi các quan chức thiếu kinh phí.", "alts": ["Laws against poaching or illegal logging are also frequently weakly enforced in poorer countries where officials are short of funds.", "Laws against poaching or illegal logging are also frequently weakly enforced in poorer countries where officials do not have enough funding."]}, {"p": 1, "en": "However, the existence of damage does not mean that the remaining species cannot be saved.", "vi": "Tuy nhiên, việc đã có tổn hại không có nghĩa là những loài còn lại không thể cứu được.", "alts": ["Nevertheless, the fact that harm has been done does not mean the surviving species cannot be rescued.", "Nevertheless, the existence of harm does not mean that the surviving species cannot be rescued."]}, {"p": 2, "en": "In my view, practical measures have already shown results.", "vi": "Theo tôi, các biện pháp thực tế đã cho thấy kết quả.", "alts": ["In my opinion, practical measures have already shown results.", "I believe that practical steps have already produced results."]}, {"p": 2, "en": "Protected areas and strict laws can bring species back from the brink.", "vi": "Các khu bảo tồn và luật nghiêm ngặt có thể kéo các loài trở lại từ bờ vực tuyệt chủng.", "alts": ["Protected zones and tough legislation can rescue species from the edge of extinction.", "Protected areas and strict laws can bring species back from the edge of extinction.", "Protected zones and tough laws can rescue species from the brink."]}, {"p": 2, "en": "Humpback whales, for example, have recovered in many oceans since commercial whaling was banned.", "vi": "Chẳng hạn, cá voi lưng gù đã hồi phục ở nhiều đại dương kể từ khi lệnh cấm săn bắt cá voi thương mại được ban hành.", "alts": ["Humpback whales, for instance, have made a recovery in many oceans since commercial whaling was prohibited."]}, {"p": 2, "en": "National parks also give tigers and rhinos safe territory in which to breed.", "vi": "Các vườn quốc gia cũng cho hổ và tê giác vùng lãnh thổ an toàn để sinh sản.", "alts": ["National parks also provide tigers and rhinos with safe areas where they can breed."]}, {"p": 2, "en": "Public pressure and technology strengthen these efforts.", "vi": "Áp lực từ công chúng và công nghệ củng cố những nỗ lực này.", "alts": ["Public pressure and technology reinforce these efforts."]}, {"p": 2, "en": "Awareness campaigns encourage consumers to avoid products linked to deforestation or poaching.", "vi": "Các chiến dịch nâng cao nhận thức khuyến khích người tiêu dùng tránh những sản phẩm liên quan đến nạn phá rừng hay săn trộm.", "alts": ["Awareness campaigns persuade consumers to avoid products connected to deforestation or poaching."]}, {"p": 2, "en": "Satellites and drones now let rangers detect illegal logging and track animals across vast areas.", "vi": "Vệ tinh và máy bay không người lái giờ giúp kiểm lâm phát hiện khai thác gỗ trái phép và theo dõi động vật trên những vùng rộng lớn.", "alts": ["Satellites and drones now enable rangers to spot illegal logging and follow animals over huge areas."]}, {"p": 2, "en": "Captive breeding programmes have returned endangered birds and mammals to the wild.", "vi": "Các chương trình nhân giống trong điều kiện nuôi nhốt đã đưa nhiều loài chim và thú nguy cấp trở lại tự nhiên.", "alts": ["Captive breeding programmes have released endangered birds and mammals back into the wild."]}, {"p": 2, "en": "Cooperation between countries is growing too, since migratory species cross borders and need shared protection.", "vi": "Sự hợp tác giữa các quốc gia cũng đang tăng lên, vì các loài di cư băng qua biên giới và cần được bảo vệ chung.", "alts": ["International cooperation is also increasing, because migratory species cross borders and require joint protection."]}, {"p": 2, "en": "Such successes show that damage can be reversed when governments commit money and people change their habits.", "vi": "Những thành công như vậy cho thấy tổn hại có thể được đảo ngược khi chính phủ cam kết đầu tư và con người thay đổi thói quen.", "alts": ["These successes show that harm can be undone when governments provide funding and people change their habits."]}, {"p": 3, "en": "In conclusion, some losses cannot be reversed and enforcement remains weak in many places.", "vi": "Tóm lại, một số mất mát không thể đảo ngược và việc thực thi vẫn còn yếu ở nhiều nơi.", "alts": ["To conclude, some losses are permanent and enforcement is still weak in many areas."]}, {"p": 3, "en": "Nevertheless, the progress achieved so far shows that determined action can still protect wildlife, so it is not too late.", "vi": "Tuy nhiên, tiến bộ đạt được cho đến nay cho thấy hành động quyết tâm vẫn có thể bảo vệ động vật hoang dã, nên chưa quá muộn.", "alts": ["Even so, the progress made to date shows that committed action can still protect wildlife, so it is not too late."]}], "no": 17, "type": "Discuss both views", "words": 322}, {"title": "Youth Sports", "prompt": "Some people believe that sports competitions are a source of emotional stress for young people. Therefore, youth should be banned from participating in sports competitions. Do you agree or disagree?", "paras": ["Competitions are a regular part of school and youth sport, but some people believe they cause emotional stress and should be banned for young people. I disagree with a ban, because the benefits of competing outweigh the risks if it is properly supervised.", "Those who support a ban raise understandable concerns. Young athletes can feel enormous pressure to win, especially when parents and coaches focus on results. A child who loses an important match may feel ashamed and fearful of failing again. Younger children, who do not yet understand that defeat is temporary, are affected most. Intense training schedules can also leave children exhausted and unable to enjoy the game. Comparison with teammates is another source of stress. Selection for a team means that some children are chosen while others are left out. Being rejected at an early age can damage confidence and friendships. However, these problems come from how competitions are run, not from competition itself, and they can be reduced with sensible guidance.", "In my view, healthy competition teaches lessons that cannot easily be learnt elsewhere. Facing defeat helps children build resilience. A child who loses a race and practises harder next time learns that effort brings improvement and that failure is not the end. This attitude serves them in exams and later in work. Sport also develops teamwork and discipline. Members of a team learn to cooperate, follow rules and respect opponents, and regular training keeps children active at a time when many spend hours on screens. Schools can offer a range of events, so that children who dislike one sport can succeed in another. Training coaches to value effort over results would also protect players from unnecessary stress. Banning competitions would remove these benefits altogether.", "In conclusion, competitions can cause anxiety when adults put too much emphasis on winning. A ban is not the answer, since well-guided competition builds resilience, teamwork and healthy habits that last into adult life."], "sents": [{"p": 0, "en": "Competitions are a regular part of school and youth sport, but some people believe they cause emotional stress and should be banned for young people.", "vi": "Các cuộc thi đấu là một phần thường xuyên của thể thao học đường và thể thao trẻ, nhưng một số người cho rằng chúng gây căng thẳng tinh thần và nên bị cấm đối với người trẻ.", "alts": ["Competitions are a regular part of school and youth sport, but some people think they cause emotional stress and should be banned for young people.", "Competitions are a normal feature of school and youth sport, but some people believe they cause emotional stress and should be prohibited for the young."]}, {"p": 0, "en": "I disagree with a ban, because the benefits of competing outweigh the risks if it is properly supervised.", "vi": "Tôi không đồng ý với việc cấm, vì lợi ích của thi đấu lớn hơn rủi ro nếu được giám sát đúng cách.", "alts": ["I am against a ban, as the benefits of competition outweigh the risks when it is well supervised."]}, {"p": 1, "en": "Those who support a ban raise understandable concerns.", "vi": "Những người ủng hộ lệnh cấm nêu ra những lo ngại dễ hiểu.", "alts": ["Supporters of a ban voice concerns that are easy to understand."]}, {"p": 1, "en": "Young athletes can feel enormous pressure to win, especially when parents and coaches focus on results.", "vi": "Các vận động viên trẻ có thể cảm thấy áp lực khổng lồ phải thắng, nhất là khi cha mẹ và huấn luyện viên chỉ chú trọng kết quả.", "alts": ["Young sportspeople can feel huge pressure to win, particularly when their parents and coaches concentrate on results."]}, {"p": 1, "en": "A child who loses an important match may feel ashamed and fearful of failing again.", "vi": "Một đứa trẻ thua một trận quan trọng có thể thấy xấu hổ và sợ thất bại thêm lần nữa.", "alts": ["A child who loses an important match may feel ashamed and afraid of failing again.", "A child who loses a big match may feel embarrassed and fearful of failing again."]}, {"p": 1, "en": "Younger children, who do not yet understand that defeat is temporary, are affected most.", "vi": "Trẻ nhỏ hơn, chưa hiểu rằng thất bại chỉ là tạm thời, bị ảnh hưởng nhiều nhất.", "alts": ["Small children, who do not yet realise that defeat is only temporary, are affected the most."]}, {"p": 1, "en": "Intense training schedules can also leave children exhausted and unable to enjoy the game.", "vi": "Lịch tập luyện dày đặc cũng có thể khiến trẻ kiệt sức và không còn thấy vui với môn thể thao.", "alts": ["Demanding training schedules can also leave children worn out and unable to enjoy the sport."]}, {"p": 1, "en": "Comparison with teammates is another source of stress.", "vi": "So sánh với đồng đội là một nguồn căng thẳng khác.", "alts": ["Being compared with teammates is another cause of stress."]}, {"p": 1, "en": "Selection for a team means that some children are chosen while others are left out.", "vi": "Việc tuyển chọn vào đội đồng nghĩa với việc có em được chọn còn có em bị loại.", "alts": ["Team selection means that some children are picked while others are excluded."]}, {"p": 1, "en": "Being rejected at an early age can damage confidence and friendships.", "vi": "Bị từ chối từ khi còn nhỏ có thể làm tổn hại sự tự tin và tình bạn.", "alts": ["Being rejected at a young age can damage confidence and friendships.", "Rejection at an early age can harm confidence and friendships."]}, {"p": 1, "en": "However, these problems come from how competitions are run, not from competition itself, and they can be reduced with sensible guidance.", "vi": "Tuy nhiên, những vấn đề này đến từ cách tổ chức các cuộc thi chứ không phải từ bản thân sự cạnh tranh, và chúng có thể giảm bớt nhờ sự hướng dẫn hợp lý.", "alts": ["Nevertheless, these problems stem from the way competitions are organised, not from competition itself, and they can be reduced with sensible guidance."]}, {"p": 2, "en": "In my view, healthy competition teaches lessons that cannot easily be learnt elsewhere.", "vi": "Theo tôi, cạnh tranh lành mạnh dạy những bài học không dễ học được ở nơi khác.", "alts": ["In my opinion, healthy competition teaches lessons that cannot easily be learned elsewhere.", "I believe healthy competition teaches lessons that are hard to learn anywhere else."]}, {"p": 2, "en": "Facing defeat helps children build resilience.", "vi": "Đối mặt với thất bại giúp trẻ xây dựng sự bền bỉ.", "alts": ["Dealing with defeat helps children develop resilience.", "Facing defeat helps children develop resilience."]}, {"p": 2, "en": "A child who loses a race and practises harder next time learns that effort brings improvement and that failure is not the end.", "vi": "Một đứa trẻ thua cuộc đua rồi luyện tập chăm chỉ hơn vào lần sau sẽ học được rằng nỗ lực mang lại tiến bộ và thất bại không phải là dấu chấm hết.", "alts": ["A child who loses a race and trains harder the next time learns that effort leads to progress and that failing is not the end."]}, {"p": 2, "en": "This attitude serves them in exams and later in work.", "vi": "Thái độ này giúp ích cho các em trong thi cử và sau này trong công việc.", "alts": ["This attitude serves them well in exams and later at work.", "This attitude benefits them in exams and later in their careers."]}, {"p": 2, "en": "Sport also develops teamwork and discipline.", "vi": "Thể thao cũng phát triển tinh thần đồng đội và kỷ luật.", "alts": ["Sport also builds teamwork and discipline.", "Sport also develops teamwork and self-discipline."]}, {"p": 2, "en": "Members of a team learn to cooperate, follow rules and respect opponents, and regular training keeps children active at a time when many spend hours on screens.", "vi": "Các thành viên trong đội học cách hợp tác, tuân thủ luật chơi và tôn trọng đối thủ, và việc tập luyện đều đặn giúp trẻ vận động vào thời điểm nhiều em dành hàng giờ trước màn hình.", "alts": ["Team members learn to work together, obey rules and respect their opponents, and regular training keeps children active when many spend hours in front of screens."]}, {"p": 2, "en": "Schools can offer a range of events, so that children who dislike one sport can succeed in another.", "vi": "Nhà trường có thể tổ chức nhiều loại sự kiện, để những em không thích một môn thể thao vẫn có thể thành công ở môn khác.", "alts": ["Schools can offer a variety of events, so that children who dislike one sport can succeed in another.", "Schools can provide a range of activities, so children who dislike one sport can do well in another."]}, {"p": 2, "en": "Training coaches to value effort over results would also protect players from unnecessary stress.", "vi": "Việc hướng dẫn huấn luyện viên coi trọng nỗ lực hơn kết quả cũng sẽ bảo vệ các em khỏi căng thẳng không đáng có.", "alts": ["Teaching coaches to prize effort above results would also shield players from needless stress."]}, {"p": 2, "en": "Banning competitions would remove these benefits altogether.", "vi": "Cấm các cuộc thi sẽ xóa bỏ hoàn toàn những lợi ích này.", "alts": ["Banning competitions would remove these benefits entirely.", "A ban on competitions would take away all of these benefits."]}, {"p": 3, "en": "In conclusion, competitions can cause anxiety when adults put too much emphasis on winning.", "vi": "Tóm lại, các cuộc thi có thể gây lo âu khi người lớn quá đặt nặng chuyện thắng thua.", "alts": ["To conclude, competitions can lead to anxiety when adults place too much importance on winning."]}, {"p": 3, "en": "A ban is not the answer, since well-guided competition builds resilience, teamwork and healthy habits that last into adult life.", "vi": "Cấm đoán không phải là câu trả lời, vì thi đấu được hướng dẫn tốt xây dựng sự bền bỉ, tinh thần đồng đội và những thói quen lành mạnh kéo dài đến tuổi trưởng thành.", "alts": ["A ban is not the solution, since well-guided competition builds resilience, teamwork and healthy habits that last into adulthood.", "A ban is not the answer, because well-guided competition develops resilience, teamwork and healthy habits that continue into adult life."]}], "no": 18, "type": "Agree or disagree", "words": 323}, {"title": "Libraries", "prompt": "Some people think that libraries are a waste of resources and money so computers should replace them. However, others do not agree. Discuss both sides and give your opinion.", "paras": ["As digital technology spreads, some people see libraries as a waste of public money that computers could replace. I disagree, because libraries serve important needs that screens alone cannot meet in practice.", "Those who favour computers have practical arguments. The internet gives instant access to far more information than any building can hold. A student can search millions of articles and e-books from home in seconds, without travelling or waiting for a title to be returned. Searchable text also helps readers locate a single fact quickly. Printed books can quickly become outdated, whereas online sources can be updated immediately, and digital archives rarely run out of copies. Running costs matter too. A large library needs a building, heating, security and staff. City councils with limited budgets could spend that money on schools or hospitals, while digital collections need only servers and licences. However, access to information is not the same as access to reliable information or to the internet itself.", "In my view, libraries remain valuable. They offer equal access to everyone. Many families cannot afford a computer, a fast connection or expensive textbooks. A public library lets these children and adults read, research and apply for jobs free of charge. Elderly residents, for instance, often use libraries to learn basic digital skills with patient, face-to-face help. Libraries also provide guidance and a shared community space. Librarians help visitors find trustworthy sources among the mass of unreliable online content. Quiet study areas, reading groups and story sessions also bring neighbours together and encourage young children to enjoy books. Many users also value somewhere calm to concentrate, away from the distractions of a phone or a crowded home. A home computer cannot offer this kind of calm and focused environment.", "In conclusion, computers offer speed and convenience, and they reduce costs for local governments. Nevertheless, libraries guarantee equal access and trustworthy guidance to every citizen, so they deserve continued and generous public funding."], "sents": [{"p": 0, "en": "As digital technology spreads, some people see libraries as a waste of public money that computers could replace.", "vi": "Khi công nghệ số lan rộng, một số người coi thư viện là sự lãng phí tiền công mà máy tính có thể thay thế.", "alts": ["As digital technology spreads, some people regard libraries as a waste of public money that computers could replace.", "With the spread of digital technology, some people view libraries as a waste of taxpayers' money that computers could replace."]}, {"p": 0, "en": "I disagree, because libraries serve important needs that screens alone cannot meet in practice.", "vi": "Tôi không đồng ý, vì thư viện đáp ứng những nhu cầu quan trọng mà chỉ riêng màn hình không đáp ứng được trên thực tế.", "alts": ["I do not agree, as libraries meet important needs that screens alone cannot fulfil in reality."]}, {"p": 1, "en": "Those who favour computers have practical arguments.", "vi": "Những người ủng hộ máy tính có những lập luận thực tế.", "alts": ["Supporters of computers have practical points."]}, {"p": 1, "en": "The internet gives instant access to far more information than any building can hold.", "vi": "Internet cho phép truy cập tức thì vào lượng thông tin nhiều hơn bất kỳ tòa nhà nào có thể chứa.", "alts": ["The internet offers instant access to far more information than any building can hold.", "The internet provides immediate access to much more information than any building can contain."]}, {"p": 1, "en": "A student can search millions of articles and e-books from home in seconds, without travelling or waiting for a title to be returned.", "vi": "Một sinh viên có thể tìm trong hàng triệu bài báo và sách điện tử ngay tại nhà chỉ trong vài giây, không cần đi lại hay chờ ai đó trả sách.", "alts": ["A student can search millions of articles and e-books from home in seconds, without travelling or waiting for a book to be returned.", "A student can look through millions of articles and e-books at home within seconds, without having to travel or wait for a title to come back."]}, {"p": 1, "en": "Searchable text also helps readers locate a single fact quickly.", "vi": "Văn bản có thể tìm kiếm cũng giúp người đọc nhanh chóng tìm ra một thông tin cụ thể.", "alts": ["Searchable text also helps readers find a single fact quickly.", "Searchable text also lets readers locate one fact fast."]}, {"p": 1, "en": "Printed books can quickly become outdated, whereas online sources can be updated immediately, and digital archives rarely run out of copies.", "vi": "Sách in có thể nhanh chóng lỗi thời, trong khi các nguồn trực tuyến có thể được cập nhật ngay lập tức, và kho lưu trữ số hiếm khi hết bản.", "alts": ["Printed books can quickly become outdated, whereas online sources can be updated straight away, and digital archives rarely run out of copies.", "Printed books can soon become out of date, while online sources can be updated immediately, and digital archives hardly ever run out of copies."]}, {"p": 1, "en": "Running costs matter too.", "vi": "Chi phí vận hành cũng quan trọng.", "alts": ["Running costs also matter.", "Operating costs are also important."]}, {"p": 1, "en": "A large library needs a building, heating, security and staff.", "vi": "Một thư viện lớn cần tòa nhà, hệ thống sưởi, an ninh và nhân viên.", "alts": ["A big library requires a building, heating, security and employees."]}, {"p": 1, "en": "City councils with limited budgets could spend that money on schools or hospitals, while digital collections need only servers and licences.", "vi": "Các hội đồng thành phố có ngân sách hạn chế có thể dùng số tiền đó cho trường học hay bệnh viện, trong khi bộ sưu tập số chỉ cần máy chủ và bản quyền sử dụng.", "alts": ["City councils with tight budgets could use that money for schools or hospitals, whereas digital collections need only servers and licences."]}, {"p": 1, "en": "However, access to information is not the same as access to reliable information or to the internet itself.", "vi": "Tuy nhiên, được tiếp cận thông tin không đồng nghĩa với được tiếp cận thông tin đáng tin cậy, hay có kết nối internet để dùng.", "alts": ["Nevertheless, having access to information is different from having access to trustworthy information or to the internet itself."]}, {"p": 2, "en": "In my view, libraries remain valuable.", "vi": "Theo tôi, thư viện vẫn có giá trị.", "alts": ["In my opinion, libraries remain valuable.", "I believe libraries are still valuable."]}, {"p": 2, "en": "They offer equal access to everyone.", "vi": "Thư viện mang lại cơ hội tiếp cận công bằng cho mọi người.", "alts": ["They offer everyone equal access.", "They give equal access to all."]}, {"p": 2, "en": "Many families cannot afford a computer, a fast connection or expensive textbooks.", "vi": "Nhiều gia đình không đủ tiền mua máy tính, đường truyền nhanh hay sách giáo khoa đắt đỏ.", "alts": ["Many households cannot pay for a computer, a fast connection or costly textbooks."]}, {"p": 2, "en": "A public library lets these children and adults read, research and apply for jobs free of charge.", "vi": "Thư viện công cộng cho phép những trẻ em và người lớn này đọc, nghiên cứu và nộp đơn xin việc miễn phí.", "alts": ["A public library allows these children and adults to read, research and apply for jobs free of charge.", "A public library enables these children and adults to read, do research and apply for jobs at no cost."]}, {"p": 2, "en": "Elderly residents, for instance, often use libraries to learn basic digital skills with patient, face-to-face help.", "vi": "Chẳng hạn, cư dân lớn tuổi thường đến thư viện để học các kỹ năng số cơ bản với sự giúp đỡ trực tiếp, kiên nhẫn.", "alts": ["Elderly residents, for example, often use libraries to learn basic digital skills with patient, face-to-face help.", "Older residents, for instance, frequently go to libraries to learn basic digital skills with patient, face-to-face support."]}, {"p": 2, "en": "Libraries also provide guidance and a shared community space.", "vi": "Thư viện còn cung cấp sự hướng dẫn và một không gian cộng đồng chung.", "alts": ["Libraries also offer guidance and a shared community space.", "Libraries also provide guidance and a communal space."]}, {"p": 2, "en": "Librarians help visitors find trustworthy sources among the mass of unreliable online content.", "vi": "Thủ thư giúp người đến thư viện tìm các nguồn đáng tin giữa biển nội dung trực tuyến thiếu tin cậy.", "alts": ["Librarians help visitors find reliable sources among the mass of untrustworthy online content.", "Librarians help users find trustworthy sources among the large amount of unreliable online material."]}, {"p": 2, "en": "Quiet study areas, reading groups and story sessions also bring neighbours together and encourage young children to enjoy books.", "vi": "Những khu học yên tĩnh, nhóm đọc sách cùng các buổi kể chuyện cũng gắn kết hàng xóm với nhau và khuyến khích trẻ nhỏ yêu sách.", "alts": ["Quiet study spaces, book clubs and storytelling sessions also bring neighbours together and encourage young children to like books."]}, {"p": 2, "en": "Many users also value somewhere calm to concentrate, away from the distractions of a phone or a crowded home.", "vi": "Nhiều người dùng cũng trân trọng một nơi yên tĩnh để tập trung, tránh xa sự xao nhãng của điện thoại hay một ngôi nhà ồn ào.", "alts": ["Many users also value somewhere calm to concentrate, away from the distractions of a phone or a busy home.", "Many users also appreciate a peaceful place to focus, away from the distractions of a phone or a crowded home."]}, {"p": 2, "en": "A home computer cannot offer this kind of calm and focused environment.", "vi": "Máy tính ở nhà không thể mang lại một môi trường yên tĩnh và tập trung như vậy.", "alts": ["A home computer cannot provide this kind of calm and focused environment.", "A computer at home cannot offer this sort of quiet and focused setting."]}, {"p": 3, "en": "In conclusion, computers offer speed and convenience, and they reduce costs for local governments.", "vi": "Tóm lại, máy tính mang lại tốc độ và sự tiện lợi, và giúp chính quyền địa phương giảm chi phí.", "alts": ["In conclusion, computers offer speed and convenience, and they cut costs for local governments.", "To conclude, computers provide speed and convenience, and they reduce expenses for local authorities."]}, {"p": 3, "en": "Nevertheless, libraries guarantee equal access and trustworthy guidance to every citizen, so they deserve continued and generous public funding.", "vi": "Tuy nhiên, thư viện đảm bảo cơ hội tiếp cận công bằng và sự hướng dẫn đáng tin cậy cho mọi công dân, nên xứng đáng được tiếp tục tài trợ công một cách hào phóng.", "alts": ["Nevertheless, libraries guarantee equal access and reliable guidance to every citizen, so they deserve continued and generous public funding.", "Even so, libraries ensure equal access and trustworthy guidance for every citizen, so they deserve ongoing and generous public funding."]}], "no": 19, "type": "Discuss both views", "words": 322}, {"title": "Science Funding", "prompt": "Some people think the government should invest more money in teaching science than other subjects in order for a country to develop and progress. To what extent do you agree or disagree?", "paras": ["Some people argue that governments should spend more on science than on other subjects so that their countries can develop. I disagree with giving science priority over everything else, since a nation needs balanced education to progress.", "Supporters of this view have strong evidence. Science and technology drive economic growth. Discoveries in medicine, engineering and information technology create new industries and jobs. Countries such as South Korea invested heavily in science and engineering education and became leaders in electronics. Medical research, for instance, allows a country to respond quickly when a new disease appears. Engineers who design reliable power and transport networks also make every other industry more productive. Strong research universities also attract foreign investment and talented students. Scientific research improves daily life as well. Vaccines, clean energy and better crops depend on laboratories and trained researchers. Without public money, private companies seldom pay for long-term research that offers no immediate profit. However, scientific progress also depends on skills that science lessons do not teach.", "In my view, a country needs the full range of subjects. The humanities and arts develop skills that innovation depends on. Literature, history and philosophy teach students to think critically, communicate clearly and judge the ethics of new technology, which matters in areas such as artificial intelligence and genetic research. Creativity from art and design also helps scientists present ideas and solve problems in original ways. Society also needs many professionals who are not scientists. Teachers, lawyers, nurses and managers keep schools, courts and hospitals running. Students differ in talent, so forcing everyone towards science wastes ability and leaves essential jobs unfilled. Teachers in particular train the scientists of the future. A country with brilliant laboratories but few skilled teachers would soon find its research weakening.", "In conclusion, science deserves generous funding because it drives growth and improves health. Even so, a country progresses best when it also invests in the humanities, the arts and professional training."], "sents": [{"p": 0, "en": "Some people argue that governments should spend more on science than on other subjects so that their countries can develop.", "vi": "Một số người cho rằng chính phủ nên chi nhiều cho khoa học hơn các môn khác để đất nước có thể phát triển.", "alts": ["Some people argue that governments should spend more on science than on other subjects so that their countries can progress.", "Some people claim that governments ought to spend more money on science than on other subjects in order for their countries to develop."]}, {"p": 0, "en": "I disagree with giving science priority over everything else, since a nation needs balanced education to progress.", "vi": "Tôi không đồng ý với việc ưu tiên khoa học hơn mọi thứ khác, vì một quốc gia cần nền giáo dục cân bằng để tiến bộ.", "alts": ["I disagree with putting science before everything else, since a nation needs a balanced education to progress.", "I do not agree with giving science priority over all else, as a country needs a well-rounded education to advance."]}, {"p": 1, "en": "Supporters of this view have strong evidence.", "vi": "Những người ủng hộ quan điểm này có bằng chứng thuyết phục.", "alts": ["Advocates of this view have strong evidence."]}, {"p": 1, "en": "Science and technology drive economic growth.", "vi": "Khoa học và công nghệ thúc đẩy tăng trưởng kinh tế.", "alts": ["Science and technology fuel economic growth."]}, {"p": 1, "en": "Discoveries in medicine, engineering and information technology create new industries and jobs.", "vi": "Những khám phá trong y học, kỹ thuật và công nghệ thông tin tạo ra các ngành mới và việc làm mới.", "alts": ["Discoveries in medicine, engineering and information technology create new industries and employment.", "Breakthroughs in medicine, engineering and information technology create new industries and jobs."]}, {"p": 1, "en": "Countries such as South Korea invested heavily in science and engineering education and became leaders in electronics.", "vi": "Những nước như Hàn Quốc đã đầu tư mạnh vào giáo dục khoa học và kỹ thuật để trở thành quốc gia dẫn đầu về điện tử.", "alts": ["Countries like South Korea put large sums into science and engineering education and became leaders in electronics."]}, {"p": 1, "en": "Medical research, for instance, allows a country to respond quickly when a new disease appears.", "vi": "Chẳng hạn, nghiên cứu y học cho phép một quốc gia ứng phó nhanh khi một căn bệnh mới xuất hiện.", "alts": ["Medical research, for example, enables a country to respond quickly when a new disease emerges.", "Medical research, for instance, allows a nation to react fast when a new disease appears."]}, {"p": 1, "en": "Engineers who design reliable power and transport networks also make every other industry more productive.", "vi": "Các kỹ sư thiết kế mạng lưới điện và giao thông đáng tin cậy cũng giúp mọi ngành khác làm việc hiệu quả hơn.", "alts": ["Engineers who build dependable power and transport networks also make all other industries more productive."]}, {"p": 1, "en": "Strong research universities also attract foreign investment and talented students.", "vi": "Các trường đại học nghiên cứu mạnh cũng thu hút đầu tư nước ngoài và sinh viên tài năng.", "alts": ["Leading research universities also draw in foreign investment and gifted students."]}, {"p": 1, "en": "Scientific research improves daily life as well.", "vi": "Nghiên cứu khoa học cũng cải thiện cuộc sống hằng ngày.", "alts": ["Scientific research also improves everyday life.", "Scientific research makes daily life better as well."]}, {"p": 1, "en": "Vaccines, clean energy and better crops depend on laboratories and trained researchers.", "vi": "Vắc xin, năng lượng sạch và giống cây trồng tốt hơn đều dựa vào phòng thí nghiệm và các nhà nghiên cứu được đào tạo.", "alts": ["Vaccines, clean energy and better crops rely on laboratories and trained researchers.", "Vaccines, clean energy and improved crops depend on laboratories and skilled researchers."]}, {"p": 1, "en": "Without public money, private companies seldom pay for long-term research that offers no immediate profit.", "vi": "Nếu không có ngân sách nhà nước, các công ty tư nhân hiếm khi chi trả cho nghiên cứu dài hạn không mang lại lợi nhuận ngay.", "alts": ["Without public funding, private companies seldom pay for long-term research that offers no immediate profit.", "Without public money, private firms rarely finance long-term research that brings no immediate profit."]}, {"p": 1, "en": "However, scientific progress also depends on skills that science lessons do not teach.", "vi": "Tuy nhiên, tiến bộ khoa học cũng phụ thuộc vào những kỹ năng mà các giờ học khoa học không dạy.", "alts": ["Nevertheless, scientific progress also relies on skills that science classes do not teach."]}, {"p": 2, "en": "In my view, a country needs the full range of subjects.", "vi": "Theo tôi, một quốc gia cần đầy đủ các môn học.", "alts": ["In my opinion, a country needs the full range of subjects.", "I believe a nation needs the whole range of subjects."]}, {"p": 2, "en": "The humanities and arts develop skills that innovation depends on.", "vi": "Khoa học nhân văn và nghệ thuật phát triển những kỹ năng mà sự đổi mới dựa vào.", "alts": ["The humanities and the arts develop skills that innovation relies on.", "The humanities and arts build skills that innovation depends upon."]}, {"p": 2, "en": "Literature, history and philosophy teach students to think critically, communicate clearly and judge the ethics of new technology, which matters in areas such as artificial intelligence and genetic research.", "vi": "Văn học, lịch sử và triết học dạy học sinh suy nghĩ phản biện, giao tiếp rõ ràng và đánh giá khía cạnh đạo đức của công nghệ mới, điều quan trọng trong những lĩnh vực như trí tuệ nhân tạo và nghiên cứu di truyền.", "alts": ["Literature, history and philosophy teach students to think critically, communicate clearly and assess the ethics of new technology, which matters in fields such as artificial intelligence and genetic research.", "Literature, history and philosophy teach students to think critically, express themselves clearly and judge the ethics of new technology, which is important in areas like artificial intelligence and genetic research."]}, {"p": 2, "en": "Creativity from art and design also helps scientists present ideas and solve problems in original ways.", "vi": "Sự sáng tạo từ mỹ thuật và thiết kế cũng giúp các nhà khoa học trình bày ý tưởng và giải quyết vấn đề theo những cách độc đáo.", "alts": ["Creativity from art and design also helps scientists explain ideas and solve problems in original ways."]}, {"p": 2, "en": "Society also needs many professionals who are not scientists.", "vi": "Xã hội cũng cần nhiều chuyên gia không phải là nhà khoa học.", "alts": ["Society also requires many professionals who are not scientists."]}, {"p": 2, "en": "Teachers, lawyers, nurses and managers keep schools, courts and hospitals running.", "vi": "Giáo viên, luật sư, y tá và nhà quản lý giữ cho trường học, tòa án và bệnh viện vận hành.", "alts": ["Teachers, lawyers, nurses and managers keep schools, courts and hospitals functioning."]}, {"p": 2, "en": "Students differ in talent, so forcing everyone towards science wastes ability and leaves essential jobs unfilled.", "vi": "Học sinh có năng khiếu khác nhau, nên ép mọi người đi theo hướng khoa học là lãng phí tài năng và để trống những công việc thiết yếu.", "alts": ["Students differ in talent, so pushing everyone towards science wastes ability and leaves essential jobs unfilled.", "Students have different talents, so forcing everyone into science wastes ability and leaves vital jobs unfilled."]}, {"p": 2, "en": "Teachers in particular train the scientists of the future.", "vi": "Đặc biệt, giáo viên chính là người đào tạo các nhà khoa học tương lai.", "alts": ["Teachers in particular educate the scientists of tomorrow."]}, {"p": 2, "en": "A country with brilliant laboratories but few skilled teachers would soon find its research weakening.", "vi": "Một quốc gia có phòng thí nghiệm xuất sắc nhưng ít giáo viên giỏi sẽ sớm thấy nghiên cứu của mình suy yếu.", "alts": ["A country with brilliant laboratories but few skilled teachers would soon see its research weaken.", "A country with excellent laboratories but few skilled teachers would soon find its research declining."]}, {"p": 3, "en": "In conclusion, science deserves generous funding because it drives growth and improves health.", "vi": "Tóm lại, khoa học xứng đáng được tài trợ hào phóng vì nó thúc đẩy tăng trưởng và cải thiện sức khỏe.", "alts": ["To conclude, science merits generous funding as it drives growth and improves health."]}, {"p": 3, "en": "Even so, a country progresses best when it also invests in the humanities, the arts and professional training.", "vi": "Dù vậy, một quốc gia tiến bộ tốt nhất khi cũng đầu tư vào khoa học nhân văn, nghệ thuật và đào tạo nghề nghiệp.", "alts": ["Nevertheless, a nation advances best when it also invests in the humanities, the arts and vocational training."]}], "no": 20, "type": "Agree or disagree", "words": 323}, {"title": "Online Courses", "prompt": "More and more universities are replacing face-to-face teaching with online courses. Do you think this is a positive or negative development?", "paras": ["Many universities are now replacing lectures on campus with online courses, a change that has accelerated in recent years. Although it has clear advantages for many students, I believe it is a negative development overall.", "The attractions of online study are real. Flexibility is the greatest. A student who works full time or looks after children can watch recorded lectures late at night, and people living in remote areas can enrol at a leading university without moving to another city. Mature students who left school years ago can retrain without giving up their income. Cost matters too. Without lecture halls and large teaching staff, universities can charge lower fees, and students save money on rent and transport. These savings allow institutions to offer places to far more students than a physical campus could hold. Recorded sessions can also be replayed before exams, which helps those who struggle to follow a fast explanation. However, convenience is a poor measure of educational quality.", "In my view, online courses weaken the quality of learning. Students lose the interaction that keeps them motivated. Without classmates and lecturers in the room, it is easy to postpone a lesson, and many learners feel isolated and eventually abandon the course. Dropout rates on fully online programmes are often higher than on traditional degrees. The spontaneous question or group discussion that clarifies a difficult idea also rarely happens on a screen. A lecturer who notices a puzzled face can slow down and explain again, which a recording cannot do. Practical training suffers as well. Subjects such as medicine, engineering and chemistry depend on laboratories, equipment and supervised practice that a video cannot reproduce. Daily campus life also teaches teamwork and communication, qualities that employers value highly.", "In conclusion, online courses give students flexibility and lower costs, but they cannot match the motivation, interaction and hands-on training of a real campus. Universities should therefore treat them as a supplement rather than a replacement."], "sents": [{"p": 0, "en": "Many universities are now replacing lectures on campus with online courses, a change that has accelerated in recent years.", "vi": "Nhiều trường đại học hiện đang thay các bài giảng trực tiếp tại trường bằng các khóa học trực tuyến, một thay đổi đã tăng tốc trong những năm gần đây.", "alts": ["Many universities are now replacing on-campus lectures with online courses, a trend that has gathered pace in recent years.", "A growing number of universities are swapping lectures on campus for online courses, a shift that has speeded up in recent years."]}, {"p": 0, "en": "Although it has clear advantages for many students, I believe it is a negative development overall.", "vi": "Dù điều này mang lại những lợi ích rõ ràng cho nhiều sinh viên, tôi cho rằng xét tổng thể đây là một diễn biến tiêu cực.", "alts": ["Although it brings clear benefits to many students, I think it is a negative development on the whole.", "While it has obvious advantages for many students, I believe it is a harmful trend overall."]}, {"p": 1, "en": "The attractions of online study are real.", "vi": "Sức hấp dẫn của việc học trực tuyến là có thật.", "alts": ["The appeal of online study is genuine.", "The benefits of studying online are real."]}, {"p": 1, "en": "Flexibility is the greatest.", "vi": "Sự linh hoạt là điểm lớn nhất.", "alts": ["Flexibility is the biggest.", "Flexibility is the most important."]}, {"p": 1, "en": "A student who works full time or looks after children can watch recorded lectures late at night, and people living in remote areas can enrol at a leading university without moving to another city.", "vi": "Một sinh viên đi làm toàn thời gian hoặc chăm con có thể xem bài giảng ghi hình vào đêm muộn, và người sống ở vùng xa xôi có thể đăng ký học tại một trường đại học hàng đầu mà không cần chuyển sang thành phố khác.", "alts": ["A student who works full-time or looks after children can watch recorded lectures late at night, and those living in remote areas can enrol at a top university without moving to another city.", "Students who work full time or care for children can watch recorded lectures late in the evening, and people in remote areas can enrol at a leading university without having to relocate to another city."]}, {"p": 1, "en": "Mature students who left school years ago can retrain without giving up their income.", "vi": "Những sinh viên lớn tuổi đã rời ghế nhà trường nhiều năm có thể học lại nghề mà không phải từ bỏ thu nhập.", "alts": ["Mature students who left school many years ago can retrain without giving up their income.", "Older students who finished school years ago can retrain without having to give up their earnings."]}, {"p": 1, "en": "Cost matters too.", "vi": "Chi phí cũng quan trọng.", "alts": ["Cost is also important.", "Cost matters as well."]}, {"p": 1, "en": "Without lecture halls and large teaching staff, universities can charge lower fees, and students save money on rent and transport.", "vi": "Không cần giảng đường và đội ngũ giảng viên đông đảo, các trường có thể thu học phí thấp hơn, còn sinh viên tiết kiệm được tiền thuê nhà và đi lại.", "alts": ["Without lecture halls and a large teaching staff, universities can charge lower fees, and students save money on rent and transport.", "Since they do not need lecture halls and many teachers, universities can charge lower fees, and students save on rent and transport."]}, {"p": 1, "en": "These savings allow institutions to offer places to far more students than a physical campus could hold.", "vi": "Những khoản tiết kiệm này cho phép các trường nhận số sinh viên nhiều hơn hẳn sức chứa của một khuôn viên thực tế.", "alts": ["These savings enable institutions to offer places to far more students than a physical campus could accommodate.", "These savings allow universities to admit far more students than a physical campus could hold."]}, {"p": 1, "en": "Recorded sessions can also be replayed before exams, which helps those who struggle to follow a fast explanation.", "vi": "Các buổi học ghi hình cũng có thể được xem lại trước kỳ thi, giúp những bạn khó theo kịp những phần giảng nhanh.", "alts": ["Recorded sessions can also be watched again before exams, which helps students who struggle to follow a fast explanation.", "Recorded lessons can also be replayed before exams, which helps those who find it hard to keep up with a fast explanation."]}, {"p": 1, "en": "However, convenience is a poor measure of educational quality.", "vi": "Tuy nhiên, sự tiện lợi không phải là thước đo tốt cho chất lượng giáo dục.", "alts": ["Nevertheless, convenience is a poor measure of educational quality.", "However, conveni
