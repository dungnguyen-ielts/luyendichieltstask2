miss the importance of class size raise practical arguments.", "People who downplay class size make practical arguments."]}, {"p": 1, "en": "A skilled teacher can manage a large group through pair work and group tasks, so that every learner still gets a chance to speak.", "vi": "Một giáo viên giỏi có thể điều hành một nhóm đông bằng các hoạt động làm việc theo cặp và theo nhóm, để mỗi học viên vẫn có cơ hội nói.", "alts": ["A skilled teacher can manage a large group through pair work and group tasks, so each learner still gets a chance to speak.", "A capable teacher can handle a large class using pair work and group tasks, which means every learner still has an opportunity to speak.", "A capable teacher can handle a big group with pair work and group tasks, so each learner still has a chance to speak."]}, {"p": 1, "en": "Apps, video lessons and online exercises also let students practise alone and depend less on the teacher's attention.", "vi": "Các ứng dụng, bài giảng video và bài tập trực tuyến cũng cho phép học viên tự luyện tập và ít phụ thuộc hơn vào sự quan tâm của giáo viên.", "alts": ["Language apps, video lessons and online exercises also allow students to practise on their own and rely less on the teacher."]}, {"p": 1, "en": "Technology can even give each learner instant corrections on written work.", "vi": "Thậm chí công nghệ còn có thể sửa lỗi bài viết cho từng học viên ngay lập tức.", "alts": ["Technology can even provide each student with immediate feedback on their writing.", "Technology can even provide each learner with immediate corrections on written work."]}, {"p": 1, "en": "Experienced teachers can also use assistants and recorded material to support weaker learners.", "vi": "Giáo viên giàu kinh nghiệm cũng có thể tận dụng trợ giảng và tài liệu ghi hình, ghi âm để hỗ trợ những học viên yếu hơn.", "alts": ["Experienced teachers can also rely on assistants and recordings to help weaker students."]}, {"p": 1, "en": "Larger classes are cheaper to run as well.", "vi": "Lớp đông còn rẻ hơn để tổ chức.", "alts": ["Larger classes are also cheaper to run.", "Bigger classes are less expensive to run as well."]}, {"p": 1, "en": "Schools can therefore charge lower fees and open language learning to more people, including those who could not afford private tuition.", "vi": "Nhờ vậy, các trường có thể thu học phí thấp hơn và đưa việc học ngoại ngữ đến nhiều người hơn, kể cả những ai không đủ tiền học riêng.", "alts": ["Schools can therefore charge lower fees and make language learning available to more people, including those who could not afford private tuition.", "As a result, schools can set lower fees and open up language learning to more people, including those who cannot afford private lessons."]}, {"p": 1, "en": "However, none of these tools can replace a teacher who listens to a learner and responds directly.", "vi": "Tuy nhiên, không công cụ nào trong số này thay thế được một giáo viên lắng nghe học viên và phản hồi trực tiếp.", "alts": ["Nevertheless, no tool can take the place of a teacher who listens to a learner and replies personally.", "Nevertheless, none of these tools can take the place of a teacher who listens to a learner and responds personally."]}, {"p": 2, "en": "Small classes, by contrast, allow far more speaking time, which is the key to fluency.", "vi": "Ngược lại, lớp nhỏ cho phép dành nhiều thời gian nói hơn hẳn, và đó là chìa khóa của sự lưu loát.", "alts": ["Small classes, on the other hand, give students much more time to speak, which is essential for fluency."]}, {"p": 2, "en": "In a group of eight, each learner may talk for ten minutes of a one-hour lesson, whereas in a class of forty most students barely open their mouths.", "vi": "Trong một nhóm tám người, mỗi học viên có thể nói mười phút trong một buổi học một tiếng, còn ở lớp bốn mươi người thì hầu hết học viên gần như không mở miệng.", "alts": ["In a group of eight, every learner might speak for ten minutes of a one-hour lesson, while in a class of forty most students hardly say a word.", "In a group of eight, each student may talk for ten minutes in an hour-long lesson, whereas in a class of forty most barely open their mouths."]}, {"p": 2, "en": "Shy students also feel less afraid of errors in front of a handful of classmates than in front of a crowd.", "vi": "Những bạn nhút nhát cũng bớt sợ mắc lỗi hơn khi nói trước vài bạn cùng lớp so với trước cả một lớp đông người.", "alts": ["Shy students are also less afraid of making mistakes in front of a few classmates than in front of a large crowd.", "Shy learners also feel less nervous about mistakes when they speak to a handful of classmates rather than a crowd."]}, {"p": 2, "en": "Individual feedback is the other advantage.", "vi": "Lợi thế còn lại là phản hồi riêng cho từng người.", "alts": ["Personal feedback is the other advantage.", "Individual feedback is the second benefit."]}, {"p": 2, "en": "Teachers can spot mistakes in pronunciation and grammar and correct them immediately.", "vi": "Giáo viên có thể phát hiện lỗi phát âm và ngữ pháp rồi sửa ngay.", "alts": ["Teachers can spot errors in pronunciation and grammar and correct them straight away.", "In a small group, teachers can notice mistakes in pronunciation and grammar and correct them immediately."]}, {"p": 2, "en": "They can also adapt activities to each learner's level, so that beginners are not left behind and advanced students are not bored.", "vi": "Họ cũng có thể điều chỉnh hoạt động cho phù hợp với trình độ từng người, để người mới bắt đầu không bị bỏ lại phía sau và học viên giỏi không thấy chán.", "alts": ["They can also adjust tasks to suit each learner, so beginners do not fall behind and advanced students do not get bored."]}, {"p": 2, "en": "Regular feedback also keeps learners motivated, because they see their progress week by week instead of waiting for an end-of-term test.", "vi": "Phản hồi đều đặn cũng giữ động lực cho học viên, vì họ thấy được tiến bộ từng tuần thay vì phải chờ bài kiểm tra cuối kỳ.", "alts": ["Frequent feedback also keeps learners motivated, as they see their progress week by week rather than waiting for an end-of-term test.", "Regular feedback also helps learners stay motivated, since they can see their improvement every week instead of waiting for a test at the end of term."]}, {"p": 3, "en": "In conclusion, large classes can work with a skilled teacher and good materials, but they cannot match the speaking practice and individual feedback that small groups provide.", "vi": "Tóm lại, lớp đông vẫn có thể hiệu quả nếu có giáo viên giỏi và tài liệu tốt, nhưng không thể sánh được với việc luyện nói và phản hồi cá nhân mà các nhóm nhỏ mang lại.", "alts": ["In conclusion, large classes can succeed with a skilled teacher and good materials, but they cannot match the speaking practice and individual feedback that small groups provide.", "To conclude, big classes can work with a good teacher and quality materials, but they cannot offer the same speaking practice and personal feedback as small groups.", "To conclude, big classes can succeed with a skilled teacher and good materials, but they cannot equal the speaking practice and personal feedback that small groups offer."]}, {"p": 3, "en": "Language schools should therefore keep their classes small whenever possible, particularly for beginners who need confidence.", "vi": "Vì vậy, các trường ngoại ngữ nên giữ lớp nhỏ bất cứ khi nào có thể, đặc biệt cho người mới bắt đầu cần sự tự tin.", "alts": ["Language schools should therefore keep classes small wherever possible, especially for beginners who need to build confidence.", "For this reason, language schools should keep their classes small whenever they can, particularly for beginners who need confidence."]}], "no": 7, "type": "Discuss both views", "words": 325}, {"title": "Planning Ahead", "prompt": "Some people think that planning for the future is a waste of time. They believe it is more important to focus on the present. To what extent do you agree or disagree?", "paras": ["Some people regard planning ahead as pointless and prefer to concentrate on the present and enjoy each day as it comes. I disagree, because sensible planning gives people direction and protects them from avoidable problems and regret.", "Those who favour living for the moment have some grounds. The future is unpredictable, and plans can be wrecked by events nobody expected, such as illness, a recession or a pandemic. Someone who spends years working towards a goal may find that the industry has changed or that their own interests have moved on, since goals set at eighteen often no longer suit a person at thirty. Rigid plans can also make people reluctant to seize unexpected opportunities, such as a job offer abroad. Focusing on the present, meanwhile, lets people enjoy their relationships and hobbies rather than worrying about what may never happen, and constant planning can turn into anxiety. However, uncertainty is a reason to plan flexibly, not to abandon planning altogether.", "Planning, in my view, brings practical benefits that are hard to obtain any other way. A worker who saves a fixed amount each month builds a fund for emergencies, a deposit for a home and an income for retirement. Someone who spends everything today may face real hardship when earnings stop. A family that plans its budget can also absorb sudden costs, such as medical bills or repairs, without falling into debt. Planning gives study and career a clear direction too. Students who decide early what they want to do can choose relevant courses and gather experience step by step, while those who drift often waste years and money changing course. People who prepare for exams in advance also meet deadlines calmly instead of panicking at the last minute.", "In conclusion, the future can never be predicted perfectly, but that is no reason to ignore it. Flexible planning is a wise use of time rather than a waste, since it gives people security and purpose and leaves room to enjoy the present with fewer worries."], "sents": [{"p": 0, "en": "Some people regard planning ahead as pointless and prefer to concentrate on the present and enjoy each day as it comes.", "vi": "Một số người cho rằng lên kế hoạch cho tương lai là vô ích và muốn tập trung vào hiện tại, tận hưởng từng ngày khi nó đến.", "alts": ["Some people see planning ahead as pointless and prefer to focus on the present and enjoy each day as it comes.", "A number of people think that planning for the future is pointless and would rather concentrate on today and enjoy every day as it comes."]}, {"p": 0, "en": "I disagree, because sensible planning gives people direction and protects them from avoidable problems and regret.", "vi": "Tôi không đồng ý, vì việc lên kế hoạch hợp lý giúp con người có định hướng và tránh được những rắc rối cùng nỗi nuối tiếc không đáng có.", "alts": ["I do not agree, as sensible planning gives people a sense of direction and spares them avoidable problems and regret."]}, {"p": 1, "en": "Those who favour living for the moment have some grounds.", "vi": "Những người ủng hộ việc sống cho hiện tại cũng có lý do của họ.", "alts": ["People who prefer living for the moment have some justification.", "Those who prefer to live for the moment have a point.", "People who prefer to live in the moment have some grounds."]}, {"p": 1, "en": "The future is unpredictable, and plans can be wrecked by events nobody expected, such as illness, a recession or a pandemic.", "vi": "Tương lai khó đoán, và kế hoạch có thể đổ vỡ vì những biến cố không ai lường trước, như bệnh tật, suy thoái kinh tế hay đại dịch.", "alts": ["The future is unpredictable, and plans can be ruined by events nobody expected, such as illness, a recession or a pandemic.", "The future cannot be predicted, and plans can be wrecked by unforeseen events such as illness, an economic downturn or a pandemic."]}, {"p": 1, "en": "Someone who spends years working towards a goal may find that the industry has changed or that their own interests have moved on, since goals set at eighteen often no longer suit a person at thirty.", "vi": "Người dành nhiều năm theo đuổi một mục tiêu có thể phát hiện ngành nghề đã thay đổi hoặc sở thích của chính mình đã đổi khác, vì mục tiêu đặt ra năm mười tám tuổi thường không còn phù hợp với người ba mươi tuổi.", "alts": ["Someone who spends years working towards a goal may discover that the industry has changed or that their own interests have moved on, since goals set at eighteen often no longer suit a person at thirty.", "A person who works towards a goal for years may find that the industry has changed or that their interests have shifted, because goals set at eighteen often no longer fit someone at thirty.", "A person who spends years pursuing a goal may discover that the industry has moved on or that their own interests have shifted, because goals made at eighteen often no longer fit someone at thirty."]}, {"p": 1, "en": "Rigid plans can also make people reluctant to seize unexpected opportunities, such as a job offer abroad.", "vi": "Những kế hoạch cứng nhắc cũng có thể khiến người ta ngần ngại nắm bắt cơ hội bất ngờ, như lời mời làm việc ở nước ngoài.", "alts": ["Inflexible plans can also make people hesitant to take advantage of unexpected chances, such as a job offer overseas."]}, {"p": 1, "en": "Focusing on the present, meanwhile, lets people enjoy their relationships and hobbies rather than worrying about what may never happen, and constant planning can turn into anxiety.", "vi": "Trong khi đó, tập trung vào hiện tại giúp người ta tận hưởng các mối quan hệ và sở thích thay vì lo lắng về những điều có thể không bao giờ xảy ra, và việc lên kế hoạch liên tục có thể biến thành lo âu.", "alts": ["Living in the present, on the other hand, allows people to enjoy their relationships and hobbies instead of worrying about what may never happen, and constant planning can turn into anxiety.", "Focusing on the present, meanwhile, lets people enjoy their relationships and hobbies rather than worry about things that may never happen, and endless planning can become a source of anxiety."]}, {"p": 1, "en": "However, uncertainty is a reason to plan flexibly, not to abandon planning altogether.", "vi": "Tuy nhiên, sự bất định là lý do để lên kế hoạch linh hoạt, chứ không phải để từ bỏ việc lên kế hoạch hoàn toàn.", "alts": ["However, uncertainty is a reason to plan flexibly, not to give up planning altogether.", "Nevertheless, uncertainty is a reason to plan with flexibility, not to abandon planning entirely."]}, {"p": 2, "en": "Planning, in my view, brings practical benefits that are hard to obtain any other way.", "vi": "Theo tôi, việc lên kế hoạch mang lại những lợi ích thiết thực khó có được bằng cách nào khác.", "alts": ["In my view, planning brings practical benefits that are hard to achieve in any other way.", "Planning, I believe, offers practical advantages that are difficult to obtain any other way."]}, {"p": 2, "en": "A worker who saves a fixed amount each month builds a fund for emergencies, a deposit for a home and an income for retirement.", "vi": "Một người đi làm tiết kiệm một khoản cố định mỗi tháng sẽ xây dựng được quỹ dự phòng, khoản tiền đặt cọc mua nhà và nguồn thu nhập khi nghỉ hưu.", "alts": ["A worker who saves a fixed amount every month builds up a fund for emergencies, a deposit for a home and an income for retirement.", "An employee who puts aside a set sum each month creates an emergency fund, a deposit for a house and an income for retirement."]}, {"p": 2, "en": "Someone who spends everything today may face real hardship when earnings stop.", "vi": "Người tiêu hết mọi thứ ngay hôm nay có thể rơi vào cảnh khó khăn thực sự khi không còn thu nhập.", "alts": ["Someone who spends everything today may face real hardship when their income stops.", "A person who spends all they earn today could face serious hardship once they stop earning.", "A person who spends all they have today may suffer real difficulty when they stop earning."]}, {"p": 2, "en": "A family that plans its budget can also absorb sudden costs, such as medical bills or repairs, without falling into debt.", "vi": "Một gia đình biết lên ngân sách cũng có thể chống đỡ những khoản chi đột xuất như viện phí hay tiền sửa chữa mà không sa vào nợ.", "alts": ["A household that plans its budget can also cope with sudden costs, such as medical bills or repairs, without falling into debt.", "A family that budgets carefully can also handle unexpected expenses, like medical bills or repairs, without getting into debt."]}, {"p": 2, "en": "Planning gives study and career a clear direction too.", "vi": "Việc lên kế hoạch cũng giúp việc học và sự nghiệp có phương hướng rõ ràng.", "alts": ["Planning also gives study and career a clear direction.", "Planning also provides studies and careers with a clear direction."]}, {"p": 2, "en": "Students who decide early what they want to do can choose relevant courses and gather experience step by step, while those who drift often waste years and money changing course.", "vi": "Học sinh quyết định sớm mình muốn làm gì có thể chọn những môn học phù hợp và tích lũy kinh nghiệm từng bước, trong khi những bạn sống buông xuôi thường phí nhiều năm và tiền bạc để đổi hướng.", "alts": ["Students who decide early what they want to do can choose relevant courses and gain experience step by step, while those who drift often waste years and money changing course.", "Students who decide early on what they want to do can select suitable courses and build experience gradually, whereas those who drift often waste time and money by changing direction."]}, {"p": 2, "en": "People who prepare for exams in advance also meet deadlines calmly instead of panicking at the last minute.", "vi": "Những người ôn thi từ sớm cũng đáp ứng hạn chót một cách bình tĩnh thay vì cuống cuồng vào phút chót.", "alts": ["Those who prepare for exams early also meet deadlines with a calm mind rather than panicking at the last minute."]}, {"p": 3, "en": "In conclusion, the future can never be predicted perfectly, but that is no reason to ignore it.", "vi": "Tóm lại, tương lai không bao giờ có thể dự đoán hoàn hảo, nhưng đó không phải là lý do để phớt lờ nó.", "alts": ["To conclude, the future can never be forecast with certainty, but this is no reason to disregard it."]}, {"p": 3, "en": "Flexible planning is a wise use of time rather than a waste, since it gives people security and purpose and leaves room to enjoy the present with fewer worries.", "vi": "Lên kế hoạch linh hoạt là cách dùng thời gian khôn ngoan chứ không phải lãng phí, vì nó mang lại cho con người sự an tâm và mục đích sống, đồng thời vẫn chừa chỗ để tận hưởng hiện tại với ít lo âu hơn.", "alts": ["Flexible planning is a sensible use of time rather than a waste, since it gives people security and purpose and leaves room to enjoy the present with fewer worries.", "Flexible planning is a wise use of time, not a waste, because it gives people security and purpose and leaves space to enjoy the present with fewer worries."]}], "no": 8, "type": "Agree or disagree", "words": 336}, {"title": "Future Classrooms", "prompt": "The typical teaching situation between students and teachers in the classroom will be gone by the year 2050. To what extent do you agree or disagree?", "paras": ["Some predict that the traditional classroom, with a teacher addressing a group of students, will have disappeared by 2050, replaced by screens and software. I disagree with this prediction, although technology will certainly change how lessons are delivered.", "Supporters of the prediction point to technology. Online platforms already let students follow lessons from home, and artificial intelligence tutors can adjust the difficulty of exercises to each learner and answer questions at any hour. Recorded explanations can be replayed until a student understands, something that no teacher can offer thirty pupils at once. Technology also widens access and lowers cost. A student in a remote village can reach teachers and materials that were once available only in big cities. Learning through apps and video also costs less than maintaining school buildings and large staff, which appeals to governments facing tight budgets. However, these tools have been available for years, and most families still choose to send their children to school.", "Classrooms are likely to survive because they do things that screens cannot. Schools teach children to cooperate, negotiate and resolve disagreements by putting them in daily contact with peers, skills that are hard to develop alone at a computer. Group projects also teach children to take turns and accept different opinions. A teacher can also read a pupil's face, sense confusion or boredom and respond with encouragement, while software has little ability to motivate a discouraged child. Practical needs matter just as much. Young children need supervision, and parents who work full time depend on schools as a safe place for their children during the day. Subjects such as science experiments, art and sport also require physical space and equipment that a home computer cannot provide.", "In conclusion, technology will transform teaching methods, but it is unlikely to replace the classroom entirely. Because human guidance and social contact will remain essential, teachers and students will still meet in person in 2050, even if screens play a larger role."], "sents": [{"p": 0, "en": "Some predict that the traditional classroom, with a teacher addressing a group of students, will have disappeared by 2050, replaced by screens and software.", "vi": "Một số người dự đoán rằng lớp học truyền thống, nơi giáo viên giảng cho cả nhóm học sinh, sẽ biến mất vào năm 2050 và được thay thế bằng màn hình và phần mềm.", "alts": ["Some forecast that the traditional classroom, where a teacher speaks to a group of students, will have vanished by 2050 and been replaced by screens and software."]}, {"p": 0, "en": "I disagree with this prediction, although technology will certainly change how lessons are delivered.", "vi": "Tôi không đồng ý với dự đoán này, dù công nghệ chắc chắn sẽ thay đổi cách bài học được truyền đạt.", "alts": ["I disagree with this prediction, although technology will certainly change the way lessons are delivered.", "I do not agree with this forecast, even though technology will certainly change how lessons are taught."]}, {"p": 1, "en": "Supporters of the prediction point to technology.", "vi": "Những người ủng hộ dự đoán này đề cao vai trò của công nghệ.", "alts": ["Those who support the prediction point to technological progress.", "Those who back the prediction point to technology."]}, {"p": 1, "en": "Online platforms already let students follow lessons from home, and artificial intelligence tutors can adjust the difficulty of exercises to each learner and answer questions at any hour.", "vi": "Các nền tảng trực tuyến hiện đã cho phép học sinh theo dõi bài học tại nhà, và gia sư AI có thể điều chỉnh độ khó của bài tập theo từng người học và trả lời câu hỏi vào bất cứ giờ nào.", "alts": ["Online platforms already allow students to follow lessons from home, and artificial intelligence tutors can adjust the difficulty of exercises to each learner and answer questions at any hour.", "Online platforms already let students follow lessons from home, and AI tutors can adapt the difficulty of exercises to each learner and answer questions at any time."]}, {"p": 1, "en": "Recorded explanations can be replayed until a student understands, something that no teacher can offer thirty pupils at once.", "vi": "Những bài giảng được ghi lại có thể xem đi xem lại cho đến khi học sinh hiểu, điều mà không giáo viên nào làm được cho ba mươi học sinh cùng lúc.", "alts": ["Recorded explanations can be replayed until a student understands, which no teacher can offer thirty pupils at the same time.", "A recorded explanation can be played again until a student understands it, something no teacher can do for thirty pupils at once."]}, {"p": 1, "en": "Technology also widens access and lowers cost.", "vi": "Công nghệ cũng mở rộng cơ hội tiếp cận và giảm chi phí.", "alts": ["Technology also widens access and lowers costs.", "Technology also expands access and reduces costs."]}, {"p": 1, "en": "A student in a remote village can reach teachers and materials that were once available only in big cities.", "vi": "Một học sinh ở làng xa có thể tiếp cận giáo viên và tài liệu mà trước đây chỉ có ở các thành phố lớn.", "alts": ["Students in remote villages can now get hold of teachers and resources that used to exist only in large cities.", "A student in a remote village can get hold of teachers and resources that used to be available only in large cities."]}, {"p": 1, "en": "Learning through apps and video also costs less than maintaining school buildings and large staff, which appeals to governments facing tight budgets.", "vi": "Việc học qua ứng dụng và video cũng tốn ít hơn so với duy trì trường lớp và đội ngũ nhân viên đông đảo, điều này hấp dẫn các chính phủ đang eo hẹp ngân sách.", "alts": ["Learning through apps and videos is also cheaper than running school buildings and employing many teachers, which attracts governments with limited budgets."]}, {"p": 1, "en": "However, these tools have been available for years, and most families still choose to send their children to school.", "vi": "Tuy nhiên, những công cụ này đã có từ nhiều năm nay, mà đa số gia đình vẫn chọn cho con đến trường.", "alts": ["Nevertheless, these tools have existed for years, yet most families still decide to send their children to school."]}, {"p": 2, "en": "Classrooms are likely to survive because they do things that screens cannot.", "vi": "Lớp học nhiều khả năng sẽ tồn tại vì nó làm được những việc mà màn hình không làm được.", "alts": ["Classrooms will probably survive because they offer things that screens cannot."]}, {"p": 2, "en": "Schools teach children to cooperate, negotiate and resolve disagreements by putting them in daily contact with peers, skills that are hard to develop alone at a computer.", "vi": "Nhà trường dạy trẻ biết hợp tác, thương lượng và giải quyết bất đồng bằng cách cho các em tiếp xúc hằng ngày với bạn bè đồng trang lứa, những kỹ năng khó phát triển khi ngồi một mình trước máy tính.", "alts": ["By placing children in daily contact with classmates, schools teach them to work together, negotiate and resolve disagreements, skills that are difficult to build alone at a computer.", "Schools teach children to work together, negotiate and settle disagreements by placing them in daily contact with classmates, skills that are difficult to build alone at a computer."]}, {"p": 2, "en": "Group projects also teach children to take turns and accept different opinions.", "vi": "Các dự án nhóm cũng dạy trẻ biết nhường lượt và chấp nhận ý kiến khác nhau.", "alts": ["Group projects also show children how to take turns and respect different views."]}, {"p": 2, "en": "A teacher can also read a pupil's face, sense confusion or boredom and respond with encouragement, while software has little ability to motivate a discouraged child.", "vi": "Giáo viên còn có thể đọc được nét mặt học sinh, nhận ra sự bối rối hoặc chán nản và đáp lại bằng lời động viên, trong khi phần mềm gần như không có khả năng khích lệ một đứa trẻ đang nản lòng.", "alts": ["A teacher can also read a pupil's expression, notice confusion or boredom and offer encouragement, whereas software can do little to motivate a discouraged child."]}, {"p": 2, "en": "Practical needs matter just as much.", "vi": "Nhu cầu thực tế cũng quan trọng không kém.", "alts": ["Practical considerations are equally important.", "Practical requirements are just as important."]}, {"p": 2, "en": "Young children need supervision, and parents who work full time depend on schools as a safe place for their children during the day.", "vi": "Trẻ nhỏ cần được trông nom, và các bậc cha mẹ đi làm toàn thời gian phải dựa vào trường học như một nơi an toàn cho con ban ngày.", "alts": ["Young children need supervision, and parents who work full time rely on schools as a safe place for their children during the day.", "Young children must be supervised, and parents who work full-time depend on schools to keep their children safe during the day."]}, {"p": 2, "en": "Subjects such as science experiments, art and sport also require physical space and equipment that a home computer cannot provide.", "vi": "Những môn như thí nghiệm khoa học, mỹ thuật và thể thao cũng cần không gian và thiết bị mà một chiếc máy tính ở nhà không thể cung cấp.", "alts": ["Subjects such as science experiments, art and sport also need physical space and equipment that a home computer cannot offer.", "Subjects like science experiments, art and sport also require physical space and equipment that a home computer cannot provide."]}, {"p": 3, "en": "In conclusion, technology will transform teaching methods, but it is unlikely to replace the classroom entirely.", "vi": "Tóm lại, công nghệ sẽ làm thay đổi phương pháp giảng dạy, nhưng khó có thể thay thế hoàn toàn lớp học.", "alts": ["To conclude, technology will change how teachers teach, but it is unlikely to replace the classroom completely."]}, {"p": 3, "en": "Because human guidance and social contact will remain essential, teachers and students will still meet in person in 2050, even if screens play a larger role.", "vi": "Vì sự hướng dẫn của con người và giao tiếp xã hội vẫn sẽ là điều thiết yếu, giáo viên và học sinh vẫn sẽ gặp nhau trực tiếp vào năm 2050, dù màn hình có đóng vai trò lớn hơn.", "alts": ["Since human guidance and social contact will remain essential, teachers and students will still meet face to face in 2050, even if screens play a bigger role.", "Because human guidance and social contact will stay essential, teachers and students will still meet in person in 2050, even though screens will play a larger part."]}], "no": 9, "type": "Agree or disagree", "words": 327}, {"title": "Advertising", "prompt": "Some people find advertisements amusing or annoying and they are not influenced by this when they shop. To what extent do you agree or disagree?", "paras": ["Many shoppers claim that advertisements merely amuse or irritate them without affecting what they buy, and that their choices are entirely rational. I disagree with this claim, since advertising shapes choices in ways that people often fail to notice.", "Those who say they are immune have some justification. Modern consumers can compare prices and read reviews on their phones within seconds, so a clever slogan is rarely enough to win a sale. A shopper on a tight budget also buys what is affordable regardless of what an advert promises. Some treat adverts simply as a source of information about new products and then make up their own minds. Many people also skip, block or mute commercials, and a person who finds a jingle irritating may even avoid the brand on purpose. Others simply prefer to trust friends and family over any advertisement. Experienced shoppers learn to recognise tactics such as limited-time offers and to ignore them. However, these defences work only against advertising that people consciously notice.", "Advertising works largely below the level of awareness. Repeated exposure makes a brand familiar, and familiar names feel safer. Faced with a shelf of similar products, a shopper tends to reach for the one they recognise, without remembering where they first saw it. Even people who dislike a commercial may remember its slogan weeks later. Emotional appeal does the rest. Advertisers link a product to happiness, status or belonging rather than to logic. An amusing advert is doubly effective, because people remember it and pass it on to friends. Children are especially responsive, and impulse purchases, such as snacks placed near the till, often follow a catchy campaign. Companies would not spend billions each year if advertisements failed to change behaviour.", "In conclusion, shoppers may feel that they ignore advertisements, but familiarity and emotional appeal quietly steer many purchases. Companies continue to invest heavily in advertising because it clearly influences consumer behaviour, even among people who believe they are immune."], "sents": [{"p": 0, "en": "Many shoppers claim that advertisements merely amuse or irritate them without affecting what they buy, and that their choices are entirely rational.", "vi": "Nhiều người mua sắm cho rằng quảng cáo chỉ khiến họ thấy vui hoặc khó chịu mà không ảnh hưởng đến thứ họ mua, và rằng lựa chọn của họ hoàn toàn lý trí.", "alts": ["Many shoppers claim that advertisements merely entertain or annoy them without affecting what they buy, and that their choices are completely rational.", "Many consumers say that adverts only amuse or irritate them and do not influence what they buy, and that their decisions are entirely rational."]}, {"p": 0, "en": "I disagree with this claim, since advertising shapes choices in ways that people often fail to notice.", "vi": "Tôi không đồng ý với nhận định này, vì quảng cáo định hình lựa chọn theo những cách mà con người thường không nhận ra.", "alts": ["I disagree with this claim, since advertising influences choices in ways that people often do not notice.", "I do not accept this claim, because advertising shapes decisions in ways that people frequently fail to notice."]}, {"p": 1, "en": "Those who say they are immune have some justification.", "vi": "Những người nói mình không bị quảng cáo tác động cũng có cơ sở để tin như vậy.", "alts": ["People who say they are unaffected have some justification.", "Those who claim to be immune have a point."]}, {"p": 1, "en": "Modern consumers can compare prices and read reviews on their phones within seconds, so a clever slogan is rarely enough to win a sale.", "vi": "Người tiêu dùng hiện đại có thể so sánh giá và đọc đánh giá trên điện thoại chỉ trong vài giây, nên một khẩu hiệu khéo léo hiếm khi đủ để bán được hàng.", "alts": ["Today's consumers can compare prices and read reviews on their phones in seconds, so a clever slogan is seldom enough to win a sale.", "Modern shoppers can compare prices and read reviews on their phones within seconds, so a clever slogan alone rarely wins a sale."]}, {"p": 1, "en": "A shopper on a tight budget also buys what is affordable regardless of what an advert promises.", "vi": "Người mua có ngân sách eo hẹp cũng sẽ mua thứ mình đủ tiền bất kể quảng cáo hứa hẹn điều gì.", "alts": ["Shoppers on a tight budget also buy what they can afford, whatever an advert promises.", "People on a limited budget also purchase what they can afford, regardless of what an advert promises."]}, {"p": 1, "en": "Some treat adverts simply as a source of information about new products and then make up their own minds.", "vi": "Một số người chỉ coi quảng cáo là nguồn thông tin về sản phẩm mới rồi tự quyết định.", "alts": ["Some regard adverts merely as a source of information about new products and then decide for themselves.", "Some people treat adverts simply as a way of learning about new products and then make up their own minds."]}, {"p": 1, "en": "Many people also skip, block or mute commercials, and a person who finds a jingle irritating may even avoid the brand on purpose.", "vi": "Nhiều người cũng bỏ qua, chặn hoặc tắt tiếng quảng cáo, và người thấy một đoạn nhạc quảng cáo khó chịu thậm chí có thể cố tình tránh thương hiệu đó.", "alts": ["Many people also skip, block or mute adverts, and someone who finds a jingle annoying may even avoid the brand on purpose.", "Many viewers also skip, block or mute commercials, and a person who finds a jingle irritating may deliberately avoid that brand."]}, {"p": 1, "en": "Others simply prefer to trust friends and family over any advertisement.", "vi": "Những người khác đơn giản là tin bạn bè và gia đình hơn bất kỳ quảng cáo nào.", "alts": ["Others simply prefer to trust friends and family rather than any advertisement.", "Others just prefer to rely on friends and relatives instead of any advert."]}, {"p": 1, "en": "Experienced shoppers learn to recognise tactics such as limited-time offers and to ignore them.", "vi": "Người mua sắm có kinh nghiệm học cách nhận ra những chiêu như ưu đãi giới hạn thời gian và phớt lờ chúng.", "alts": ["Seasoned shoppers learn to identify tricks such as time-limited deals and to disregard them."]}, {"p": 1, "en": "However, these defences work only against advertising that people consciously notice.", "vi": "Tuy nhiên, những lớp phòng vệ này chỉ có tác dụng với quảng cáo mà người ta chủ động nhận ra.", "alts": ["However, these defences only work against advertising that people consciously notice.", "Nevertheless, these defences are effective only against advertising that people are aware of."]}, {"p": 2, "en": "Advertising works largely below the level of awareness.", "vi": "Quảng cáo chủ yếu tác động ở mức vô thức.", "alts": ["Advertising operates largely beneath conscious awareness.", "Most advertising works at a subconscious level."]}, {"p": 2, "en": "Repeated exposure makes a brand familiar, and familiar names feel safer.", "vi": "Việc tiếp xúc lặp đi lặp lại khiến một thương hiệu trở nên quen thuộc, và những cái tên quen thuộc tạo cảm giác an toàn hơn.", "alts": ["When people see a brand repeatedly, it becomes familiar, and familiar names seem more reliable.", "Repeated exposure makes a brand well known, and well-known names feel more reliable."]}, {"p": 2, "en": "Faced with a shelf of similar products, a shopper tends to reach for the one they recognise, without remembering where they first saw it.", "vi": "Đứng trước một kệ hàng toàn sản phẩm tương tự, người mua thường với tay lấy món mình nhận ra mà không nhớ đã thấy nó lần đầu ở đâu.", "alts": ["Faced with a shelf of similar products, a shopper tends to pick the one they recognise, without recalling where they first saw it.", "When confronted with a shelf of similar products, shoppers tend to reach for the one they know, without remembering where they first saw it."]}, {"p": 2, "en": "Even people who dislike a commercial may remember its slogan weeks later.", "vi": "Ngay cả người không ưa một quảng cáo vẫn có thể nhớ khẩu hiệu của nó nhiều tuần sau.", "alts": ["Even those who dislike an advert may recall its slogan weeks afterwards.", "Even people who dislike a commercial can remember its slogan weeks later."]}, {"p": 2, "en": "Emotional appeal does the rest.", "vi": "Phần còn lại là nhờ sức hút cảm xúc.", "alts": ["The rest is done by emotional appeal.", "Emotional appeal does the remaining work."]}, {"p": 2, "en": "Advertisers link a product to happiness, status or belonging rather than to logic.", "vi": "Các nhà quảng cáo gắn sản phẩm với hạnh phúc, địa vị hoặc cảm giác thuộc về thay vì với logic.", "alts": ["Advertisers connect a product with happiness, status or belonging instead of logic.", "Advertisers link a product to happiness, status or a sense of belonging rather than to reason."]}, {"p": 2, "en": "An amusing advert is doubly effective, because people remember it and pass it on to friends.", "vi": "Một quảng cáo hài hước còn hiệu quả gấp đôi, vì người ta nhớ nó và kể lại cho bạn bè.", "alts": ["A funny advert is twice as effective, since people remember it and share it with friends.", "An amusing advert is doubly effective because people remember it and pass it on to their friends."]}, {"p": 2, "en": "Children are especially responsive, and impulse purchases, such as snacks placed near the till, often follow a catchy campaign.", "vi": "Trẻ em đặc biệt dễ bị tác động, và những lần mua bốc đồng, như đồ ăn vặt đặt gần quầy thu ngân, thường đi theo một chiến dịch bắt tai.", "alts": ["Children are particularly receptive, and impulse buys, such as snacks placed near the checkout, often follow a catchy campaign.", "Children are especially responsive, and impulse purchases, such as snacks placed by the till, often follow a catchy campaign."]}, {"p": 2, "en": "Companies would not spend billions each year if advertisements failed to change behaviour.", "vi": "Các công ty sẽ không chi hàng tỷ đô la mỗi năm nếu quảng cáo không làm thay đổi hành vi.", "alts": ["Businesses would not spend billions every year if adverts did not change people's behaviour.", "Companies would not invest billions annually if advertising failed to change behaviour."]}, {"p": 3, "en": "In conclusion, shoppers may feel that they ignore advertisements, but familiarity and emotional appeal quietly steer many purchases.", "vi": "Tóm lại, người mua sắm có thể cảm thấy mình phớt lờ quảng cáo, nhưng sự quen thuộc và sức hút cảm xúc âm thầm dẫn dắt nhiều quyết định mua hàng.", "alts": ["In conclusion, consumers may feel they ignore adverts, but familiarity and emotional appeal quietly guide many purchases.", "To conclude, shoppers may believe they ignore advertising, but familiarity and emotional appeal quietly steer many of their purchases."]}, {"p": 3, "en": "Companies continue to invest heavily in advertising because it clearly influences consumer behaviour, even among people who believe they are immune.", "vi": "Các công ty tiếp tục đầu tư mạnh vào quảng cáo vì nó rõ ràng ảnh hưởng đến hành vi người tiêu dùng, kể cả ở những người tin rằng mình miễn nhiễm.", "alts": ["Businesses keep investing heavily in advertising because it clearly affects consumer behaviour, even among people who think they are immune.", "Companies continue to spend heavily on advertising because it plainly influences consumer behaviour, even among those who believe they are unaffected."]}], "no": 10, "type": "Agree or disagree", "words": 327}, {"title": "Working from Home", "prompt": "Many employees can now do their work from home using modern technology. However, this change may only benefit workers, not the employers. To what extent do you agree or disagree?", "paras": ["Advances in technology now allow many employees to carry out their duties from home instead of travelling to an office. Some claim that this arrangement rewards only workers, but I disagree, since employers gain a great deal as well.", "Those who think only employees benefit have a point. Workers save hours of commuting every week, which gives them more time and money for family, rest and hobbies. A person who once spent two hours on a crowded train can now begin work refreshed. Flexible hours also help parents and carers fit work around their responsibilities. Employers, meanwhile, lose direct oversight. A manager who cannot see the team may struggle to judge effort. Spontaneous cooperation, such as a quick question across the desk, often disappears when colleagues work alone in separate houses, which can slow projects and weaken team spirit. New recruits suffer most, because they learn the company culture by watching experienced colleagues. However, these drawbacks can be managed with clear targets and regular video meetings.", "In my view, companies gain at least as much. Reduced overheads are the clearest benefit. A firm whose staff work remotely needs less office space, electricity and equipment. Some businesses have given up expensive city centre premises altogether, saving money that can be invested in growth. Rent is among the largest costs a firm faces, so even a partial move to remote work produces significant savings. A wider talent pool is the second gain. An employer who offers home working can hire talented people living anywhere rather than only those near the office. A software company, for instance, can recruit programmers from another country without paying relocation costs. Staff who value the freedom to work from home are also more likely to stay, which spares the firm the cost of recruiting and training replacements.", "In conclusion, home working clearly saves workers time and gives them flexibility, but it also reduces costs and widens the talent pool for employers. It is therefore a development that benefits both sides."], "sents": [{"p": 0, "en": "Advances in technology now allow many employees to carry out their duties from home instead of travelling to an office.", "vi": "Tiến bộ công nghệ hiện cho phép nhiều nhân viên làm việc tại nhà thay vì đi đến văn phòng.", "alts": ["Advances in technology now allow many employees to do their jobs from home instead of travelling to an office.", "Technological progress now enables many workers to carry out their duties at home rather than commuting to an office."]}, {"p": 0, "en": "Some claim that this arrangement rewards only workers, but I disagree, since employers gain a great deal as well.", "vi": "Một số người cho rằng cách làm này chỉ có lợi cho người lao động, nhưng tôi không đồng ý, vì người sử dụng lao động cũng được lợi rất nhiều.", "alts": ["Some argue that this arrangement rewards only workers, but I disagree, since employers gain a great deal too.", "Some say that this arrangement benefits only employees, but I disagree, because employers also gain a lot."]}, {"p": 1, "en": "Those who think only employees benefit have a point.", "vi": "Những người nghĩ rằng chỉ nhân viên được lợi cũng có lý.", "alts": ["People who believe that only workers benefit have a fair argument."]}, {"p": 1, "en": "Workers save hours of commuting every week, which gives them more time and money for family, rest and hobbies.", "vi": "Người lao động tiết kiệm được hàng giờ đi lại mỗi tuần, nhờ đó có thêm thời gian và tiền bạc cho gia đình, nghỉ ngơi và sở thích.", "alts": ["Employees save hours of travelling each week, which leaves them with more time and money for their families, relaxation and hobbies."]}, {"p": 1, "en": "A person who once spent two hours on a crowded train can now begin work refreshed.", "vi": "Một người từng mất hai giờ trên chuyến tàu đông đúc giờ có thể bắt đầu làm việc với tinh thần sảng khoái.", "alts": ["Someone who used to spend two hours on a packed train can now start work feeling fresh."]}, {"p": 1, "en": "Flexible hours also help parents and carers fit work around their responsibilities.", "vi": "Giờ giấc linh hoạt cũng giúp các bậc cha mẹ và những người phải chăm sóc người thân sắp xếp công việc quanh trách nhiệm của mình.", "alts": ["Flexible schedules also make it easier for parents and carers to fit work around their duties.", "Flexible schedules also help parents and carers arrange work around their duties."]}, {"p": 1, "en": "Employers, meanwhile, lose direct oversight.", "vi": "Trong khi đó, người sử dụng lao động mất đi khả năng giám sát trực tiếp.", "alts": ["Employers, on the other hand, lose direct supervision.", "Employers, by contrast, lose direct control over their staff."]}, {"p": 1, "en": "A manager who cannot see the team may struggle to judge effort.", "vi": "Một quản lý không nhìn thấy đội ngũ có thể khó đánh giá mức độ nỗ lực.", "alts": ["A manager who cannot see their team may find it hard to assess how hard people are working.", "A manager who cannot see the team may find it hard to judge effort.", "A manager who cannot watch the team may struggle to assess how hard they work."]}, {"p": 1, "en": "Spontaneous cooperation, such as a quick question across the desk, often disappears when colleagues work alone in separate houses, which can slow projects and weaken team spirit.", "vi": "Sự phối hợp tự nhiên, như hỏi nhanh một câu ở bàn bên cạnh, thường biến mất khi đồng nghiệp làm việc riêng lẻ ở các ngôi nhà khác nhau, điều có thể làm chậm dự án và làm suy yếu tinh thần đồng đội.", "alts": ["Spontaneous cooperation, such as a quick question across the desk, often disappears when colleagues work alone in separate homes, which can slow projects and weaken team spirit.", "Natural teamwork, like a quick question across the desk, often disappears when colleagues work alone at home, which can delay projects and weaken team spirit."]}, {"p": 1, "en": "New recruits suffer most, because they learn the company culture by watching experienced colleagues.", "vi": "Nhân viên mới chịu thiệt nhiều nhất, vì họ học văn hóa công ty bằng cách quan sát những đồng nghiệp có kinh nghiệm.", "alts": ["New staff are affected most, as they learn the company culture by observing experienced colleagues."]}, {"p": 1, "en": "However, these drawbacks can be managed with clear targets and regular video meetings.", "vi": "Tuy nhiên, những bất lợi này có thể được kiểm soát bằng các mục tiêu rõ ràng và các cuộc họp video định kỳ.", "alts": ["Nevertheless, these problems can be handled with clear targets and regular video meetings."]}, {"p": 2, "en": "In my view, companies gain at least as much.", "vi": "Theo tôi, các công ty được lợi không kém.", "alts": ["In my opinion, companies gain at least as much.", "I believe that businesses benefit at least as much."]}, {"p": 2, "en": "Reduced overheads are the clearest benefit.", "vi": "Chi phí vận hành giảm là lợi ích rõ ràng nhất.", "alts": ["Lower overheads are the clearest benefit.", "Reduced running costs are the most obvious advantage."]}, {"p": 2, "en": "A firm whose staff work remotely needs less office space, electricity and equipment.", "vi": "Một công ty có nhân viên làm việc từ xa cần ít diện tích văn phòng, điện và thiết bị hơn.", "alts": ["A company whose employees work remotely requires less office space, power and equipment."]}, {"p": 2, "en": "Some businesses have given up expensive city centre premises altogether, saving money that can be invested in growth.", "vi": "Một số doanh nghiệp đã bỏ hẳn các mặt bằng đắt đỏ ở trung tâm thành phố, tiết kiệm được khoản tiền có thể đem đầu tư phát triển.", "alts": ["Some firms have abandoned costly city-centre offices entirely, saving money that can be reinvested in growth.", "Some companies have abandoned costly offices in the city centre entirely, saving money that can be put into growth."]}, {"p": 2, "en": "Rent is among the largest costs a firm faces, so even a partial move to remote work produces significant savings.", "vi": "Tiền thuê mặt bằng là một trong những khoản chi lớn nhất của công ty, nên ngay cả việc chuyển một phần sang làm việc từ xa cũng mang lại khoản tiết kiệm đáng kể.", "alts": ["Rent is one of the biggest costs a firm faces, so even a partial move to remote work brings significant savings.", "Rent is among the largest expenses a company has, so even a partial shift to remote working produces considerable savings."]}, {"p": 2, "en": "A wider talent pool is the second gain.", "vi": "Nguồn nhân tài rộng hơn là lợi ích thứ hai.", "alts": ["A larger pool of talent is the second benefit."]}, {"p": 2, "en": "An employer who offers home working can hire talented people living anywhere rather than only those near the office.", "vi": "Nhà tuyển dụng cho phép làm việc tại nhà có thể thuê những người tài giỏi sống ở bất cứ đâu thay vì chỉ những người ở gần văn phòng.", "alts": ["An employer that offers home working can hire talented people wherever they live, not just those near the office.", "Employers who allow working from home can recruit skilled people from anywhere instead of only those who live near the office.", "An employer that allows working from home can recruit skilled people wherever they live instead of only those close to the office."]}, {"p": 2, "en": "A software company, for instance, can recruit programmers from another country without paying relocation costs.", "vi": "Chẳng hạn, một công ty phần mềm có thể tuyển lập trình viên từ nước khác mà không phải trả chi phí hỗ trợ chuyển nơi ở.", "alts": ["A software company, for example, can hire programmers from another country without paying relocation costs.", "A software firm, for instance, can recruit programmers abroad without covering relocation expenses."]}, {"p": 2, "en": "Staff who value the freedom to work from home are also more likely to stay, which spares the firm the cost of recruiting and training replacements.", "vi": "Những nhân viên coi trọng sự tự do làm việc tại nhà cũng thường gắn bó lâu hơn, giúp công ty khỏi tốn kém để tuyển và đào tạo người thay thế.", "alts": ["Employees who value the freedom to work from home are also more likely to stay, which spares the firm the cost of recruiting and training replacements.", "Staff who appreciate the freedom to work from home are also more likely to remain, which saves the company the expense of hiring and training replacements."]}, {"p": 3, "en": "In conclusion, home working clearly saves workers time and gives them flexibility, but it also reduces costs and widens the talent pool for employers.", "vi": "Tóm lại, làm việc tại nhà rõ ràng giúp người lao động tiết kiệm thời gian và linh hoạt hơn, nhưng cũng giúp người sử dụng lao động giảm chi phí và mở rộng nguồn nhân tài.", "alts": ["In conclusion, working from home clearly saves employees time and offers them flexibility, but it also cuts costs and widens the talent pool for employers.", "To conclude, home working obviously saves workers time and gives them flexibility, but it also reduces costs and expands the talent pool for employers."]}, {"p": 3, "en": "It is therefore a development that benefits both sides.", "vi": "Vì vậy, đây là một xu hướng có lợi cho cả hai phía.", "alts": ["It is therefore a trend that works in favour of both parties.", "It is therefore a trend that benefits both parties."]}], "no": 11, "type": "Agree or disagree", "words": 333}, {"title": "Cars", "prompt": "Many people depend on their cars for everyday domestic, social and working needs. However unlimited use of cars causes a number of problems. What are some of these problems? What can be done to reduce the use of cars?", "paras": ["Cars have become essential for shopping, commuting and visiting friends, yet unrestricted use creates serious difficulties for both people and the environment. This essay will outline the main problems and suggest practical ways of reducing dependence on private vehicles.", "The most serious problem is pollution. Exhaust fumes release carbon dioxide, which contributes to climate change, along with fine particles and nitrogen oxides that irritate the lungs. People in busy cities suffer more asthma and heart disease, and children walking to school are particularly exposed to these fumes. Moreover, noise from constant traffic adds to stress for people living beside main roads. Congestion is the second major problem. When too many vehicles share limited road space, drivers lose hours in traffic jams every week, deliveries are delayed and businesses lose money. Building more roads rarely solves this, since extra space tends to attract even more cars. Crowded streets also increase the risk of accidents, and ambulances struggle to reach patients quickly through jammed traffic.", "Governments can respond in two main ways. Better public transport is the most effective. If buses, trams and metro lines are frequent, clean and affordable, many commuters will happily leave their cars at home. This has happened in cities that have invested heavily in rail networks. Safe cycling lanes and wide pavements can encourage short journeys on foot or by bike as well. Financial measures are also useful. Congestion charges for entering the city centre, high parking fees and taxes on fuel make driving more expensive, and the revenue can be spent on improving the alternatives. Drivers then have a clear incentive to share rides or choose another route. London's congestion charge, for example, cut traffic in the central zone after its introduction.", "In conclusion, heavy car use damages health and wastes time through pollution, congestion and accidents. Investment in public transport, combined with charges that discourage unnecessary driving, offers the most realistic solution to a problem that affects every large city."], "sents": [{"p": 0, "en": "Cars have become essential for shopping, commuting and visiting friends, yet unrestricted use creates serious difficulties for both people and the environment.", "vi": "Ô tô đã trở thành phương tiện thiết yếu cho việc mua sắm, đi làm và thăm bạn bè, nhưng việc sử dụng không giới hạn gây ra những khó khăn nghiêm trọng cho cả con người lẫn môi trường.", "alts": ["Cars have become essential for shopping, commuting and visiting friends, but unrestricted use causes serious problems for both people and the environment.", "Cars are now necessary for shopping, getting to work and seeing friends, yet unlimited use creates serious difficulties for people and the environment alike."]}, {"p": 0, "en": "This essay will outline the main problems and suggest practical ways of reducing dependence on private vehicles.", "vi": "Bài viết này sẽ nêu những vấn đề chính và đề xuất các cách thiết thực để giảm sự phụ thuộc vào phương tiện cá nhân.", "alts": ["This essay will outline the main problems and propose practical ways of reducing reliance on private vehicles.", "This essay will describe the main problems and suggest practical measures to cut dependence on private cars.", "This essay will outline the main problems and put forward practical ways of cutting dependence on private cars."]}, {"p": 1, "en": "The most serious problem is pollution.", "vi": "Vấn đề nghiêm trọng nhất là ô nhiễm.", "alts": ["The most serious issue is pollution."]}, {"p": 1, "en": "Exhaust fumes release carbon dioxide, which contributes to climate change, along with fine particles and nitrogen oxides that irritate the lungs.", "vi": "Khói xả thải ra khí carbon dioxide, góp phần gây biến đổi khí hậu, cùng các hạt bụi mịn và oxit nitơ gây kích ứng phổi.", "alts": ["Exhaust fumes release carbon dioxide, which contributes to climate change, as well as fine particles and nitrogen oxides that irritate the lungs.", "Exhaust fumes give off carbon dioxide, which adds to climate change, together with fine particles and nitrogen oxides that irritate the lungs."]}, {"p": 1, "en": "People in busy cities suffer more asthma and heart disease, and children walking to school are particularly exposed to these fumes.", "vi": "Người dân ở các thành phố đông đúc mắc hen suyễn và bệnh tim nhiều hơn, và trẻ em đi bộ đến trường đặc biệt dễ tiếp xúc với lượng khói này.", "alts": ["People in busy cities suffer more from asthma and heart disease, and children who walk to school are particularly exposed to these fumes.", "Residents of crowded cities are more likely to suffer from asthma and heart disease, and children walking to school are especially exposed to these fumes."]}, {"p": 1, "en": "Moreover, noise from constant traffic adds to stress for people living beside main roads.", "vi": "Hơn nữa, tiếng ồn từ dòng xe liên tục làm tăng căng thẳng cho những người sống cạnh đường lớn.", "alts": ["In addition, noise from constant traffic adds to the stress of people living beside main roads.", "Moreover, the noise of continuous traffic increases stress for those who live next to main roads."]}, {"p": 1, "en": "Congestion is the second major problem.", "vi": "Ùn tắc là vấn đề lớn thứ hai.", "alts": ["Traffic congestion is the second major problem.", "Congestion is the second big problem."]}, {"p": 1, "en": "When too many vehicles share limited road space, drivers lose hours in traffic jams every week, deliveries are delayed and businesses lose money.", "vi": "Khi quá nhiều phương tiện dùng chung không gian đường hạn chế, tài xế mất hàng giờ mỗi tuần trong các vụ kẹt xe, việc giao hàng bị chậm trễ và doanh nghiệp thiệt hại về tiền bạc.", "alts": ["When too many vehicles use limited road space, drivers waste hours in traffic jams each week, deliveries are held up and businesses lose money.", "When too many vehicles share limited road space, drivers lose hours in traffic jams every week, deliveries are delayed and companies lose money."]}, {"p": 1, "en": "Building more roads rarely solves this, since extra space tends to attract even more cars.", "vi": "Xây thêm đường hiếm khi giải quyết được điều này, vì không gian tăng thêm thường thu hút thêm nhiều xe hơn.", "alts": ["Building more roads rarely solves the problem, since additional space tends to attract even more cars.", "Constructing more roads seldom helps, as the extra space tends to draw in even more vehicles.", "Constructing more roads seldom solves the problem, as additional space tends to draw in even more cars."]}, {"p": 1, "en": "Crowded streets also increase the risk of accidents, and ambulances struggle to reach patients quickly through jammed traffic.", "vi": "Đường phố đông đúc cũng làm tăng nguy cơ tai nạn, và xe cứu thương khó đến chỗ bệnh nhân nhanh chóng khi giao thông tắc nghẽn.", "alts": ["Crowded streets also raise the risk of accidents, and ambulances find it hard to reach patients quickly through jammed traffic.", "Busy streets also increase the likelihood of accidents, and ambulances struggle to get to patients quickly in heavy traffic."]}, {"p": 2, "en": "Governments can respond in two main ways.", "vi": "Chính phủ có thể ứng phó theo hai cách chính.", "alts": ["Governments can tackle this in two main ways."]}, {"p": 2, "en": "Better public transport is the most effective.", "vi": "Cải thiện giao thông công cộng là cách hiệu quả nhất.", "alts": ["Improved public transport is the most effective of these."]}, {"p": 2, "en": "If buses, trams and metro lines are frequent, clean and affordable, many commuters will happily leave their cars at home.", "vi": "Nếu xe buýt, xe điện và tàu điện ngầm có chuyến dày, sạch sẽ và giá phải chăng, nhiều người đi làm sẽ vui vẻ để xe ở nhà.", "alts": ["If buses, trams and metro lines are frequent, clean and affordable, many commuters will gladly leave their cars at home.", "If buses, trams and metro services are frequent, clean and cheap, many commuters will willingly leave their cars at home."]}, {"p": 2, "en": "This has happened in cities that have invested heavily in rail networks.", "vi": "Điều này đã xảy ra ở những thành phố đầu tư mạnh vào mạng lưới đường sắt.", "alts": ["This has been seen in cities that have put large sums into their rail networks."]}, {"p": 2, "en": "Safe cycling lanes and wide pavements can encourage short journeys on foot or by bike as well.", "vi": "Làn đường dành cho xe đạp an toàn và vỉa hè rộng cũng có thể khuyến khích đi bộ hoặc đi xe đạp cho những quãng đường ngắn.", "alts": ["Safe cycling lanes and wide pavements can also encourage short journeys on foot or by bike.", "Safe bike lanes and broad pavements can also persuade people to walk or cycle for short trips."]}, {"p": 2, "en": "Financial measures are also useful.", "vi": "Các biện pháp tài chính cũng hữu ích.", "alts": ["Financial measures are also helpful.", "Financial incentives are useful too."]}, {"p": 2, "en": "Congestion charges for entering the city centre, high parking fees and taxes on fuel make driving more expensive, and the revenue can be spent on improving the alternatives.", "vi": "Phí ùn tắc khi vào trung tâm thành phố, phí đỗ xe cao và thuế nhiên liệu khiến việc lái xe tốn kém hơn, và nguồn thu có thể dùng để cải thiện các phương án thay thế.", "alts": ["Charges for driving into the city centre, expensive parking and fuel taxes make driving costlier, and the money raised can be used to improve the alternatives."]}, {"p": 2, "en": "Drivers then have a clear incentive to share rides or choose another route.", "vi": "Khi đó, người lái xe có động lực rõ ràng để đi chung xe hoặc chọn một cách di chuyển khác.", "alts": ["Drivers are then given a strong reason to car-share or take a different route."]}, {"p": 2, "en": "London's congestion charge, for example, cut traffic in the central zone after its introduction.", "vi": "Chẳng hạn, phí ùn tắc của London đã giảm lưu lượng xe ở khu vực trung tâm sau khi được áp dụng.", "alts": ["London's congestion charge, for example, reduced traffic in the central zone after it was introduced.", "The congestion charge in London, for instance, cut traffic in the central zone once it came into force."]}, {"p": 3, "en": "In conclusion, heavy car use damages health and wastes time through pollution, congestion and accidents.", "vi": "Tóm lại, việc sử dụng ô tô quá nhiều gây hại cho sức khỏe và lãng phí thời gian thông qua ô nhiễm, ùn tắc và tai nạn.", "alts": ["In conclusion, heavy car use harms health and wastes time through pollution, congestion and accidents.", "To conclude, excessive car use damages health and wastes time because of pollution, congestion and accidents."]}, {"p": 3, "en": "Investment in public transport, combined with charges that discourage unnecessary driving, offers the most realistic solution to a problem that affects every large city.", "vi": "Đầu tư vào giao thông công cộng, kết hợp với các loại phí ngăn việc lái xe không cần thiết, là giải pháp thực tế nhất cho một vấn đề ảnh hưởng đến mọi thành phố lớn.", "alts": ["Investment in public transport, together with charges that discourage unnecessary driving, offers the most realistic solution to a problem that affects every large city.", "Investing in public transport while charging for unnecessary driving provides the most practical solution to a problem that every big city faces."]}], "no": 12, "type": "Two-part essay", "words": 325}, {"title": "Environment", "prompt": "Regarding environmental issues, some people believe they are too vast for individuals to tackle. Conversely, others argue that these problems cannot be solved unless individuals take action. Discuss both views and give your own opinion.", "paras": ["Environmental problems such as climate change and plastic pollution seem enormous, and people disagree about whether individuals can make any real difference. I believe individual action is essential, although it needs strong support from government and business.", "Some argue that environmental problems are simply too large for individuals. A small number of industries and power stations produce a huge share of global emissions, so a household that recycles carefully or turns off lights has almost no effect on the overall total. Personal sacrifices, such as giving up flights, can also feel pointless when others keep polluting freely. Real solutions also depend on decisions that only governments and corporations can make, such as building renewable energy networks, regulating factory waste or funding public railways. A citizen cannot install a wind farm or redesign a city's transport system alone. Scientists also warn that time is short, so slow personal change may arrive too late to matter. However, these large systems respond to public demand, so treating the problem as someone else's responsibility simply delays change.", "In my view, individuals are the starting point for lasting change. Consumer choices send a message that companies cannot ignore. Companies spend heavily on market research, so any shift in what customers buy is noticed quickly. Each purchase works like a vote for the kind of production people want. When enough shoppers avoid single-use plastic or choose electric cars, supermarkets and manufacturers change their products to protect sales. Even small habits repeated by millions, such as eating less meat or using public transport, add up to a significant reduction in emissions. Citizens also drive political action. Governments introduce environmental laws when voters demand them, and public campaigns, petitions and peaceful protests have pushed many leaders to set emission targets. Without that pressure, politicians have little reason to confront powerful industries.", "In conclusion, governments and large companies control the biggest levers, but they act only when ordinary people demand it. Individuals must therefore play their part, both through daily choices and through pressure on those in power."], "sents": [{"p": 0, "en": "Environmental problems such as climate change and plastic pollution seem enormous, and people disagree about whether individuals can make any real difference.", "vi": "Các vấn đề môi trường như biến đổi khí hậu và ô nhiễm nhựa dường như quá khổng lồ, và mọi người bất đồng về việc liệu cá nhân có thể tạo ra khác biệt thực sự hay không.", "alts": ["Environmental issues like climate change and plastic pollution look overwhelming, and opinions differ on whether individuals can make a genuine difference."]}, {"p": 0, "en": "I believe individual action is essential, although it needs strong support from government and business.", "vi": "Tôi tin rằng hành động của cá nhân là thiết yếu, dù nó cần sự hỗ trợ mạnh mẽ từ chính phủ và doanh nghiệp.", "alts": ["I think personal action is vital, although it requires strong backing from governments and companies."]}, {"p": 1, "en": "Some argue that environmental problems are simply too large for individuals.", "vi": "Một số người cho rằng các vấn đề môi trường đơn giản là quá lớn so với cá nhân.", "alts": ["Some argue that environmental problems are simply too big for individuals.", "Some people claim that environmental problems are just too large for individuals to tackle."]}, {"p": 1, "en": "A small number of industries and power stations produce a huge share of global emissions, so a household that recycles carefully or turns off lights has almost no effect on the overall total.", "vi": "Một số ít ngành công nghiệp và nhà máy điện tạo ra phần lớn lượng khí thải toàn cầu, nên một hộ gia đình tái chế cẩn thận hay tắt đèn gần như không ảnh hưởng đến tổng thể.", "alts": ["A handful of industries and power stations produce a huge share of global emissions, so a household that recycles carefully or turns off lights has almost no effect on the overall total.", "A small number of industries and power plants generate an enormous share of global emissions, so a household that recycles diligently or switches off lights has almost no impact on the total."]}, {"p": 1, "en": "Personal sacrifices, such as giving up flights, can also feel pointless when others keep polluting freely.", "vi": "Những hy sinh cá nhân, như từ bỏ đi máy bay, cũng có thể thấy vô nghĩa khi người khác vẫn thoải mái xả thải.", "alts": ["Personal sacrifices, such as giving up flights, can also feel pointless when others continue to pollute freely.", "Individual sacrifices, like giving up air travel, may also seem futile when others keep polluting without restriction.", "Individual sacrifices, such as giving up flying, can also feel futile when others continue to pollute without restriction."]}, {"p": 1, "en": "Real solutions also depend on decisions that only governments and corporations can make, such as building renewable energy networks, regulating factory waste or funding public railways.", "vi": "Các giải pháp thực sự cũng phụ thuộc vào những quyết định mà chỉ chính phủ và các tập đoàn mới đưa ra được, như xây dựng mạng lưới năng lượng tái tạo, quản lý chất thải nhà máy hay đầu tư đường sắt công cộng.", "alts": ["Genuine solutions also depend on decisions that only governments and corporations can make, such as building renewable energy networks, regulating factory waste or funding public railways.", "Real solutions also rely on decisions that only governments and large companies can take, for example building renewable energy networks, controlling industrial waste or financing public railways."]}, {"p": 1, "en": "A citizen cannot install a wind farm or redesign a city's transport system alone.", "vi": "Một người dân không thể tự mình dựng một trang trại điện gió hay thiết kế lại hệ thống giao thông của cả thành phố.", "alts": ["A citizen cannot build a wind farm or redesign a city's transport system alone.", "No individual can set up a wind farm or redesign a city's transport network on their own."]}, {"p": 1, "en": "Scientists also warn that time is short, so slow personal change may arrive too late to matter.", "vi": "Các nhà khoa học cũng cảnh báo rằng thời gian không còn nhiều, nên sự thay đổi chậm chạp ở cấp cá nhân có thể đến quá muộn để có ý nghĩa.", "alts": ["Scientists also warn that time is running out, so slow personal change may come too late to matter.", "Scientists also warn that there is little time left, so gradual individual change may arrive too late to make a difference."]}, {"p": 1, "en": "However, these large systems respond to public demand, so treating the problem as someone else's responsibility simply delays change.", "vi": "Tuy nhiên, những hệ thống lớn này phản ứng với nhu cầu của công chúng, nên coi vấn đề là trách nhiệm của người khác chỉ làm chậm sự thay đổi.", "alts": ["However, these large systems respond to public demand, so treating the problem as someone else's responsibility only delays change.", "Nevertheless, these big systems react to public demand, so regarding the issue as somebody else's responsibility simply postpones change."]}, {"p": 2, "en": "In my view, individuals are the starting point for lasting change.", "vi": "Theo tôi, cá nhân là điểm khởi đầu của những thay đổi bền vững.", "alts": ["In my opinion, individuals are the starting point for lasting change.", "I believe individuals are where lasting change begins."]}, {"p": 2, "en": "Consumer choices send a message that companies cannot ignore.", "vi": "Lựa chọn của người tiêu dùng gửi đi một thông điệp mà các công ty không thể bỏ qua.", "alts": ["The choices consumers make send a message that businesses cannot disregard."]}, {"p": 2, "en": "Companies spend heavily on market research, so any shift in what customers buy is noticed quickly.", "vi": "Các công ty chi nhiều cho nghiên cứu thị trường, nên bất kỳ sự thay đổi nào trong thứ khách hàng mua đều được nhận ra nhanh chóng.", "alts": ["Businesses invest heavily in market research, so any change in customer buying habits is spotted quickly."]}, {"p": 2, "en": "Each purchase works like a vote for the kind of production people want.", "vi": "Mỗi lần mua hàng giống như một lá phiếu cho kiểu sản xuất mà mọi người mong muốn.", "alts": ["Every purchase acts as a vote for the type of production that people support."]}, {"p": 2, "en": "When enough shoppers avoid single-use plastic or choose electric cars, supermarkets and manufacturers change their products to protect sales.", "vi": "Khi đủ nhiều người mua sắm tránh đồ nhựa dùng một lần hay chọn xe điện, các siêu thị và nhà sản xuất sẽ thay đổi sản phẩm để bảo vệ doanh số.", "alts": ["If enough consumers avoid disposable plastic or buy electric cars, supermarkets and producers alter their products in order to protect their sales."]}, {"p": 2, "en": "Even small habits repeated by millions, such as eating less meat or using public transport, add up to a significant reduction in emissions.", "vi": "Ngay cả những thói quen nhỏ được hàng triệu người lặp lại, như ăn ít thịt hơn hay đi phương tiện công cộng, cộng lại cũng làm giảm đáng kể lượng khí thải.", "alts": ["Even minor habits shared by millions of people, such as eating less meat or taking public transport, add up to a major cut in emissions."]}, {"p": 2, "en": "Citizens also drive political action.", "vi": "Người dân cũng thúc đẩy hành động chính trị.", "alts": ["Ordinary people also push for political action.", "Citizens also push political action.", "Ordinary people also drive political change."]}, {"p": 2, "en": "Governments introduce environmental laws when voters demand them, and public campaigns, petitions and peaceful protests have pushed many leaders to set emission targets.", "vi": "Các chính phủ ban hành luật môi trường khi cử tri đòi hỏi, và các chiến dịch công khai, kiến nghị và biểu tình ôn hòa đã thúc đẩy nhiều nhà lãnh đạo đặt ra mục tiêu giảm phát thải.", "alts": ["Governments bring in environmental legislation when voters call for it, and public campaigns, petitions and peaceful demonstrations have pressed many leaders into setting emission targets."]}, {"p": 2, "en": "Without that pressure, politicians have little reason to confront powerful industries.", "vi": "Thiếu áp lực đó, các chính trị gia có rất ít lý do để đối đầu với những ngành công nghiệp quyền lực.", "alts": ["Without this pressure, politicians have little motivation to challenge powerful industries."]}, {"p": 3, "en": "In conclusion, governments and large companies control the biggest levers, but they act only when ordinary people demand it.", "vi": "Tóm lại, chính phủ và các tập đoàn lớn nắm những đòn bẩy lớn nhất, nhưng họ chỉ hành động khi người dân bình thường đòi hỏi.", "alts": ["To conclude, governments and big companies hold the most powerful levers, but they take action only when ordinary people insist on it."]}, {"p": 3, "en": "Individuals must therefore play their part, both through daily choices and through pressure on those in power.", "vi": "Vì vậy, mỗi cá nhân phải làm phần việc của mình, cả qua những lựa chọn hằng ngày lẫn qua việc gây áp lực lên những người nắm quyền.", "alts": ["Individuals must thus do their share, both through everyday choices and by putting pressure on those in power."]}], "no": 13, "type": "Discuss both views", "words": 339}, {"title": "Sales Methods", "prompt": "Companies use a variety of methods to improve the sales of their products. What are those methods? Which is the most effective method?", "paras": ["Businesses use many strategies to raise sales, ranging from advertising campaigns to price cuts and loyalty schemes. In my opinion, targeted online advertising is the most effective of these because it reaches the right people at a low cost.", "Companies rely on two main approaches to attract customers. Advertising is the most familiar. Television commercials, billboards and social media posts make people aware of a product and associate it with desirable qualities, such as a sports brand linking its shoes to success and fitness. Celebrity endorsements add credibility, as fans trust products used by people they admire. Price promotions are the other approach. Seasonal discounts, buy-one-get-one-free offers and loyalty cards give shoppers a reason to buy now rather than later. Limited-time deals also create urgency, since customers fear missing a bargain. A free gift can also persuade a customer to choose one brand over a similar competitor. Supermarkets, for example, hand out points that can be exchanged for vouchers, which encourages shoppers to return every week.", "Targeted online advertising is the most effective method, and its strength lies in precision and control. It reaches the right audience. Platforms collect data on age, location and interests, so a company selling running shoes can show its advert only to people who follow fitness pages. A television commercial, by contrast, is watched by millions who have no interest. It is also measurable and affordable. Businesses can see how many people clicked, visited the website or bought, and they can change the message or the budget within hours. A small dessert shop, for instance, can start with a modest daily spend and still reach local customers, something that was impossible when advertising meant buying expensive newspaper space.", "In conclusion, advertising and price promotions are the two main ways in which companies increase sales. Of these, targeted online advertising is the most effective because it combines precision with measurable results, which is why more companies move their budgets online each year."], "sents": [{"p": 0, "en": "Businesses use many strategies to raise sales, ranging from advertising campaigns to price cuts and loyalty schemes.", "vi": "Các doanh nghiệp dùng nhiều chiến lược để tăng doanh số, từ chiến dịch quảng cáo đến giảm giá và chương trình khách hàng thân thiết.", "alts": ["Companies use a wide range of strategies to boost sales, from advertising campaigns to discounts and loyalty programmes."]}, {"p": 0, "en": "In my opinion, targeted online advertising is the most effective of these because it reaches the right people at a low cost.", "vi": "Theo tôi, quảng cáo trực tuyến nhắm đúng đối tượng là cách hiệu quả nhất trong số này vì nó tiếp cận đúng người với chi phí thấp.", "alts": ["I believe targeted online advertising
