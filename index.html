ence is not a good measure of the quality of education."]}, {"p": 2, "en": "In my view, online courses weaken the quality of learning.", "vi": "Theo tôi, các khóa học trực tuyến làm giảm chất lượng học tập.", "alts": ["In my opinion, online courses reduce the quality of learning.", "I believe online courses weaken the quality of learning."]}, {"p": 2, "en": "Students lose the interaction that keeps them motivated.", "vi": "Sinh viên mất đi sự tương tác giúp họ giữ động lực.", "alts": ["Students lose the interaction that keeps them motivated.", "Students lose the interaction that helps them stay motivated."]}, {"p": 2, "en": "Without classmates and lecturers in the room, it is easy to postpone a lesson, and many learners feel isolated and eventually abandon the course.", "vi": "Khi không có bạn học và giảng viên trong phòng, rất dễ trì hoãn bài học, và nhiều người học cảm thấy cô lập rồi cuối cùng bỏ khóa học.", "alts": ["Without classmates and lecturers in the room, it is easy to put off a lesson, and many learners feel isolated and eventually give up on the course.", "When classmates and lecturers are absent, it is easy to postpone a lesson, and many learners feel isolated and in the end abandon the course."]}, {"p": 2, "en": "Dropout rates on fully online programmes are often higher than on traditional degrees.", "vi": "Tỷ lệ bỏ học ở các chương trình hoàn toàn trực tuyến thường cao hơn các chương trình đại học truyền thống.", "alts": ["Dropout rates on fully online programmes are often higher than on traditional degrees.", "Fully online programmes often have higher dropout rates than traditional degrees."]}, {"p": 2, "en": "The spontaneous question or group discussion that clarifies a difficult idea also rarely happens on a screen.", "vi": "Câu hỏi bất chợt hay buổi thảo luận nhóm giúp làm rõ một ý khó cũng hiếm khi diễn ra trên màn hình.", "alts": ["The spontaneous question or group discussion that clarifies a difficult idea also rarely takes place on a screen.", "A spontaneous question or group discussion that makes a difficult idea clear also rarely happens on a screen."]}, {"p": 2, "en": "A lecturer who notices a puzzled face can slow down and explain again, which a recording cannot do.", "vi": "Giảng viên nhận ra một gương mặt bối rối có thể chậm lại và giải thích lần nữa, điều mà một bản ghi hình không làm được.", "alts": ["A lecturer who spots a puzzled face can slow down and explain again, which a recording cannot do.", "A lecturer who sees a confused face can slow down and explain once more, something a recording cannot do."]}, {"p": 2, "en": "Practical training suffers as well.", "vi": "Việc đào tạo thực hành cũng bị ảnh hưởng.", "alts": ["Practical training also suffers.", "Practical training is affected as well."]}, {"p": 2, "en": "Subjects such as medicine, engineering and chemistry depend on laboratories, equipment and supervised practice that a video cannot reproduce.", "vi": "Các ngành như y khoa, kỹ thuật và hóa học phụ thuộc vào phòng thí nghiệm, thiết bị và thực hành có người giám sát mà video không thể tái hiện.", "alts": ["Subjects like medicine, engineering and chemistry depend on laboratories, equipment and supervised practice that a video cannot recreate.", "Subjects such as medicine, engineering and chemistry rely on laboratories, equipment and supervised practice that a video cannot replicate."]}, {"p": 2, "en": "Daily campus life also teaches teamwork and communication, qualities that employers value highly.", "vi": "Đời sống khuôn viên hằng ngày cũng dạy tinh thần làm việc nhóm và kỹ năng giao tiếp, những phẩm chất mà nhà tuyển dụng đánh giá cao.", "alts": ["Daily campus life also teaches teamwork and communication, qualities that employers value highly.", "Everyday campus life also develops teamwork and communication skills, qualities that employers value greatly."]}, {"p": 3, "en": "In conclusion, online courses give students flexibility and lower costs, but they cannot match the motivation, interaction and hands-on training of a real campus.", "vi": "Tóm lại, các khóa học trực tuyến mang lại cho sinh viên sự linh hoạt và chi phí thấp hơn, nhưng không thể sánh với động lực, sự tương tác và việc đào tạo thực hành của một khuôn viên thật.", "alts": ["In conclusion, online courses offer students flexibility and lower costs, but they cannot match the motivation, interaction and hands-on training of a real campus.", "To conclude, online courses give students flexibility and lower costs, but they cannot equal the motivation, interaction and practical training of a real campus."]}, {"p": 3, "en": "Universities should therefore treat them as a supplement rather than a replacement.", "vi": "Vì vậy, các trường đại học nên coi chúng là phần bổ sung chứ không phải sự thay thế.", "alts": ["Universities should therefore regard them as a supplement rather than a replacement.", "For this reason, universities should treat them as a supplement and not as a replacement."]}], "no": 21, "type": "Positive or negative", "words": 324}, {"title": "Women in the Police and Armed Forces", "prompt": "Some people believe that women should play an equal role as men in a country's police force or military force, while others think women are not suitable for these kinds of jobs. Discuss both views and give your opinion.", "paras": ["Opinions differ on whether women should serve alongside men in the police and the armed forces, two professions that have traditionally been dominated by men. I believe they should have an equal role, provided that every candidate meets the same standards.", "Critics of equal roles raise two concerns. Physical strength is the obvious one. Police officers and soldiers may have to restrain a violent suspect, carry an injured colleague or march long distances with heavy equipment, and on average men are stronger than women, so some argue that mixed units are less effective. Heavy body armour and equipment, which can weigh over twenty kilograms, make the gap more noticeable. Career interruptions worry them too. Pregnancy and childcare can take women away from service for long periods, which creates gaps in teams that must always be ready, and training a replacement is costly. However, strength tests can be applied equally to every applicant, and many roles in both services depend far more on skill than on muscle.", "In my view, women contribute strengths that both services need. Many duties rely on communication, negotiation and intelligence work rather than force. Female officers can be particularly effective at calming tense situations before they turn violent, and victims of domestic abuse or sexual assault may feel more comfortable reporting to a woman, which improves the quality of evidence and public trust. Women who serve as detectives, for example, can gather information from witnesses who might not speak to a male officer. Fairness and representation matter as well. A force that excludes half the population loses a large pool of talent, and a police service that reflects the community it serves is more likely to be respected and obeyed.", "In conclusion, physical demands and career breaks present genuine challenges. Even so, fair selection standards and the skills women bring make an equal role the better policy for both services and for the public they protect."], "sents": [{"p": 0, "en": "Opinions differ on whether women should serve alongside men in the police and the armed forces, two professions that have traditionally been dominated by men.", "vi": "Ý kiến khác nhau về việc phụ nữ có nên phục vụ cùng nam giới trong lực lượng cảnh sát và quân đội hay không, hai nghề xưa nay vốn do nam giới thống trị.", "alts": ["Opinions are divided on whether women should serve alongside men in the police and the armed forces, two professions that have long been dominated by men.", "People disagree about whether women should serve alongside men in the police and the military, two professions that have traditionally been male-dominated."]}, {"p": 0, "en": "I believe they should have an equal role, provided that every candidate meets the same standards.", "vi": "Tôi cho rằng họ nên có vai trò bình đẳng, miễn là mọi ứng viên đều đáp ứng cùng một tiêu chuẩn.", "alts": ["I believe that they should have an equal role, as long as every candidate meets the same standards.", "In my opinion, they should have an equal role, provided that all candidates meet the same standards."]}, {"p": 1, "en": "Critics of equal roles raise two concerns.", "vi": "Những người phản đối vai trò bình đẳng nêu ra hai mối lo.", "alts": ["Opponents of equal roles raise two concerns.", "Those who oppose equal roles have two main concerns."]}, {"p": 1, "en": "Physical strength is the obvious one.", "vi": "Sức mạnh thể chất là mối lo hiển nhiên nhất.", "alts": ["Physical strength is the most obvious one.", "The most obvious concern is physical strength."]}, {"p": 1, "en": "Police officers and soldiers may have to restrain a violent suspect, carry an injured colleague or march long distances with heavy equipment, and on average men are stronger than women, so some argue that mixed units are less effective.", "vi": "Cảnh sát và binh lính có thể phải khống chế một nghi phạm hung hãn, khiêng đồng đội bị thương hoặc hành quân quãng đường dài với trang bị nặng, mà trung bình nam giới khỏe hơn nữ giới, nên một số người cho rằng các đơn vị hỗn hợp kém hiệu quả hơn.", "alts": ["Police officers and soldiers may have to restrain a violent suspect, carry an injured colleague or march long distances with heavy equipment, and men are on average stronger than women, so some argue that mixed units are less effective.", "Police officers and soldiers may need to restrain a violent suspect, carry a wounded colleague or march long distances with heavy equipment, and because men are generally stronger than women, some argue that mixed units are less effective."]}, {"p": 1, "en": "Heavy body armour and equipment, which can weigh over twenty kilograms, make the gap more noticeable.", "vi": "Áo giáp và trang bị nặng, có thể nặng hơn hai mươi ki-lô-gam, khiến khoảng cách này rõ rệt hơn.", "alts": ["Heavy body armour and equipment, which can weigh more than twenty kilograms, make the difference more noticeable.", "Heavy body armour and equipment, which can weigh over twenty kilograms, make this gap more obvious."]}, {"p": 1, "en": "Career interruptions worry them too.", "vi": "Việc gián đoạn sự nghiệp cũng khiến họ lo ngại.", "alts": ["Career interruptions also concern them.", "They are also worried about career breaks."]}, {"p": 1, "en": "Pregnancy and childcare can take women away from service for long periods, which creates gaps in teams that must always be ready, and training a replacement is costly.", "vi": "Thai sản và việc chăm con có thể khiến phụ nữ rời vị trí phục vụ trong thời gian dài, tạo ra khoảng trống trong những đội ngũ phải luôn sẵn sàng, và việc đào tạo người thay thế rất tốn kém.", "alts": ["Pregnancy and childcare can take women away from service for long periods, which leaves gaps in teams that must always be ready, and training a replacement is expensive.", "Pregnancy and childcare can keep women out of service for long periods, which creates gaps in teams that must always be prepared, and training a replacement is costly."]}, {"p": 1, "en": "However, strength tests can be applied equally to every applicant, and many roles in both services depend far more on skill than on muscle.", "vi": "Tuy nhiên, các bài kiểm tra thể lực có thể áp dụng như nhau cho mọi ứng viên, và nhiều vị trí ở cả hai lực lượng phụ thuộc vào kỹ năng nhiều hơn hẳn so với sức mạnh cơ bắp.", "alts": ["However, strength tests can be applied equally to all applicants, and many roles in both services depend far more on skill than on physical strength.", "However, strength tests can be applied equally to every applicant, and many roles in both services rely far more on skill than on muscle."]}, {"p": 2, "en": "In my view, women contribute strengths that both services need.", "vi": "Theo tôi, phụ nữ mang lại những thế mạnh mà cả hai lực lượng đều cần.", "alts": ["In my opinion, women contribute strengths that both services need.", "I believe women bring strengths that both services need."]}, {"p": 2, "en": "Many duties rely on communication, negotiation and intelligence work rather than force.", "vi": "Nhiều nhiệm vụ dựa vào giao tiếp, đàm phán và công tác tình báo hơn là vũ lực.", "alts": ["Many duties depend on communication, negotiation and intelligence work rather than force.", "Many tasks rely on communication, negotiation and intelligence work rather than on force."]}, {"p": 2, "en": "Female officers can be particularly effective at calming tense situations before they turn violent, and victims of domestic abuse or sexual assault may feel more comfortable reporting to a woman, which improves the quality of evidence and public trust.", "vi": "Nữ sĩ quan có thể đặc biệt hiệu quả trong việc xoa dịu các tình huống căng thẳng trước khi chúng trở nên bạo lực, và nạn nhân của bạo lực gia đình hoặc tấn công tình dục có thể thấy thoải mái hơn khi trình báo với một người phụ nữ, điều này giúp nâng cao chất lượng chứng cứ và lòng tin của công chúng.", "alts": ["Female officers can be especially effective at calming tense situations before they become violent, and victims of domestic abuse or sexual assault may feel more comfortable reporting to a woman, which improves the quality of evidence and public trust.", "Female officers can be particularly good at calming tense situations before they turn violent, and victims of domestic violence or sexual assault may feel more at ease reporting to a woman, which improves the quality of evidence and public trust."]}, {"p": 2, "en": "Women who serve as detectives, for example, can gather information from witnesses who might not speak to a male officer.", "vi": "Chẳng hạn, những phụ nữ làm thám tử có thể thu thập thông tin từ những nhân chứng có thể không chịu nói chuyện với một sĩ quan nam.", "alts": ["For example, women who work as detectives can gather information from witnesses who might not speak to a male officer.", "Women who serve as detectives, for instance, can collect information from witnesses who might not talk to a male officer."]}, {"p": 2, "en": "Fairness and representation matter as well.", "vi": "Sự công bằng và tính đại diện cũng quan trọng.", "alts": ["Fairness and representation are important as well.", "Fairness and representation also matter."]}, {"p": 2, "en": "A force that excludes half the population loses a large pool of talent, and a police service that reflects the community it serves is more likely to be respected and obeyed.", "vi": "Một lực lượng loại trừ một nửa dân số sẽ mất đi nguồn nhân tài lớn, và một cơ quan cảnh sát phản ánh đúng cộng đồng mà mình phục vụ thì có nhiều khả năng được tôn trọng và tuân theo hơn.", "alts": ["A force that excludes half of the population loses a large pool of talent, and a police service that reflects the community it serves is more likely to be respected and obeyed.", "A force that shuts out half the population loses a large pool of talent, and a police service that reflects the community it serves is more likely to earn respect and obedience."]}, {"p": 3, "en": "In conclusion, physical demands and career breaks present genuine challenges.", "vi": "Tóm lại, yêu cầu về thể chất và việc gián đoạn sự nghiệp là những thách thức có thật.", "alts": ["In conclusion, physical demands and career breaks pose genuine challenges.", "To conclude, the physical demands and career breaks are genuine challenges."]}, {"p": 3, "en": "Even so, fair selection standards and the skills women bring make an equal role the better policy for both services and for the public they protect.", "vi": "Dù vậy, tiêu chuẩn tuyển chọn công bằng và những kỹ năng mà phụ nữ mang lại khiến vai trò bình đẳng trở thành chính sách tốt hơn cho cả hai lực lượng và cho công chúng mà họ bảo vệ.", "alts": ["Nevertheless, fair selection standards and the skills that women bring make an equal role the better policy for both services and for the public they protect.", "Even so, fair selection standards and the skills women bring make an equal role the better policy for both services and for the public they protect."]}], "no": 22, "type": "Discuss both views", "words": 320}, {"title": "Education and Leisure Spending", "prompt": "Some people feel that there is too much emphasis on getting an education, and that the government should spend money on leisure time activities for young people too. To what extent do you agree or disagree?", "paras": ["Some people feel that societies place too much emphasis on education and that governments should also pay for leisure activities for young people. I agree to a large extent, although education should remain a priority.", "The opposing view deserves a hearing. Education is the surest route to a good job, and countries with well-educated workforces tend to prosper. In their view, a strong curriculum builds the skills that a modern economy needs. Employers and universities mainly reward qualifications rather than hobbies, so supporters believe that public money should go to schools and universities first. Cost is the other concern. Every dollar spent on sports halls or youth clubs is a dollar not spent on teachers, laboratories or books. Spending on leisure can also be difficult to justify during an economic downturn, and families who want their children to enjoy hobbies can pay for them privately. However, a child who is exhausted and unhappy rarely learns well, and not every family can afford private clubs.", "In my view, leisure facilities deserve public support. Young people need relief from academic pressure. Long school days followed by homework and exam preparation leave little time to relax. Sport, music and art give students a healthy outlet that reduces anxiety and keeps them motivated. Students who exercise or play music regularly often return to their studies with more focus. The wider community benefits as well. Teenagers with access to a football pitch or a youth centre are less likely to drift into crime or spend long hours alone online. A youth centre also gives teenagers a safe place to meet after school, supervised by trained adults. Children from poor families, who cannot afford private lessons, gain skills and friendships that they would otherwise miss. Such activities teach cooperation and perseverance, which classrooms struggle to develop.", "In conclusion, education will always be vital for economic success. However, governments should also fund leisure activities, because they protect the wellbeing of young people and strengthen the community in the long term."], "sents": [{"p": 0, "en": "Some people feel that societies place too much emphasis on education and that governments should also pay for leisure activities for young people.", "vi": "Một số người cho rằng xã hội đặt quá nhiều trọng tâm vào giáo dục và chính phủ cũng nên chi tiền cho các hoạt động giải trí của giới trẻ.", "alts": ["Some people believe that societies put too much emphasis on education and that governments should also fund leisure activities for young people.", "Some people think that too much emphasis is placed on education and that governments should also spend money on leisure activities for young people."]}, {"p": 0, "en": "I agree to a large extent, although education should remain a priority.", "vi": "Tôi đồng ý ở mức độ lớn, dù giáo dục vẫn nên là ưu tiên.", "alts": ["I agree to a great extent, although education should remain a priority.", "I largely agree, although education should still be a priority."]}, {"p": 1, "en": "The opposing view deserves a hearing.", "vi": "Quan điểm ngược lại đáng được lắng nghe.", "alts": ["The opposing view is worth considering.", "The opposite view deserves attention."]}, {"p": 1, "en": "Education is the surest route to a good job, and countries with well-educated workforces tend to prosper.", "vi": "Giáo dục là con đường chắc chắn nhất dẫn tới một công việc tốt, và những quốc gia có lực lượng lao động được đào tạo tốt thường thịnh vượng.", "alts": ["Education is the surest way to a good job, and countries with well-educated workforces tend to prosper.", "Education is the most reliable route to a good job, and countries with a well-educated workforce tend to prosper."]}, {"p": 1, "en": "In their view, a strong curriculum builds the skills that a modern economy needs.", "vi": "Theo họ, một chương trình học vững chắc xây dựng những kỹ năng mà nền kinh tế hiện đại cần.", "alts": ["In their opinion, a strong curriculum develops the skills that a modern economy needs.", "They believe a strong curriculum builds the skills that a modern economy requires."]}, {"p": 1, "en": "Employers and universities mainly reward qualifications rather than hobbies, so supporters believe that public money should go to schools and universities first.", "vi": "Nhà tuyển dụng và các trường đại học chủ yếu coi trọng bằng cấp hơn là sở thích, nên những người ủng hộ quan điểm này cho rằng tiền công nên dành cho trường học và đại học trước.", "alts": ["Employers and universities mostly reward qualifications rather than hobbies, so supporters believe that public money should go to schools and universities first.", "Employers and universities mainly value qualifications over hobbies, so supporters argue that public funds should go first to schools and universities."]}, {"p": 1, "en": "Cost is the other concern.", "vi": "Chi phí là mối lo còn lại.", "alts": ["Cost is the other concern.", "The other concern is cost."]}, {"p": 1, "en": "Every dollar spent on sports halls or youth clubs is a dollar not spent on teachers, laboratories or books.", "vi": "Mỗi đô la chi cho nhà thi đấu hay câu lạc bộ thanh thiếu niên là một đô la không dành cho giáo viên, phòng thí nghiệm hay sách vở.", "alts": ["Every dollar spent on sports halls or youth clubs is a dollar that is not spent on teachers, laboratories or books.", "Every dollar spent on sports halls or youth clubs is a dollar taken away from teachers, laboratories or books."]}, {"p": 1, "en": "Spending on leisure can also be difficult to justify during an economic downturn, and families who want their children to enjoy hobbies can pay for them privately.", "vi": "Việc chi cho giải trí cũng có thể khó biện minh trong thời kỳ suy thoái kinh tế, và những gia đình muốn con có sở thích riêng có thể tự trả tiền.", "alts": ["Spending on leisure can also be hard to justify during an economic downturn, and families who want their children to have hobbies can pay for them privately.", "Spending on leisure can also be difficult to justify in an economic downturn, and families who want their children to enjoy hobbies can pay for them themselves."]}, {"p": 1, "en": "However, a child who is exhausted and unhappy rarely learns well, and not every family can afford private clubs.", "vi": "Tuy nhiên, một đứa trẻ kiệt sức và buồn bã hiếm khi học tốt, và không phải gia đình nào cũng đủ khả năng cho con theo học các câu lạc bộ tư.", "alts": ["However, a child who is exhausted and unhappy rarely learns well, and not every family can afford private clubs.", "Nevertheless, a child who is tired and unhappy rarely learns well, and not every family can afford private clubs."]}, {"p": 2, "en": "In my view, leisure facilities deserve public support.", "vi": "Theo tôi, các cơ sở giải trí xứng đáng nhận được sự hỗ trợ từ nhà nước.", "alts": ["In my opinion, leisure facilities deserve public support.", "I believe leisure facilities deserve support from the government."]}, {"p": 2, "en": "Young people need relief from academic pressure.", "vi": "Giới trẻ cần được giải tỏa khỏi áp lực học tập.", "alts": ["Young people need relief from the pressure of studying.", "Young people need a break from academic pressure."]}, {"p": 2, "en": "Long school days followed by homework and exam preparation leave little time to relax.", "vi": "Những ngày học dài rồi đến bài tập và ôn thi khiến các em còn rất ít thời gian thư giãn.", "alts": ["Long school days followed by homework and exam preparation leave little time to relax.", "Long school days, followed by homework and exam revision, leave little time to relax."]}, {"p": 2, "en": "Sport, music and art give students a healthy outlet that reduces anxiety and keeps them motivated.", "vi": "Thể thao, âm nhạc và hội họa mang đến cho học sinh lối thoát lành mạnh, giúp giảm lo âu và giữ động lực.", "alts": ["Sport, music and art give students a healthy outlet that lowers anxiety and keeps them motivated.", "Sport, music and art offer students a healthy outlet that reduces anxiety and keeps them motivated."]}, {"p": 2, "en": "Students who exercise or play music regularly often return to their studies with more focus.", "vi": "Những học sinh thường xuyên vận động hoặc chơi nhạc thường quay lại việc học với sự tập trung cao hơn.", "alts": ["Students who exercise or play music regularly often return to their studies with greater focus.", "Students who regularly exercise or play music often go back to their studies with more focus."]}, {"p": 2, "en": "The wider community benefits as well.", "vi": "Cộng đồng rộng hơn cũng được hưởng lợi.", "alts": ["The wider community benefits as well.", "The wider community also benefits."]}, {"p": 2, "en": "Teenagers with access to a football pitch or a youth centre are less likely to drift into crime or spend long hours alone online.", "vi": "Thanh thiếu niên có sân bóng hoặc trung tâm thanh niên để đến ít có khả năng sa vào tội phạm hay ngồi một mình trực tuyến hàng giờ.", "alts": ["Teenagers who have access to a football pitch or a youth centre are less likely to drift into crime or spend long hours alone online.", "Teenagers with access to a football pitch or a youth centre are less likely to turn to crime or spend hours alone online."]}, {"p": 2, "en": "A youth centre also gives teenagers a safe place to meet after school, supervised by trained adults.", "vi": "Một trung tâm thanh niên còn mang lại cho các em nơi an toàn để gặp gỡ sau giờ học, dưới sự giám sát của những người lớn được đào tạo.", "alts": ["A youth centre also offers teenagers a safe place to meet after school, supervised by trained adults.", "A youth centre also provides teenagers with a safe place to meet after school, under the supervision of trained adults."]}, {"p": 2, "en": "Children from poor families, who cannot afford private lessons, gain skills and friendships that they would otherwise miss.", "vi": "Trẻ em nhà nghèo, không đủ tiền học riêng, có được những kỹ năng và tình bạn mà nếu không thì các em sẽ bỏ lỡ.", "alts": ["Children from poor families, who cannot afford private lessons, develop skills and friendships that they would otherwise miss.", "Children from low-income families, who cannot afford private lessons, gain skills and friendships that they would otherwise lack."]}, {"p": 2, "en": "Such activities teach cooperation and perseverance, which classrooms struggle to develop.", "vi": "Những hoạt động như vậy dạy tinh thần hợp tác và sự kiên trì, điều mà lớp học khó bồi dưỡng được.", "alts": ["Such activities teach teamwork and perseverance, which classrooms struggle to develop.", "These activities teach cooperation and perseverance, which are hard to develop in a classroom."]}, {"p": 3, "en": "In conclusion, education will always be vital for economic success.", "vi": "Tóm lại, giáo dục sẽ luôn rất quan trọng đối với thành công kinh tế.", "alts": ["In conclusion, education will always be essential for economic success.", "To conclude, education will always be vital to economic success."]}, {"p": 3, "en": "However, governments should also fund leisure activities, because they protect the wellbeing of young people and strengthen the community in the long term.", "vi": "Tuy nhiên, chính phủ cũng nên tài trợ cho các hoạt động giải trí, vì chúng bảo vệ sức khỏe tinh thần của giới trẻ và củng cố cộng đồng về lâu dài.", "alts": ["However, governments should also fund leisure activities, because they protect the wellbeing of young people and strengthen the community in the long run.", "Nevertheless, governments should also finance leisure activities, since they protect the wellbeing of young people and strengthen the community over the long term."]}], "no": 23, "type": "Agree or disagree", "words": 333}, {"title": "Youth Unemployment", "prompt": "Today more and more young people are leaving school and unable to find jobs after graduation. What problems do you think youth unemployment will cause to the individual and society? Give reasons and make some suggestions.", "paras": ["A growing number of graduates cannot find work, and this trend affects both young people and the wider community. This essay will examine the main problems and suggest practical solutions.", "The consequences for individuals are severe, but society pays a heavy price too. A graduate without a job loses income and independence, and many are forced to live with their parents well into adulthood. Long periods of rejection damage self-confidence and may lead to anxiety or depression, while skills learnt at university fade if they are not used. Young people who delay starting a career may earn less for the rest of their working lives. For society, the costs are wide. Governments must pay more in unemployment benefits while receiving less tax. A large group of frustrated young people increases the risk of crime and social unrest. Some of the most talented even emigrate, taking their skills abroad. A country that leaves its best-educated generation idle also wastes the money it spent on their education.", "Solutions need to come from both education and the labour market. Universities should adapt their courses to the real needs of employers. If students complete internships and learn practical skills, such as data analysis or customer service, they become more attractive to companies. Countries with strong apprenticeship systems, such as Germany, show that this approach works. Such programmes also keep graduates in touch with the workplace while they search for a permanent position. Career centres can also help students prepare for interviews before they graduate. Governments can act directly as well. Tax benefits for firms that hire young graduates reduce the risk of employing inexperienced staff. Loans and training for start-ups allow ambitious graduates to create their own businesses and hire others, which opens up jobs for their peers.", "In conclusion, youth unemployment harms both the confidence of individuals and the stability of society. Closer links between education and employers, together with government incentives for hiring, offer the most practical solution."], "sents": [{"p": 0, "en": "A growing number of graduates cannot find work, and this trend affects both young people and the wider community.", "vi": "Ngày càng nhiều sinh viên tốt nghiệp không tìm được việc làm, và xu hướng này ảnh hưởng đến cả giới trẻ lẫn cộng đồng rộng hơn.", "alts": ["An increasing number of graduates cannot find jobs, and this trend affects both young people and the wider community.", "More and more graduates are unable to find work, and this trend affects young people and the wider community alike."]}, {"p": 0, "en": "This essay will examine the main problems and suggest practical solutions.", "vi": "Bài viết này sẽ xem xét những vấn đề chính và đề xuất các giải pháp thiết thực.", "alts": ["This essay will discuss the main problems and propose practical solutions.", "This essay will examine the key problems and put forward practical solutions."]}, {"p": 1, "en": "The consequences for individuals are severe, but society pays a heavy price too.", "vi": "Hậu quả đối với cá nhân là nghiêm trọng, nhưng xã hội cũng phải trả một cái giá đắt.", "alts": ["The consequences for individuals are serious, but society pays a heavy price as well.", "The effects on individuals are severe, but society also pays a high price."]}, {"p": 1, "en": "A graduate without a job loses income and independence, and many are forced to live with their parents well into adulthood.", "vi": "Một sinh viên tốt nghiệp không có việc làm mất thu nhập và sự độc lập, và nhiều người buộc phải sống với bố mẹ đến tận tuổi trưởng thành.", "alts": ["A graduate without a job loses income and independence, and many have to live with their parents well into adulthood.", "A jobless graduate loses income and independence, and many are forced to live with their parents well into adulthood."]}, {"p": 1, "en": "Long periods of rejection damage self-confidence and may lead to anxiety or depression, while skills learnt at university fade if they are not used.", "vi": "Những giai đoạn bị từ chối kéo dài làm tổn hại sự tự tin và có thể dẫn đến lo âu hoặc trầm cảm, trong khi những kỹ năng học ở đại học mai một nếu không được sử dụng.", "alts": ["Long periods of rejection damage self-confidence and can lead to anxiety or depression, while skills learnt at university fade if they are not used.", "Prolonged rejection damages self-confidence and may cause anxiety or depression, while skills learnt at university fade when they are not put to use."]}, {"p": 1, "en": "Young people who delay starting a career may earn less for the rest of their working lives.", "vi": "Những người trẻ trì hoãn việc bắt đầu sự nghiệp có thể kiếm được ít hơn trong suốt quãng đời làm việc còn lại.", "alts": ["Young people who delay starting a career may earn less throughout their working lives.", "Those who put off starting a career may earn less for the rest of their working lives."]}, {"p": 1, "en": "For society, the costs are wide.", "vi": "Đối với xã hội, những chi phí là rất lớn.", "alts": ["For society, the costs are wide-ranging.", "For society, the costs are considerable."]}, {"p": 1, "en": "Governments must pay more in unemployment benefits while receiving less tax.", "vi": "Chính phủ phải chi nhiều hơn cho trợ cấp thất nghiệp trong khi thu được ít thuế hơn.", "alts": ["Governments must spend more on unemployment benefits while receiving less tax.", "Governments have to pay more in unemployment benefits while collecting less tax."]}, {"p": 1, "en": "A large group of frustrated young people increases the risk of crime and social unrest.", "vi": "Một nhóm đông thanh niên bức bối làm tăng nguy cơ tội phạm và bất ổn xã hội.", "alts": ["A large group of frustrated young people raises the risk of crime and social unrest.", "A large number of frustrated young people increases the risk of crime and social unrest."]}, {"p": 1, "en": "Some of the most talented even emigrate, taking their skills abroad.", "vi": "Một số người tài năng nhất thậm chí di cư, mang kỹ năng của mình ra nước ngoài.", "alts": ["Some of the most talented even emigrate, taking their skills overseas.", "Some of the most talented young people even emigrate and take their skills abroad."]}, {"p": 1, "en": "A country that leaves its best-educated generation idle also wastes the money it spent on their education.", "vi": "Một quốc gia để thế hệ có học vấn cao nhất của mình ngồi không cũng lãng phí số tiền đã bỏ ra để đào tạo họ.", "alts": ["A country that leaves its best-educated generation without work also wastes the money it spent on their education.", "A country that leaves its most educated generation idle also wastes the money it invested in their education."]}, {"p": 2, "en": "Solutions need to come from both education and the labour market.", "vi": "Các giải pháp cần đến từ cả giáo dục lẫn thị trường lao động.", "alts": ["Solutions need to come from both education and the labour market.", "Solutions must come from both the education system and the labour market."]}, {"p": 2, "en": "Universities should adapt their courses to the real needs of employers.", "vi": "Các trường đại học nên điều chỉnh chương trình cho phù hợp với nhu cầu thực tế của nhà tuyển dụng.", "alts": ["Universities should adapt their courses to the real needs of employers.", "Universities should adjust their courses to meet the real needs of employers."]}, {"p": 2, "en": "If students complete internships and learn practical skills, such as data analysis or customer service, they become more attractive to companies.", "vi": "Nếu sinh viên hoàn thành thực tập và học các kỹ năng thực hành, chẳng hạn phân tích dữ liệu hay chăm sóc khách hàng, họ sẽ hấp dẫn hơn với các công ty.", "alts": ["If students complete internships and learn practical skills, such as data analysis or customer service, they become more attractive to employers.", "If students do internships and acquire practical skills, such as data analysis or customer service, they will be more attractive to companies."]}, {"p": 2, "en": "Countries with strong apprenticeship systems, such as Germany, show that this approach works.", "vi": "Những quốc gia có hệ thống học nghề mạnh, chẳng hạn Đức, cho thấy cách tiếp cận này hiệu quả.", "alts": ["Countries with strong apprenticeship systems, such as Germany, show that this approach is effective.", "Countries with well-developed apprenticeship systems, such as Germany, prove that this approach works."]}, {"p": 2, "en": "Such programmes also keep graduates in touch with the workplace while they search for a permanent position.", "vi": "Những chương trình như vậy cũng giúp sinh viên tốt nghiệp giữ liên hệ với môi trường làm việc trong lúc tìm một vị trí chính thức.", "alts": ["Such programmes also keep graduates in contact with the workplace while they look for a permanent position.", "These programmes also help graduates stay in touch with the workplace while they search for a permanent job."]}, {"p": 2, "en": "Career centres can also help students prepare for interviews before they graduate.", "vi": "Các trung tâm hướng nghiệp cũng có thể giúp sinh viên chuẩn bị phỏng vấn trước khi tốt nghiệp.", "alts": ["Career centres can also help students prepare for interviews before they graduate.", "Career centres can also prepare students for job interviews before graduation."]}, {"p": 2, "en": "Governments can act directly as well.", "vi": "Chính phủ cũng có thể hành động trực tiếp.", "alts": ["Governments can also take direct action.", "Governments can take direct steps as well."]}, {"p": 2, "en": "Tax benefits for firms that hire young graduates reduce the risk of employing inexperienced staff.", "vi": "Ưu đãi thuế cho các doanh nghiệp tuyển sinh viên mới tốt nghiệp làm giảm rủi ro khi thuê nhân sự thiếu kinh nghiệm.", "alts": ["Tax benefits for firms that hire young graduates reduce the risk of taking on inexperienced staff.", "Tax incentives for companies that hire young graduates lower the risk of employing inexperienced workers."]}, {"p": 2, "en": "Loans and training for start-ups allow ambitious graduates to create their own businesses and hire others, which opens up jobs for their peers.", "vi": "Khoản vay và đào tạo cho các công ty khởi nghiệp giúp những sinh viên tốt nghiệp đầy hoài bão tự lập doanh nghiệp và thuê thêm người khác, qua đó mở ra việc làm cho bạn bè đồng trang lứa.", "alts": ["Loans and training for start-ups enable ambitious graduates to set up their own businesses and employ others, which creates jobs for their peers.", "Loans and training for start-ups allow ambitious graduates to create their own businesses and hire others, which opens up jobs for their peers."]}, {"p": 3, "en": "In conclusion, youth unemployment harms both the confidence of individuals and the stability of society.", "vi": "Tóm lại, thất nghiệp ở giới trẻ làm tổn hại cả sự tự tin của mỗi cá nhân lẫn sự ổn định của xã hội.", "alts": ["In conclusion, youth unemployment damages both the confidence of individuals and the stability of society.", "To conclude, youth unemployment harms both the confidence of individuals and the stability of society."]}, {"p": 3, "en": "Closer links between education and employers, together with government incentives for hiring, offer the most practical solution.", "vi": "Mối liên kết chặt chẽ hơn giữa giáo dục và nhà tuyển dụng, cùng các biện pháp khuyến khích tuyển dụng của chính phủ, là giải pháp thiết thực nhất.", "alts": ["Closer links between education and employers, together with government incentives for hiring, offer the most practical solution.", "Stronger links between education and employers, combined with government incentives for hiring, provide the most practical solution."]}], "no": 24, "type": "Two-part essay", "words": 326}, {"title": "Protecting Endangered Animals", "prompt": "Many animals are endangered, some people argue that we should only protect animals that are useful to human. To what extent do you agree or disagree?", "paras": ["As many animal species face extinction, some people argue that protection should be limited to those that benefit humans, such as animals that provide food or medicine. I disagree with this view, since every species plays a part in keeping nature healthy.", "Conservation budgets are limited, so supporters argue that money should go to animals that provide food, medicine or income from tourism, such as bees, fish or elephants that attract visitors. Protecting a pollinator that sustains farm crops, for example, pays for itself many times over. Spreading the same funds across hundreds of species with no obvious benefit is, in their view, a waste of money. Animals that harm people are an even harder case to defend. Wolves kill livestock, wild boar destroy crops and mosquitoes spread disease, imposing real costs on farmers and poor communities. Supporters therefore ask why scarce public money should shield the species that actively harm people. However, this approach depends on a narrow and shortsighted idea of what counts as useful.", "In my view, protection must be based on the health of whole ecosystems. Species depend on one another, so a creature that seems worthless to humans may feed others, spread seeds or control pests. When predators or insects disappear, the effects spread through the food chain to farms and fisheries that people rely on every day. Coral reefs, for instance, shelter thousands of unremarkable species, yet whole fishing industries depend on them. Our judgement of usefulness is also unreliable, because many modern medicines come from plants and animals that were once considered worthless. Drugs for high blood pressure, for example, were developed from the venom of a snake. A species lost today may therefore have held a cure that scientists have not yet discovered.", "In conclusion, limited funds and the interests of local communities are valid concerns. Nevertheless, protecting only useful animals would damage ecosystems and destroy species whose value we cannot yet judge."], "sents": [{"p": 0, "en": "As many animal species face extinction, some people argue that protection should be limited to those that benefit humans, such as animals that provide food or medicine.", "vi": "Khi nhiều loài động vật đứng trước nguy cơ tuyệt chủng, một số người cho rằng việc bảo vệ nên giới hạn ở những loài có lợi cho con người, chẳng hạn các loài cung cấp thực phẩm hoặc thuốc.", "alts": ["As many animal species face extinction, some people argue that protection should be restricted to those that benefit humans, such as animals that provide food or medicine.", "With so many animal species facing extinction, some people argue that only those that benefit humans, such as animals that provide food or medicine, should be protected."]}, {"p": 0, "en": "I disagree with this view, since every species plays a part in keeping nature healthy.", "vi": "Tôi không đồng ý với quan điểm này, vì mỗi loài đều đóng một vai trò trong việc giữ cho thiên nhiên khỏe mạnh.", "alts": ["I disagree with this view, because every species plays a part in keeping nature healthy.", "I do not agree with this view, since every species has a role in keeping nature healthy."]}, {"p": 1, "en": "Conservation budgets are limited, so supporters argue that money should go to animals that provide food, medicine or income from tourism, such as bees, fish or elephants that attract visitors.", "vi": "Ngân sách bảo tồn có hạn, nên những người ủng hộ cho rằng tiền nên dành cho các loài cung cấp thực phẩm, thuốc hoặc thu nhập từ du lịch, chẳng hạn ong, cá hay voi thu hút du khách.", "alts": ["Conservation funding is limited, so supporters argue that money should go to animals that supply food, medicine or tourist income, such as bees, fish or elephants that attract visitors.", "Budgets for conservation are limited, so supporters believe the money should be spent on animals that provide food, medicine or income from tourism, such as bees, fish or elephants that draw visitors."]}, {"p": 1, "en": "Protecting a pollinator that sustains farm crops, for example, pays for itself many times over.", "vi": "Chẳng hạn, bảo vệ một loài thụ phấn nuôi sống cây trồng sẽ mang lại giá trị gấp nhiều lần chi phí bỏ ra.", "alts": ["Protecting a pollinator that sustains farm crops, for instance, repays its cost many times over.", "Protecting an insect that pollinates farm crops, for example, pays for itself many times over."]}, {"p": 1, "en": "Spreading the same funds across hundreds of species with no obvious benefit is, in their view, a waste of money.", "vi": "Theo họ, dàn trải cùng khoản tiền đó cho hàng trăm loài không có lợi ích rõ ràng là lãng phí tiền bạc.", "alts": ["In their view, dividing the same funds among hundreds of species with no clear benefit is a waste of money.", "They believe that spreading the same money across hundreds of species that bring no obvious benefit is wasteful."]}, {"p": 1, "en": "Animals that harm people are an even harder case to defend.", "vi": "Những loài gây hại cho con người còn khó bênh vực hơn nữa.", "alts": ["Animals that harm people are an even harder case to justify.", "Species that harm humans are even harder to defend."]}, {"p": 1, "en": "Wolves kill livestock, wild boar destroy crops and mosquitoes spread disease, imposing real costs on farmers and poor communities.", "vi": "Sói giết gia súc, lợn rừng phá hoại mùa màng và muỗi truyền bệnh, gây ra những tổn thất thật sự cho nông dân và các cộng đồng nghèo.", "alts": ["Wolves kill livestock, wild boar ruin crops and mosquitoes spread disease, imposing genuine costs on farmers and poor communities.", "Wolves kill livestock, wild boar destroy harvests and mosquitoes spread disease, which places real costs on farmers and poor communities."]}, {"p": 1, "en": "Supporters therefore ask why scarce public money should shield the species that actively harm people.", "vi": "Vì vậy, những người ủng hộ đặt câu hỏi vì sao tiền công khan hiếm lại phải che chở cho những loài đang chủ động gây hại cho con người.", "alts": ["Supporters therefore ask why scarce public money should protect the species that actively harm people.", "For this reason, supporters question why limited public funds should be used to shield species that actively harm people."]}, {"p": 1, "en": "However, this approach depends on a narrow and shortsighted idea of what counts as useful.", "vi": "Tuy nhiên, cách tiếp cận này dựa trên một quan niệm hẹp hòi và thiển cận về điều gì được coi là có ích.", "alts": ["However, this approach relies on a narrow and shortsighted view of what counts as useful.", "Nevertheless, this approach depends on a narrow and short-sighted idea of what is useful."]}, {"p": 2, "en": "In my view, protection must be based on the health of whole ecosystems.", "vi": "Theo tôi, việc bảo vệ phải dựa trên sức khỏe của toàn bộ hệ sinh thái.", "alts": ["In my opinion, protection must be based on the health of whole ecosystems.", "I believe protection should be based on the health of entire ecosystems."]}, {"p": 2, "en": "Species depend on one another, so a creature that seems worthless to humans may feed others, spread seeds or control pests.", "vi": "Các loài phụ thuộc vào nhau, nên một sinh vật có vẻ vô giá trị với con người có thể làm thức ăn cho loài khác, phát tán hạt giống hoặc kiểm soát sâu bọ.", "alts": ["Species rely on one another, so an animal that appears useless to humans may feed other animals, disperse seeds or keep pests under control.", "Species depend on each other, so a creature that seems worthless to people may feed others, spread seeds or control pests."]}, {"p": 2, "en": "When predators or insects disappear, the effects spread through the food chain to farms and fisheries that people rely on every day.", "vi": "Khi các loài săn mồi hoặc côn trùng biến mất, tác động lan qua chuỗi thức ăn đến những trang trại và ngư trường mà con người dựa vào mỗi ngày.", "alts": ["When predators or insects disappear, the effects spread through the food chain to farms and fisheries that people depend on every day.", "When predators or insects vanish, the consequences travel through the food chain to farms and fisheries that people rely on daily."]}, {"p": 2, "en": "Coral reefs, for instance, shelter thousands of unremarkable species, yet whole fishing industries depend on them.", "vi": "Chẳng hạn, rạn san hô che chở hàng nghìn loài không nổi bật, nhưng cả ngành đánh bắt cá phụ thuộc vào chúng.", "alts": ["Coral reefs, for example, shelter thousands of unremarkable species, yet whole fishing industries depend on them.", "Coral reefs, for instance, are home to thousands of unremarkable species, but entire fishing industries rely on them."]}, {"p": 2, "en": "Our judgement of usefulness is also unreliable, because many modern medicines come from plants and animals that were once considered worthless.", "vi": "Sự đánh giá của chúng ta về tính hữu ích cũng không đáng tin cậy, vì nhiều loại thuốc hiện đại đến từ những loài thực vật và động vật từng bị coi là vô dụng.", "alts": ["Our judgement of what is useful is also unreliable, since many modern medicines are derived from plants and animals that were once regarded as worthless.", "Our ability to judge usefulness is also unreliable, because many modern medicines come from plants and animals that were once seen as worthless."]}, {"p": 2, "en": "Drugs for high blood pressure, for example, were developed from the venom of a snake.", "vi": "Chẳng hạn, các loại thuốc điều trị cao huyết áp được phát triển từ nọc độc của một loài rắn.", "alts": ["Drugs for high blood pressure, for instance, were developed from the venom of a snake.", "Medicines for high blood pressure, for example, were developed from snake venom."]}, {"p": 2, "en": "A species lost today may therefore have held a cure that scientists have not yet discovered.", "vi": "Vì vậy, một loài biến mất ngày nay có thể đã nắm giữ một phương thuốc mà các nhà khoa học chưa khám phá ra.", "alts": ["A species lost today may therefore have held a cure that scientists have not yet discovered.", "A species that disappears today may therefore have contained a cure that scientists have yet to discover."]}, {"p": 3, "en": "In conclusion, limited funds and the interests of local communities are valid concerns.", "vi": "Tóm lại, nguồn quỹ hạn chế và lợi ích của các cộng đồng địa phương là những mối quan ngại chính đáng.", "alts": ["In conclusion, limited funds and the interests of local communities are valid concerns.", "To conclude, limited funding and the interests of local communities are legitimate concerns."]}, {"p": 3, "en": "Nevertheless, protecting only useful animals would damage ecosystems and destroy species whose value we cannot yet judge.", "vi": "Tuy nhiên, chỉ bảo vệ những loài có ích sẽ làm tổn hại hệ sinh thái và hủy diệt những loài mà giá trị của chúng ta chưa thể đánh giá.", "alts": ["Nevertheless, protecting only useful animals would damage ecosystems and destroy species whose value we cannot yet judge.", "However, protecting only useful animals would harm ecosystems and wipe out species whose value we cannot yet assess."]}], "no": 25, "type": "Agree or disagree", "words": 321}, {"title": "Climate Change and Business", "prompt": "Some people think that climate change could have a negative effect on business. Other people think that climate change could create more business opportunities. Discuss both views and give your own opinion.", "paras": ["Climate change is usually described as a threat, but some people argue that it also opens new markets for companies. I believe the risks to business are greater than the opportunities, although the latter should not be ignored.", "Optimists see the strongest opportunity in clean technology, where demand is growing fast. Manufacturers of solar panels, wind turbines and electric vehicles have seen sales rise as governments and households try to cut emissions. Engineers and consultants specialising in energy efficiency are also finding steady work as companies try to cut their energy bills. Adaptation to a changing climate creates further markets. Companies that build flood barriers, design heat-resistant crops or sell air conditioning and water-saving equipment gain customers precisely because the climate is changing. Insurers and banks are likewise developing new products to help firms manage climate risk. However, these gains are concentrated in a few sectors and are often far smaller than the losses suffered elsewhere in the economy.", "In my view, the damage to business is more widespread. Extreme weather disrupts normal business operations on a large scale. Floods, storms and droughts destroy factories and farmland, close ports and break supply chains, which means that a single hurricane can halt production for weeks and leave shops without stock. Agriculture and tourism are particularly exposed, since farmers depend on predictable rain and ski resorts on reliable snow. Compliance and insurance costs are climbing as well. Insurers raise premiums or refuse cover in high-risk areas, while carbon taxes and stricter emissions rules force companies to spend heavily on new equipment. Small firms, which have fewer reserves than large corporations, struggle most to absorb these expenses, and some are forced to close after a single disaster.", "In conclusion, climate change does create profitable openings for firms in clean energy and adaptation. Even so, the physical damage and rising costs it imposes on most industries make it a greater danger than a benefit."], "sents": [{"p": 0, "en": "Climate change is usually described as a threat, but some people argue that it also opens new markets for companies.", "vi": "Biến đổi khí hậu thường được mô tả là một mối đe dọa, nhưng một số người cho rằng nó cũng mở ra những thị trường mới cho doanh nghiệp.", "alts": ["Climate change is often described as a threat, but some people argue that it also opens up new markets for businesses.", "Climate change is usually seen as a threat, yet some people claim that it also creates new markets for companies."]}, {"p": 0, "en": "I believe the risks to business are greater than the opportunities, although the latter should not be ignored.", "vi": "Tôi cho rằng rủi ro đối với kinh doanh lớn hơn cơ hội, dù không nên bỏ qua những cơ hội đó.", "alts": ["I believe the risks to business outweigh the opportunities, although the opportunities should not be ignored.", "In my opinion, the risks to business are greater than the opportunities, although the latter should not be overlooked."]}, {"p": 1, "en": "Optimists see the strongest opportunity in clean technology, where demand is growing fast.", "vi": "Những người lạc quan thấy cơ hội lớn nhất nằm ở công nghệ sạch, nơi nhu cầu đang tăng nhanh.", "alts": ["Optimists see the biggest opportunity in clean technology, where demand is rising quickly.", "Optimists see the greatest opportunity in clean technology, where demand is growing rapidly."]}, {"p": 1, "en": "Manufacturers of solar panels, wind turbines and electric vehicles have seen sales rise as governments and households try to cut emissions.", "vi": "Các nhà sản xuất tấm pin mặt trời, tua-bin gió và xe điện đã ghi nhận doanh số tăng khi chính phủ và các hộ gia đình tìm cách cắt giảm khí thải.", "alts": ["Manufacturers of solar panels, wind turbines and electric vehicles have seen their sales rise as governments and households try to reduce emissions.", "Producers of solar panels, wind turbines and electric cars have recorded higher sales as governments and households try to cut emissions."]}, {"p": 1, "en": "Engineers and consultants specialising in energy efficiency are also finding steady work as companies try to cut their energy bills.", "vi": "Các kỹ sư và nhà tư vấn chuyên về hiệu quả năng lượng cũng có công việc ổn định khi các công ty tìm cách giảm hóa đơn năng lượng.", "alts": ["Engineers and consultants who specialise in energy efficiency are also finding steady work as companies try to reduce their energy bills.", "Engineers and consultants specialising in energy efficiency are also in steady demand as companies try to lower their energy costs."]}, {"p": 1, "en": "Adaptation to a changing climate creates further markets.", "vi": "Việc thích ứng với khí hậu thay đổi tạo ra thêm những thị trường mới.", "alts": ["Adapting to a changing climate creates further markets.", "Adaptation to climate change creates additional markets."]}, {"p": 1, "en": "Companies that build flood barriers, design heat-resistant crops or sell air conditioning and water-saving equipment gain customers precisely because the climate is changing.", "vi": "Những công ty xây đê chắn lũ, thiết kế giống cây chịu nhiệt hoặc bán máy lạnh và thiết bị tiết kiệm nước có thêm khách hàng chính vì khí hậu đang thay đổi.", "alts": ["Companies that build flood barriers, develop heat-resistant crops or sell air conditioning and water-saving equipment win customers precisely because the climate is changing.", "Firms that build flood defences, design heat-tolerant crops or sell air conditioning and water-saving equipment gain customers precisely because the climate is changing."]}, {"p": 1, "en": "Insurers and banks are likewise developing new products to help firms manage climate risk.", "vi": "Các công ty bảo hiểm và ngân hàng cũng đang phát triển những sản phẩm mới giúp doanh nghiệp quản lý rủi ro khí hậu.", "alts": ["Insurers and banks are also developing new products to help companies manage climate risk.", "Insurers and banks are likewise creating new products to help businesses manage climate-related risk."]}, {"p": 1, "en": "However, these gains are concentrated in a few sectors and are often far smaller than the losses suffered elsewhere in the economy.", "vi": "Tuy nhiên, những lợi ích này tập trung ở một vài ngành và thường nhỏ hơn nhiều so với những tổn thất ở các lĩnh vực khác của nền kinh tế.", "alts": ["However, these gains are concentrated in a few sectors and are often much smaller than the losses suffered elsewhere in the economy.", "However, these benefits are limited to a few sectors and are frequently far smaller than the losses felt in the rest of the economy."]}, {"p": 2, "en": "In my view, the damage to business is more widespread.", "vi": "Theo tôi, thiệt hại đối với kinh doanh lan rộng hơn.", "alts": ["In my opinion, the damage to business is more widespread.", "I believe the harm to business is more widespread."]}, {"p": 2, "en": "Extreme weather disrupts normal business operations on a large scale.", "vi": "Thời tiết cực đoan làm gián đoạn hoạt động kinh doanh bình thường trên quy mô lớn.", "alts": ["Extreme weather disrupts normal business operations on a large scale.", "Extreme weather interrupts normal business activity on a large scale."]}, {"p": 2, "en": "Floods, storms and droughts destroy factories and farmland, close ports and break supply chains, which means that a single hurricane can halt production for weeks and leave shops without stock.", "vi": "Lũ lụt, bão và hạn hán phá hủy nhà máy và đất canh tác, đóng cửa các cảng và làm đứt gãy chuỗi cung ứng, nghĩa là một cơn bão duy nhất có thể làm đình trệ sản xuất hàng tuần và khiến các cửa hàng hết hàng.", "alts": ["Floods, storms and droughts destroy factories and farmland, close ports and break supply chains, which means that a single hurricane can halt production for weeks and leave shops without stock.", "Floods, storms and droughts wreck factories and farmland, shut ports and break supply chains, so that one hurricane can stop production for weeks and leave shops without stock."]}, {"p": 2, "en": "Agriculture and tourism are particularly exposed, since farmers depend on predictable rain and ski resorts on reliable snow.", "vi": "Nông nghiệp và du lịch đặc biệt dễ bị ảnh hưởng, vì nông dân phụ thuộc vào lượng mưa ổn định còn các khu trượt tuyết phụ thuộc vào tuyết đáng tin cậy.", "alts": ["Agriculture and tourism are especially exposed, since farmers depend on predictable rain and ski resorts on reliable snow.", "Agriculture and tourism are particularly vulnerable, because farmers depend on predictable rainfall and ski resorts on reliable snow."]}, {"p": 2, "en": "Compliance and insurance costs are climbing as well.", "vi": "Chi phí tuân thủ và bảo hiểm cũng đang tăng lên.", "alts": ["Compliance and insurance costs are rising as well.", "The costs of compliance and insurance are also climbing."]}, {"p": 2, "en": "Insurers raise premiums or refuse cover in high-risk areas, while carbon taxes and stricter emissions rules force companies to spend heavily on new equipment.", "vi": "Các hãng bảo hiểm tăng phí hoặc từ chối bảo hiểm ở những khu vực rủi ro cao, trong khi thuế carbon và các quy định khí thải khắt khe hơn buộc doanh nghiệp phải chi mạnh cho thiết bị mới.", "alts": ["Insurers raise premiums or refuse cover in high-risk areas, while carbon taxes and stricter emissions rules force companies to spend heavily on new equipment.", "Insurers increase premiums or decline cover in high-risk areas, while carbon taxes and tougher emissions rules force firms to invest heavily in new equipment."]}, {"p": 2, "en": "Small firms, which have fewer reserves than large corporations, struggle most to absorb these expenses, and some are forced to close after a single disaster.", "vi": "Các doanh nghiệp nhỏ, vốn có ít nguồn dự trữ hơn các tập đoàn lớn, chịu khó khăn nhất khi gánh những khoản chi này, và một số buộc phải đóng cửa sau một thảm họa duy nhất.", "alts": ["Small firms, which have fewer reserves than large corporations, struggle most to absorb these expenses, and some are forced to close after a single disaster.", "Small businesses, which have smaller reserves than large corporations, find it hardest to absorb these costs, and some have to close after a single disaster."]}, {"p": 3, "en": "In conclusion, climate change does create profitable openings for firms in clean energy and adaptation.", "vi": "Tóm lại, biến đổi khí hậu quả thực tạo ra những cơ hội sinh lời cho các doanh nghiệp trong lĩnh vực năng lượng sạch và thích ứng.", "alts": ["In conclusion, climate change does create profitable openings for firms in clean energy and adaptation.", "To conclude, climate change does create profitable opportunities for companies in clean energy and adaptation."]}, {"p": 3, "en": "Even so, the physical damage and rising costs it imposes on most industries make it a greater danger than a benefit.", "vi": "Dù vậy, thiệt hại vật chất và chi phí gia tăng mà nó gây ra cho phần lớn các ngành khiến nó là mối nguy lớn hơn là lợi ích.", "alts": ["Even so, the physical damage and rising costs it imposes on most industries make it a greater danger than a benefit.", "Nevertheless, the physical damage and higher costs it causes in most industries make it more of a danger than a benefit."]}], "no": 26, "type": "Discuss both views", "words": 320}, {"title": "Copying and Fashion", "prompt": "The tendency for human beings to copy one another is shown in the popularity of fashion in clothes and consumer goods. Do you agree or disagree?", "paras": ["Fashions in clothes and consumer goods spread quickly from person to person, which suggests that humans have a natural tendency to imitate one another. I agree with this view, because the desire to belong and the influence of the media shape most of what we buy.", "Some people believe that purchases reflect personal taste, as many shoppers value individuality and deliberately avoid whatever is popular. A person who wears second-hand clothes or creates a distinctive style is trying to stand out from the crowd rather than blend into it. Entire subcultures, such as punk or gothic fashion, began as a rejection of mainstream trends, with followers who often design or alter their own clothes. Practical considerations guide purchases too. Price, comfort, quality and climate often decide what people buy, especially when household budgets are tight. A parent choosing school shoes or a commuter buying a coat is thinking about use rather than imitation. However, even people who claim to be different usually end up forming small groups with a shared look and unwritten rules.", "In my view, imitation is deeply rooted in human behaviour. The need to belong drives much of what people choose to buy and wear, because being different can feel risky. Children and teenagers fear being excluded, so they adopt the brands, phones or hairstyles of their classmates. Adults copy the style of their colleagues to be accepted at work, and sports fans wear their team's shirt without seeing it as imitation. Media and technology then speed the process up. Celebrities and online influencers display products to millions of followers, while advertising presents a particular look as normal. Social networks allow a new trend to travel around the world within days, turning a single idea into a global craze before most people have time to decide whether they like it.", "In conclusion, personal taste and practical needs do influence what people buy. Nevertheless, the desire to belong and the power of the media show that humans have a strong tendency to copy one another."], "sents": [{"p": 0, "en": "Fashions in clothes and consumer goods spread quickly from person to person, which suggests that humans have a natural tendency to imitate one another.", "vi": "Các xu hướng thời trang và hàng tiêu dùng lan nhanh từ người này sang người khác, cho thấy con người có xu hướng bắt chước nhau một cách tự nhiên.", "alts": ["Fashions in clothing and consumer goods spread rapidly from person to person, which suggests that humans have a natural tendency to imitate each other.", "Trends in clothes and consumer goods pass quickly from one person to another, suggesting that people naturally tend to copy one another."]}, {"p": 0, "en": "I agree with this view, because the desire to belong and the influence of the media shape most of what we buy.", "vi": "Tôi đồng ý với quan điểm này, vì mong muốn được thuộc về một nhóm và ảnh hưởng của truyền thông định hình phần lớn những gì chúng ta mua.", "alts": ["I agree with this view, since the desire to belong and the influence of the media shape most of what we buy.", "I agree with this opinion, because the wish to belong and media influence shape most of our purchases."]}, {"p": 1, "en": "Some people believe that purchases reflect personal taste, as many shoppers value individuality and deliberately avoid whatever is popular.", "vi": "Một số người cho rằng việc mua sắm phản ánh sở thích cá nhân, vì nhiều người mua coi trọng cá tính và cố ý tránh những thứ đang phổ biến.", "alts": ["Some people believe that purchases reflect personal taste, since many shoppers value individuality and deliberately avoid whatever is popular.", "Some people think that what we buy reflects our personal taste, as many shoppers value individuality and consciously avoid popular items."]}, {"p": 1, "en": "A person who wears second-hand clothes or creates a distinctive style is trying to stand out from the crowd rather than blend into it.", "vi": "Một người mặc đồ cũ hoặc tạo ra phong cách riêng đang cố nổi bật giữa đám đông thay vì hòa lẫn vào đó.", "alts": ["A person who wears second-hand clothes or develops a distinctive style is trying to stand out from the crowd rather than blend in.", "Someone who wears second-hand clothes or creates a distinctive look is trying to stand out from the crowd instead of blending into it."]}, {"p": 1, "en": "Entire subcultures, such as punk or gothic fashion, began as a rejection of mainstream trends, with followers who often design or alter their own clothes.", "vi": "Cả những nhóm văn hóa phụ như thời trang punk hay gothic bắt đầu như một sự bác bỏ các xu hướng chủ đạo, với những người theo đuổi thường tự thiết kế hoặc chỉnh sửa quần áo của mình.", "alts": ["Entire subcultures, such as punk or gothic fashion, began as a rejection of mainstream trends, with followers who often design or alter their own clothes.", "Whole subcultures, such as punk or gothic fashion, started as a rejection of mainstream trends, and their followers often design or modify their own clothes."]}, {"p": 1, "en": "Practical considerations guide purchases too.", "vi": "Những cân nhắc thực tế cũng chi phối việc mua sắm.", "alts": ["Practical considerations also influence purchases.", "Practical considerations play a role in purchases too."]}, {"p": 1, "en": "Price, comfort, quality and climate often decide what people buy, especially when household budgets are tight.", "vi": "Giá cả, sự thoải mái, chất lượng và khí hậu thường quyết định người ta mua gì, nhất là khi ngân sách gia đình eo hẹp.", "alts": ["Price, comfort, quality and climate often determine what people buy, especially when household budgets are tight.", "Price, comfort, quality and weather often decide what people purchase, particularly when household budgets are tight."]}, {"p": 1, "en": "A parent choosing school shoes or a commuter buying a coat is thinking about use rather than imitation.", "vi": "Một phụ huynh chọn giày đi học hay một người đi làm mua áo khoác đang nghĩ đến công dụng chứ không phải bắt chước.", "alts": ["A parent choosing school shoes or a commuter buying a coat is thinking about use rather than imitation.", "A parent who picks school shoes or a commuter who buys a coat is thinking about practicality rather than copying others."]}, {"p": 1, "en": "However, even people who claim to be different usually end up forming small groups with a shared look and unwritten rules.", "vi": "Tuy nhiên, ngay cả những người tự nhận mình khác biệt cũng thường rốt cuộc hình thành những nhóm nhỏ với một diện mạo chung và những quy tắc bất thành văn.", "alts": ["However, even people who claim to be different usually end up forming small groups with a shared look and unwritten rules.", "Nevertheless, even people who say they are different usually end up forming small groups with a shared look and unwritten rules."]}, {"p": 2, "en": "In my view, imitation is deeply rooted in human behaviour.", "vi": "Theo tôi, sự bắt chước ăn sâu trong hành vi của con người.", "alts": ["In my opinion, imitation is deeply rooted in human behaviour.", "I believe imitation is deeply embedded in human behaviour."]}, {"p": 2, "en": "The need to belong drives much of what people choose to buy and wear, because being different can feel risky.", "vi": "Nhu cầu thuộc về một nhóm chi phối phần lớn những gì người ta chọn mua và mặc, vì khác biệt có thể khiến họ cảm thấy rủi ro.", "alts": ["The need to belong drives much of what people choose to buy and wear, because being different can feel risky.", "The need to belong influences much of what people buy and wear, because standing out can feel risky."]}, {"p": 2, "en": "Children and teenagers fear being excluded, so they adopt the brands, phones or hairstyles of their classmates.", "vi": "Trẻ em và thanh thiếu niên sợ bị loại trừ nên chọn những nhãn hiệu, điện thoại hay kiểu tóc giống bạn cùng lớp.", "alts": ["Children and teenagers fear being excluded, so they adopt the brands, phones or hairstyles of their classmates.", "Children and teenagers are afraid of being excluded, so they choose the same brands, phones or hairstyles as their classmates."]}, {"p": 2, "en": "Adults copy the style of their colleagues to be accepted at work, and sports fans wear their team's shirt without seeing it as imitation.", "vi": "Người lớn bắt chước phong cách của đồng nghiệp để được chấp nhận ở nơi làm việc, còn cổ động viên thể thao mặc áo đội nhà mà không coi đó là bắt chước.", "alts": ["Adults copy the style of their colleagues to be accepted at work, and sports fans wear their team's shirt without seeing it as imitation.", "Adults imitate the style of their colleagues to fit in at work, and sports fans wear their team's shirt without regarding it as copying."]}, {"p": 2, "en": "Media and technology then speed the process up.", "vi": "Truyền thông và công nghệ sau đó đẩy nhanh quá trình này.", "alts": ["Media and technology then accelerate the process.", "Media and technology then speed up this process."]}, {"p": 2, "en": "Celebrities and online influencers display products to millions of followers, while advertising presents a particular look as normal.", "vi": "Người nổi tiếng và những người có ảnh hưởng trực tuyến giới thiệu sản phẩm cho hàng triệu người theo dõi, trong khi quảng cáo trình bày một diện mạo nhất định như điều bình thường.", "alts": ["Celebrities and online influencers display products to millions of followers, while advertising presents a particular look as normal.", "Celebrities and online influencers show products to millions of followers, whereas advertising portrays a certain look as normal."]}, {"p": 2, "en": "Social networks allow a new trend to travel around the world within days, turning a single idea into a global craze before most people have time to decide whether they like it.", "vi": "Mạng xã hội cho phép một xu hướng mới lan khắp thế giới chỉ trong vài ngày, biến một ý tưởng đơn lẻ thành cơn sốt toàn cầu trước khi hầu hết mọi người kịp cân nhắc xem mình có thật sự thích nó hay không.", "alts": ["Social networks allow a new trend to spread around the world within days, turning a single idea into a global craze before most people have time to decide whether they like it.", "Social networks let a new trend travel across the globe in a matter of days, turning one idea into a worldwide craze before most people can decide whether they like it."]}, {"p": 3, "en": "In conclusion, personal taste and practical needs do influence what people buy.", "vi": "Tóm lại, sở thích cá nhân và nhu cầu thực tế có ảnh hưởng đến việc người ta mua gì.", "alts": ["In conclusion, personal taste and practical needs do influence what people buy.", "To conclude, personal taste and practical needs do affect what people buy."]}, {"p": 3, "en": "Nevertheless, the desire to belong and the power of the media show that humans have a strong tendency to copy one another.", "vi": "Tuy nhiên, mong muốn được thuộc về một nhóm và sức mạnh của truyền thông cho thấy con người có xu hướng sao chép nhau rất mạnh.", "alts": ["Nevertheless, the desire to belong and the power of the media show that humans have a strong tendency to copy one another.", "However, the desire to belong and the power of the media show that humans have a strong tendency to imitate one another."]}], "no": 27, "type": "Agree or disagree", "words": 337}, {"title": "Controlling Water Use", "prompt": "Some people think they have the right to use as much fresh water as they want, while others believe that governments should strictly control the use of freshwater as it is a limited resource. Discuss both views and give your own opinion?", "paras": ["Opinion is divided on whether people have the right to use as much fresh water as they want or whether governments should strictly regulate its use. I believe government control is necessary, because water is a scarce resource that must be shared fairly.", "Supporters of unrestricted use see water as a basic necessity, and many regard access to it as a human right. Rationing it can therefore feel like an unwelcome intrusion into everyday life. Households already pay for the water they use, so a family may reasonably expect to use it as it chooses. Restrictions can also threaten jobs. Farmers and small businesses depend on water for their income and cannot easily cut their use. A farmer facing a strict quota may lose a harvest, while a small laundry or car wash may have to reduce its opening hours and lay off staff. However, a basic need for drinking and cooking is very different from the unlimited use of water for lawns, pools or industry.", "In my view, government control is necessary to keep enough clean water available for everyone. Supplies are shrinking in many regions of the world as populations grow and droughts become more frequent. Rivers and aquifers are being drawn down faster than rain can refill them, and without limits individuals have no incentive to avoid waste. Cape Town came close to turning off its taps in 2018 after years of drought and rising demand. Fairness is also at stake. Wealthy households with large gardens and swimming pools can use far more water than poor families, who sometimes lack safe drinking water altogether. Setting sensible limits now also protects future generations, who have a right to inherit usable rivers and lakes.", "In conclusion, people understandably resent restrictions on something they need every day. Nevertheless, strict government regulation is the most reliable way to prevent waste and share a limited resource fairly between income groups and generations."], "sents": [{"p": 0, "en": "Opinion is divided on whether people have the right to use as much fresh water as they want or whether governments should strictly regulate its use.", "vi": "Ý kiến chia rẽ về việc liệu người dân có quyền dùng bao nhiêu nước ngọt tùy thích hay chính phủ nên quản lý chặt chẽ việc sử dụng nước.", "alts": ["People disagree about whether individuals may use as much fresh water as they like or whether governments should tightly regulate how it is used.", "Opinion is split on whether people are entitled to use unlimited fresh water or whether the state should strictly control its use."]}, {"p": 0, "en": "I believe government control is necessary, because water is a scarce resource that must be shared fairly.", "vi": "Tôi cho rằng sự kiểm soát của chính phủ là cần thiết, vì nước là nguồn tài nguyên khan hiếm cần được chia sẻ công bằng.", "alts": ["I think government control is needed, as water is a scarce resource that has to be shared fairly.", "In my opinion, government control is necessary because water is scarce and must be shared fairly."]}, {"p": 1, "en": "Supporters of unrestricted use see water as a basic necessity, and many regard access to it as a human right.", "vi": "Những người ủng hộ việc dùng không hạn chế xem nước là nhu cầu thiết yếu, và nhiều người coi việc tiếp cận nước là một quyền con người.", "alts": ["Those who support unrestricted use regard water as a basic necessity, and many see access to it as a human right.", "Advocates of unlimited use view water as a basic need, and many consider access to it a human right."]}, {"p": 1, "en": "Rationing it can therefore feel like an unwelcome intrusion into everyday life.", "vi": "Vì vậy, việc hạn chế lượng nước có thể bị coi là sự can thiệp khó chịu vào đời sống hằng ngày.", "alts": ["Limiting it can therefore seem like an unwelcome intrusion into daily life.", "Rationing water can thus feel like an unwelcome intrusion into everyday life."]}, {"p": 1, "en": "Households already pay for the water they use, so a family may reasonably expect to use it as it chooses.", "vi": "Các hộ gia đình vốn đã trả tiền cho lượng nước họ dùng, nên một gia đình có thể hợp lý mong muốn được dùng nước theo ý mình.", "alts": ["Households already pay for the water they consume, so a family may reasonably expect to use it as it sees fit.", "Families already pay for their water, so they may reasonably expect to use it as they wish."]}, {"p": 1, "en": "Restrictions can also threaten jobs.", "vi": "C
