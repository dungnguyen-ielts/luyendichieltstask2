 nhà khoa học trình bày ý tưởng và giải quyết vấn đề theo những cách độc đáo.", "alts": ["Creativity from art and design also helps scientists explain ideas and solve problems in original ways."]}, {"p": 2, "en": "Society also needs many professionals who are not scientists.", "vi": "Xã hội cũng cần nhiều chuyên gia không phải là nhà khoa học.", "alts": ["Society also requires many professionals who are not scientists."]}, {"p": 2, "en": "Teachers, lawyers, nurses and managers keep schools, courts and hospitals running.", "vi": "Giáo viên, luật sư, y tá và nhà quản lý giữ cho trường học, tòa án và bệnh viện vận hành.", "alts": ["Teachers, lawyers, nurses and managers keep schools, courts and hospitals functioning."]}, {"p": 2, "en": "Students differ in talent, so forcing everyone towards science wastes ability and leaves essential jobs unfilled.", "vi": "Học sinh có năng khiếu khác nhau, nên ép mọi người đi theo hướng khoa học là lãng phí tài năng và để trống những công việc thiết yếu.", "alts": ["Students differ in talent, so pushing everyone towards science wastes ability and leaves essential jobs unfilled.", "Students have different talents, so forcing everyone into science wastes ability and leaves vital jobs unfilled."]}, {"p": 2, "en": "Teachers in particular train the scientists of the future.", "vi": "Đặc biệt, giáo viên chính là người đào tạo các nhà khoa học tương lai.", "alts": ["Teachers in particular educate the scientists of tomorrow."]}, {"p": 2, "en": "A country with brilliant laboratories but few skilled teachers would soon find its research weakening.", "vi": "Một quốc gia có phòng thí nghiệm xuất sắc nhưng ít giáo viên giỏi sẽ sớm thấy nghiên cứu của mình suy yếu.", "alts": ["A country with brilliant laboratories but few skilled teachers would soon see its research weaken.", "A country with excellent laboratories but few skilled teachers would soon find its research declining."]}, {"p": 3, "en": "In conclusion, science deserves generous funding because it drives growth and improves health.", "vi": "Tóm lại, khoa học xứng đáng được tài trợ hào phóng vì nó thúc đẩy tăng trưởng và cải thiện sức khỏe.", "alts": ["To conclude, science merits generous funding as it drives growth and improves health."]}, {"p": 3, "en": "Even so, a country progresses best when it also invests in the humanities, the arts and professional training.", "vi": "Dù vậy, một quốc gia tiến bộ tốt nhất khi cũng đầu tư vào khoa học nhân văn, nghệ thuật và đào tạo nghề nghiệp.", "alts": ["Nevertheless, a nation advances best when it also invests in the humanities, the arts and vocational training."]}], "no": 20, "type": "Agree or disagree", "words": 323}, {"title": "Online Courses", "prompt": "More and more universities are replacing face-to-face teaching with online courses. Do you think this is a positive or negative development?", "paras": ["Many universities are now replacing lectures on campus with online courses, a change that has accelerated in recent years. Although it has clear advantages for many students, I believe it is a negative development overall.", "The attractions of online study are real. Flexibility is the greatest. A student who works full time or looks after children can watch recorded lectures late at night, and people living in remote areas can enrol at a leading university without moving to another city. Mature students who left school years ago can retrain without giving up their income. Cost matters too. Without lecture halls and large teaching staff, universities can charge lower fees, and students save money on rent and transport. These savings allow institutions to offer places to far more students than a physical campus could hold. Recorded sessions can also be replayed before exams, which helps those who struggle to follow a fast explanation. However, convenience is a poor measure of educational quality.", "In my view, online courses weaken the quality of learning. Students lose the interaction that keeps them mo function progressOf(i) {
  const a = stores[i], n = a.length, d = a.filter(s => s.checked || s.gave).length, c = a.filter(s => s.checked);

}

function updHintNote() {

}

function doHint() {
  const a = st[idx], toks = split(S[idx].en);
  const pool = toks.map((t, k) => t.core && !a.shown.has(k) ? k : -1).filter(k => k >= 0);
  if (!pool.length) return;
  a.shown.add(pool[Math.floor(Math.random() * pool.length)]);
  const hl = document.getElementById('hl'); hl.hidden = false; hl.innerHTML = hintHTML(idx);
  updHintNote();
}

function compare(user, target) {
  const tt = norm(target), uu = norm(user);
  const bag = new Map(); uu.forEach(w => bag.set(w, (bag.get(w) || 0) + 1));
  const hit = tt.map(w => { const c = bag.get(w) || 0; if (c > 0) { bag.set(w, c - 1); return true; } return false; });
  const tbag = new Map(); tt.forEach(w => tbag.set(w, (tbag.get(w) || 0) + 1));
  const extra = uu.map(w => { const c = tbag.get(w) || 0; if (c > 0) { tbag.set(w, c - 1); return false; } return true; });
  return { tt, uu, hit, extra, matched: hit.filter(Boolean).length };
}

function doCheck() {

  const c = bestCmp(a.text, S[idx]);
  a.checked = true; a.matched = c.matched; a.total = c.tt.length; a.pct = Math.round(100 * c.matched / c.tt.length);
  lockUI(); showResult();
}
function doGive() { const a = st[idx]; a.gave = true; a.pct = 0; a.total = norm(S[idx].en).length; lockUI(); showResult(); }

function keyTermsFor(en){ const lt = en.toLowerCase(); return (VOCAB[String(DATA.no)] || []).filter(e => lt.includes(e[0].toLowerCase())); }
function termUsed(term, userText){
  const utoks = norm(userText);
  const words = term.toLowerCase().split(/[^a-z']+/).filter(w => w.length > 3);
  if (!words.length) return userText.toLowerCase().includes(term.toLowerCase());
  return words.every(w => { const stem = w.slice(0, Math.max(3, w.length - 3)); return utoks.some(u => u.startsWith(stem)); });
}
function bestCmp(user, s) {
  let best = null;
  [s.en].concat(s.alts || []).forEach((v, i) => { const c = compare(user, v); c.ver = v; c.vi = i; if (!best || c.matched / c.tt.length > best.matched / best.tt.length) best = c; });
  return best;
}
function showResult() {

    const cls = c ? (c.hit[tIdx] ? 'ok' : 'miss') : '';
    tIdx++;

  }).join(' ');

    const raw = a.text.trim().split(/\s+/); let k = 0;
    userHTML = raw.map(w => { const n = norm(w); if (!n.length) return esc(w); const ex = n.map(() => c.extra[k++]).some(Boolean); return ex ? `<span class="extra">${esc(w)}</span>` : esc(w); }).join(' ');
  }
  const kts = keyTermsFor(s.en);
  const ktHTML = kts.length ? `<div class="kts"><small>Từ và cụm đáng học trong câu này${c ? ' (xanh: bạn đã dùng hoặc dùng dạng gần giống)' : ''}</small>${kts.map(e => `<div class="kt ${c && termUsed(e[0], a.text) ? 'used' : ''}"><b>${esc(e[0])}</b><span>${esc(e[2])}</span></div>`).join('')}</div>` : '';
  const hintTxt = a.shown.size ? ` · dùng ${a.shown.size} gợi ý` : '';
  res.hidden = false;
  res.innerHTML = `
    ${c ? `<div class="score"><strong>${a.self ? 'Đúng nghĩa' : a.pct + '%'}</strong><span>${a.self ? 'Bạn tự đánh giá bản dịch của mình đúng nghĩa' : a.matched + '/' + a.total + ' từ trùng với cách dịch mẫu gần nhất, chỉ để tham khảo'}${hintTxt}</span></div>` : `<div class="score"><span>Đã hiện đáp án${hintTxt}</span></div>`}
    ${c ? `<p class="cmp"><small>Câu của bạn (gạch chấm: từ không có trong bản mẫu)</small>${userHTML}</p>` : ''}
    <p class="cmp"><small>${c ? (c.vi > 0 ? 'Cách dịch mẫu gần với câu của bạn nhất (nền vàng: từ bạn chưa dùng)' : 'Bản mẫu (nền vàng: từ bạn chưa dùng)') : 'Bản mẫu'}</small>${target}</p>
    <div class="cmp alts"><small>Các cách dịch đúng khác</small>${others.map(v => `<p>${esc(v)}</p>`).join('')}</div>
    ${ktHTML}
    ${c ? `<p class="fine">Một câu tiếng Việt có thể dịch theo nhiều cách đúng. Nếu câu của bạn đúng nghĩa và đúng ngữ pháp dù khác bản mẫu, hãy tự đánh dấu bên dưới.</p><div class="actions"><button class="ghost" id="selfok">${a.self ? 'Bỏ đánh dấu' : 'Bản dịch của mình cũng đúng nghĩa'}</button></div>` : ''}`;
  res.insertAdjacentHTML('beforeend', '<div class="actions" style="margin-top:8px"><button class="primary" id="redo">Làm lại câu này</button></div>');
  document.getElementById('redo').onclick = () => { Object.assign(a, { text: '', shown: new Set(), checked: false, gave: false, pct: 0, matched: 0, self: false, raw: undefined }); renderTranslate(); };
  const so = document.getElementById('selfok');
  if (so) so.onclick = () => { if (a.raw === undefined) a.raw = a.pct; a.self = !a.self; a.pct = a.self ? 100 : a.raw; showResult(); };
}

function renderDone() {
  stage = 'done'; setCrumb();
  const done = st.filter(s => s.checked), avg = done.length ? Math.round(done.reduce((x, s) => x + s.pct, 0) / done.length) : 0;
  const hints = st.reduce((x, s) => x + s.shown.size, 0), gave = st.filter(s => s.gave).length;
  view.innerHTML = `
  <section class="card">
    <p class="eyebrow">Kết quả · Essay ${DATA.no}: ${esc(DATA.title)}</p>
    <div class="sum">
      <div><b>${avg}%</b><span>trùng từ trung bình (${done.length}/${S.length} câu đã kiểm tra)</span></div>
      <div><b>${hints}</b><span>lượt gợi ý</span></div>
      <div><b>${gave}</b><span>câu xem đáp án</span></div>
    </div>
  </section>
  <section class="card" style="margin-top:20px">
    <p class="eyebrow">Từng câu</p>
    <ol class="rows" style="list-style:none">${S.map((s, i) => `<li><span class="n">${i + 1}</span><span class="t">${esc(s.vi)}</span><span class="p" style="color:${st[i].checked ? (st[i].pct >= 70 ? 'var(--moss)' : st[i].pct >= 40 ? 'var(--ochre)' : 'var(--clay)') : 'var(--muted)'}">${st[i].checked ? st[i].pct + '%' : st[i].gave ? 'xem đáp án' : 'bỏ qua'}</span></li>`).join('')}</ol>
  </section>
  ${vocabHTML()}
  <div class="actions" style="margin-top:20px">
    <button class="primary" id="again">Làm lại từ đầu</button>
    <button class="ghost" id="rr">Đọc lại bài</button>
    <button class="ghost" id="hm">Về danh sách bài</button>
  </div>`;
  mountVocab();
  document.getElementById('again').onclick = () => { st.forEach(s => { s.text = ''; s.shown = new Set(); s.checked = false; s.gave = false; s.pct = 0; }); idx = 0; renderTranslate(); };
  document.getElementById('rr').onclick = renderRead;
  document.getElementById('hm').onclick = renderHome;
}
renderHome();
</script>

</body></html>
